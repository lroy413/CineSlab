/* Suggested 35mm-equivalent focal length per shot type. These are starting
   points, not rules — the reason each one is what it is matters more than
   the number, so the reason travels with it. */
const SHOT_FOCAL = {
  'ESTABLISHING':     { mm:24,  why:'Wide enough to show where you are and how the space connects.' },
  'WIDE':             { mm:28,  why:'Holds the whole action without bending the room.' },
  'MEDIUM':           { mm:35,  why:'Close to how the eye reads a person at conversational distance.' },
  'CLOSE-UP':         { mm:85,  why:'Long enough to flatter a face and throw the background off.' },
  'EXTREME CLOSE-UP': { mm:85,  why:'Compression keeps the detail clean instead of distorted.' },
  'OTS':              { mm:50,  why:'Keeps the foreground shoulder in proportion to the far face.' },
  'TWO-SHOT':         { mm:35,  why:'Fits two people without pushing them apart.' },
  'INSERT':           { mm:50,  why:'Natural perspective on an object, no wide-angle stretch.' },
  'POV':              { mm:28,  why:'Roughly matches human peripheral framing.' },
  'CUTAWAY':          { mm:50,  why:'Neutral, so it cuts against anything.' }
};
/* If the shot list already names a lens, that beats any default we'd pick. */
function focalForShot(shot){
  const typed = (shot.lens || '').match(/(\d+(?:\.\d+)?)\s*mm/i);
  if(typed){
    return { mm: Math.round(parseFloat(typed[1])), why:'From the shot list — this was planned in CineSlab.', fromList:true };
  }
  const t = SHOT_FOCAL[(shot.type||'').toUpperCase()];
  return t ? Object.assign({}, t) : { mm:35, why:'A neutral default — no shot type was set.' };
}
function nearestStop(mm){
  return FOCAL_STOPS.reduce((a,b)=>Math.abs(b-mm) < Math.abs(a-mm) ? b : a, FOCAL_STOPS[0]);
}
/* Load a planned shot into the camera: sets scene, shot number and focal
   length so the take that comes out carries the right slate. */
async function loadShot(shot){
  const f = focalForShot(shot);
  state.settings.scene = shot.scene || '';
  state.settings.shotNum = shot.shotNum || '';
  state.settings.takeNum = 1;
  await setFocal(nearestStop(f.mm));
  state.view = 'shoot';
  render();
  toast('Loaded ' + (shot.scene ? 'Sc ' + shot.scene + ' ' : '') + (shot.shotNum || shot.type || '') + ' at ' + nearestStop(f.mm) + 'mm.');
}

/* =========================================================
   TEACHING LAYER (Phase 1 slice)

   The full fundamentals section — diagrammed 180-degree rule, composition
   before/afters, live depth-of-field — is Phase 2 in the product doc.
   What ships here is the part that pays for itself immediately: a plain
   explanation attached to every control you can actually touch, plus a
   glossary. It's switchable off once you're past needing it.
========================================================= */
const EXPLAIN = {
  focal: 'Focal length decides how much of the world fits in frame and how near things feel to each other. Short (24mm) exaggerates depth and space; long (85mm) compresses it and separates a face from its background. Same subject size, completely different feeling.',
  ei: 'ISO / EI is how hard the sensor’s signal is amplified. Higher lets you shoot in less light, and pays for it in noise. Move it last — light, aperture and shutter first.',
  shutter: 'Shutter angle is how much of each frame’s time the sensor is actually exposed. 180° is the standard because it gives the amount of motion blur cinema has trained us to read as natural. Narrower (45°) makes movement crisp and jittery. Wider (360°) smears it dreamily.',
  wb: 'White balance tells the camera what colour the light is, so white comes out white. Low Kelvin numbers are warm indoor light; high numbers are cool daylight and shade. Set it once per lighting setup and leave it — drifting mid-scene is a continuity problem.',
  fps: 'Frame rate is how many frames a second you capture. Match your project’s rate. Capturing higher than you play back is how slow motion is made.',
  lut: 'A LUT is a colour lookup table — a look. Here it sits on the viewfinder so you can judge the image the way it will finally be seen, without touching the recording. Bake it in only when you are sure, because it cannot be taken back out.',
  zebra: 'Zebras stripe the parts of the image that are at or over your brightness threshold. It’s the fastest read there is on whether you are about to lose the highlights.',
  peaking: 'Focus peaking outlines the edges that are sharply in focus. On a small phone screen it’s far more reliable than trusting your eyes.',
  waveform: 'A waveform plots brightness across the frame — left to right matches the image, bottom to top is dark to bright. The line at the top is clipping: anything touching it has lost detail for good.',
  histogram: 'A histogram counts how many pixels sit at each brightness. Piled against the right edge means blown highlights; against the left, crushed shadows.',
  timelapse: 'Interval shooting takes one frame every so often and plays them back at normal speed, so hours become seconds. The interval is what sets the pace of the finished clip.',
  digital: 'A digital crop cuts into the middle of the sensor and enlarges it. It frames like a longer lens, but it does NOT compress depth the way a real long lens does, and it throws away resolution. That’s why it’s labelled.'
};
const GLOSSARY = [
  ['Shutter angle', 'How long each frame is exposed, given as a fraction of the frame interval. 180° at 24fps is 1/48 of a second.'],
  ['EI vs ISO', 'ISO is the sensor’s rated sensitivity. EI (Exposure Index) is the rating you choose to shoot at, which may differ deliberately.'],
  ['ND filter', 'A neutral grey filter that cuts light without changing colour. It’s how you keep a 180° shutter wide open in daylight.'],
  ['Colour temperature', 'The colour of a light source in Kelvin. Candlelight ≈1800K, tungsten ≈3200K, midday sun ≈5600K, open shade ≈7500K.'],
  ['Depth of field', 'How much of the scene is acceptably sharp. Wider aperture, longer lens and closer subject each make it shallower.'],
  ['Exposure triangle', 'Aperture, shutter and ISO. Change one and you must change another to hold the same exposure.'],
  ['Clipping', 'Detail lost because the signal hit the top or bottom of what the sensor can record. It cannot be recovered in post.'],
  ['180-degree rule', 'Keep the camera on one side of an imaginary line through your subjects, so screen direction stays consistent between cuts. (Full lesson lands in Phase 2.)'],
  ['Timecode', 'A running clock stamped on the footage so picture and sound can be lined up in the edit.'],
  ['LUT', 'Lookup table — a colour transform. Used as a viewing look on set, or as a starting point for the grade.'],
  ['Interval shooting', 'Taking frames at a fixed spacing rather than continuously, to compress a long event into a short clip.']
];
function explain(key){
  if(!state.settings.learnMode) return '';
  const t = EXPLAIN[key];
  return t ? `<div class="explain">${esc(t)}</div>` : '';
}

/* =========================================================
   SHOOT VIEW — viewfinder, HUD, control deck
========================================================= */
function renderShoot(){
  renderHud();

function hudOn(key){ return state.settings.hudModules.indexOf(key) !== -1; }

function renderHud(){
  const hud = document.getElementById('hud');
  const cam = state.cam;
  if(!cam.stream){
    hud.innerHTML = '';
    return;
  }
  const zones = { tl:[], tr:[], bl:[], br:[] };
  const mod = (key, k, v, cls)=>`<div class="hud-mod ${cls||''}" data-hud="${key}">
      <span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;

  if(hudOn('tc'))      zones.tl.push(mod('tc','TC', tcString(), 'wide'));
  if(hudOn('lens'))    zones.tl.push(mod('lens','Lens', state.settings.focal + 'mm'));
  if(hudOn('ei'))      zones.tl.push(mod('ei','EI', '—'));
  if(hudOn('shutter')) zones.tl.push(mod('shutter','Shutter', state.settings.shutterAngle + '°'));
  if(hudOn('lut'))     zones.tl.push(mod('lut','Look', (currentLut() && currentLut().name) || 'None'));
  if(hudOn('wb'))      zones.tr.push(mod('wb','WB','—'));
  if(hudOn('iris'))    zones.tr.push(mod('iris','Iris','—'));
  if(hudOn('fps'))     zones.tr.push(mod('fps','FPS', state.settings.fps));
  if(hudOn('focus'))   zones.tr.push(mod('focus','Focus','—'));
  if(hudOn('battery')) zones.tr.push(mod('battery','Batt','—'));
  if(hudOn('waveform'))  zones.bl.push('<div class="hud-scope"><canvas id="wfCanvas" width="192" height="96"></canvas></div>');
  if(hudOn('histogram')) zones.bl.push('<div class="hud-scope"><canvas id="hgCanvas" width="192" height="96"></canvas></div>');
  if(hudOn('audio')) zones.br.push(`<div class="hud-mod hud-meters">
      <span class="k">Audio</span>
      <div class="track"><div class="fill" id="audFill"></div></div>
      <span class="k" id="audDb" style="text-align:right;">—</span></div>`);

  // Digital-crop flag sits with the lens readout, never hidden by a preset:
  // the one thing a viewer must not be quietly wrong about is whether the
  // image is optical.
  const plan = planFocal(state.settings.focal);
  if(plan.digital && !plan.clamped){
    zones.tl.push('<div class="hud-mod"><span class="digital-flag">Digital ' + plan.zoom.toFixed(1) + '×</span></div>');
  }
  const row = (cls, a, b)=> (a.length || b.length)
    ? `<div class="hud-row ${cls}"><div class="hud-group">${a.join('')}</div>
       <div class="hud-group right">${b.join('')}</div></div>` : '';
  hud.innerHTML = row('hud-top', zones.tl, zones.tr) + row('hud-bottom', zones.bl, zones.br);
  document.getElementById('recBorder').className = 'rec-border' + (state.rec.active && hudOn('recborder') ? ' on' : '');
}

let hudTimer = null, scopeTick = 0;
function startHudTicker(){
  if(hudTimer) return;
  hudTimer = setInterval(()=>{
    if(state.view !== 'shoot' || !state.cam.stream) return;
    const live = state.cam.live || {}, s = state.settings;
    const set = (key, val, cls)=>{
      const el = document.querySelector('[data-hud="' + key + '"] .v');
      if(!el) return;
      el.textContent = val;
      el.className = 'v' + (cls ? ' ' + cls : '');
    };
    if(state.rec.active) set('tc', tcString(), 'rec');
    else set('tc', tcString());
    set('lens', s.focal + 'mm');
    set('ei', live.iso ? String(live.iso) : (camSupports('iso') ? (s.ei || 'Auto') : 'n/a'));
    set('shutter', live.exposureTime != null
      ? Math.round(secondsToAngle(live.exposureTime/10000, live.frameRate || s.fps)) + '°'
      : s.shutterAngle + '°');
    set('wb', live.colorTemperature ? live.colorTemperature + 'K'
      : (camSupports('colorTemperature') ? (s.wbKelvin ? s.wbKelvin + 'K' : 'Auto') : 'Auto'));
    set('iris', live.aperture ? 'f/' + live.aperture : 'Fixed');
    set('fps', Math.round(live.frameRate || s.fps));
    set('focus', live.focusDistance != null ? (live.focusDistance < 1
      ? Math.round(live.focusDistance*100) + 'cm' : live.focusDistance.toFixed(1) + 'm') : 'n/a');
    const b = batteryReadout();
    set('battery', b.pct == null ? 'n/a'
      : b.pct + '%' + (b.mins != null ? ' · ' + b.mins + 'm' : (b.charging ? ' · chg' : '')),
      (b.pct != null && b.pct <= 15 && !b.charging) ? 'warn' : '');
    set('lut', (currentLut() && currentLut().name) || 'None');

    const db = audioPeakDb();
    const fill = document.getElementById('audFill'), dbEl = document.getElementById('audDb');
    if(fill && db != null){
      const pct = clamp((db + 60) / 60 * 100, 0, 100);
      fill.style.width = pct + '%';
      fill.className = 'fill' + (db > -6 ? ' hot' : '');
      if(dbEl) dbEl.textContent = db <= -99 ? '—' : Math.round(db) + ' dB';
    }
    // Scopes are heavier than text, so they run at roughly a third the rate.
    scopeTick++;
    if(scopeTick % 3 === 0){
      const wf = document.getElementById('wfCanvas'), hg = document.getElementById('hgCanvas');
      if(wf || hg){
        const img = scopeSample();
        if(wf) drawWaveform(wf, img);
        if(hg) drawHistogram(hg, img);
      }
    }
    if(state.rec.active){
      const el = document.getElementById('recClock');
      if(el) el.textContent = fmtClock(state.rec.elapsed);
    }
    if(state.lapse.active){
      const el = document.getElementById('lapseStatus');
      if(el){
        const left = Math.max(0, (state.lapse.endAt - Date.now())/1000);
        el.textContent = state.lapse.shots + ' frames · ' + fmtDuration(left) + ' left';
      }
    }
  }, 150);
}

      <button class="rec-btn ${state.rec.active?'recording':''}" id="recBtn" aria-label="${state.rec.active?'Stop recording':'Start recording'}"></button>

function deckPanelHtml(panel){
  const s = state.settings;
  if(panel === 'ei'){
    const r = capRange('iso');
    if(!camSupports('iso')) return lockedPanel('iso', 'ei');
    return `
      <div class="switch"><span class="lbl">Auto exposure</span>
        <input type="checkbox" id="pAutoExp" ${s.autoExposure?'checked':''}></div>
      <div class="row"><input type="range" id="pEi" min="${r.min}" max="${r.max}" step="${r.step||1}"
        value="${s.ei || state.cam.live.iso || r.min}" ${s.autoExposure?'disabled':''}>
        <span class="val" id="pEiVal">${s.ei || state.cam.live.iso || r.min}</span></div>
      ${explain('ei')}`;
  }
  if(panel === 'shutter'){
    const locked = !camSupports('exposureTime');
    return `
      ${locked ? `<div class="note warn" style="margin-top:10px;">${esc(CAP_NOTES.exposureTime)} The angle you pick is still written into the camera report.</div>` : ''}
      <div class="row" style="flex-wrap:wrap;gap:6px;">
        ${SHUTTER_ANGLES.map(a=>`<button class="lens ${Math.abs(s.shutterAngle-a)<0.01?'active':''}" data-angle="${a}">${a}°</button>`).join('')}
      </div>
      <div class="row"><span class="val" style="min-width:auto;">${esc(shutterLabel(s.shutterAngle, s.fps))}</span></div>
      ${explain('shutter')}`;
  }
  if(panel === 'wb'){
    if(!camSupports('colorTemperature')) return lockedPanel('colorTemperature', 'wb');
    const r = capRange('colorTemperature');
    return `
      <div class="switch"><span class="lbl">Auto white balance</span>
        <input type="checkbox" id="pAutoWb" ${s.autoWb?'checked':''}></div>
      <div class="row" style="flex-wrap:wrap;gap:6px;">
        ${WB_PRESETS.filter(p=>p.k>=r.min && p.k<=r.max).map(p=>
          `<button class="lens ${s.wbKelvin===p.k?'active':''}" data-k="${p.k}">${p.k}K</button>`).join('')}
      </div>
      <div class="row"><input type="range" id="pWb" min="${r.min}" max="${r.max}" step="${r.step||100}"
        value="${s.wbKelvin || state.cam.live.colorTemperature || 5600}" ${s.autoWb?'disabled':''}>
        <span class="val" id="pWbVal">${s.wbKelvin || state.cam.live.colorTemperature || 5600}K</span></div>
      ${explain('wb')}`;
  }
  if(panel === 'fps'){
    return `<div class="row" style="flex-wrap:wrap;gap:6px;">
        ${FPS_OPTIONS.map(f=>`<button class="lens ${s.fps===f?'active':''}" data-fps="${f}">${f}</button>`).join('')}
      </div>
      ${camSupports('frameRate') ? '' : `<div class="explain">${esc(CAP_NOTES.frameRate)} The camera will shoot at whatever it prefers; this sets the rate used for timecode and shutter maths.</div>`}
      ${explain('fps')}`;
  }
  if(panel === 'look'){
    if(!state.glReady) return `<div class="note warn" style="margin-top:10px;">This browser has no WebGL, so looks can’t be previewed. Everything else still works.</div>`;
    return `<div class="row" style="flex-wrap:wrap;gap:6px;">
        <button class="lens ${!s.lutId?'active':''}" data-lut="">None</button>
        ${state.luts.map(l=>`<button class="lens ${s.lutId===l.id?'active':''}" data-lut="${esc(l.id)}">${esc(l.name)}</button>`).join('')}
      </div>
      <div class="row"><span class="k tiny muted" style="width:56px;">Strength</span>
        <input type="range" id="pLutMix" min="0" max="1" step="0.05" value="${s.lutStrength}">
        <span class="val" id="pLutMixVal">${Math.round(s.lutStrength*100)}%</span></div>
      <div class="switch"><span class="lbl">Bake the look into the recording
        <small>Off = preview only, footage stays clean and gradeable. On = permanent.</small></span>
        <input type="checkbox" id="pBake" ${s.recordGraded?'checked':''}></div>
      ${explain('lut')}`;
  }
  if(panel === 'assist'){
    if(!state.glReady) return `<div class="note warn" style="margin-top:10px;">Zebras and peaking need WebGL, which this browser doesn’t have.</div>`;
    return `
      <div class="switch"><span class="lbl">Zebras<small>Stripes anything at or above the level.</small></span>
        <input type="checkbox" id="pZebra" ${s.zebra?'checked':''}></div>
      <div class="row"><input type="range" id="pZebraLvl" min="50" max="109" step="1" value="${s.zebraLevel}">
        <span class="val" id="pZebraVal">${s.zebraLevel} IRE</span></div>
      <div class="switch"><span class="lbl">Focus peaking<small>Outlines what is sharply in focus.</small></span>
        <input type="checkbox" id="pPeak" ${s.peaking?'checked':''}></div>
      <div class="row"><input type="range" id="pPeakLvl" min="0.04" max="0.5" step="0.01" value="${s.peakLevel}">
        <span class="val" id="pPeakVal">${Math.round(s.peakLevel*100)}</span></div>
      ${explain('zebra')}${explain('peaking')}`;
  }
  return '';
}
function lockedPanel(cap, explainKey){
  return `<div class="note warn" style="margin-top:10px;">${esc(CAP_NOTES[cap] || 'This device doesn’t expose that control.')}
    <br><br>The camera will decide it automatically, and the report records what it actually used.</div>
    ${explain(explainKey)}`;
}
function wireDeckPanel(panel){
  const s = state.settings;
  const save = ()=>{ debouncedSaveSettings(); };
  if(panel === 'ei'){
    const t = document.getElementById('pAutoExp');
    if(t) t.onchange = async ()=>{ s.autoExposure = t.checked; save(); await applyAllControls(); renderDeck(); };
    const r = document.getElementById('pEi');
    if(r) r.oninput = ()=>{
      s.ei = Number(r.value);
      document.getElementById('pEiVal').textContent = r.value;
      save(); applyIso();
    };
  }
  if(panel === 'shutter'){
    $$('[data-angle]').forEach(b=>{
      b.onclick = async ()=>{ s.shutterAngle = Number(b.dataset.angle); save(); await applyShutter(); renderDeck(); };
    });
  }
  if(panel === 'wb'){
    const t = document.getElementById('pAutoWb');
    if(t) t.onchange = async ()=>{ s.autoWb = t.checked; save(); await applyAllControls(); renderDeck(); };
    $$('[data-k]').forEach(b=>{
      b.onclick = async ()=>{ s.wbKelvin = Number(b.dataset.k); s.autoWb = false; save(); await applyWb(); renderDeck(); };
    });
    const r = document.getElementById('pWb');
    if(r) r.oninput = ()=>{
      s.wbKelvin = Number(r.value);
      document.getElementById('pWbVal').textContent = r.value + 'K';
      save(); applyWb();
    };
  }
  if(panel === 'fps'){
    $$('[data-fps]').forEach(b=>{
      b.onclick = async ()=>{
        s.fps = Number(b.dataset.fps); save();
        if(camSupports('frameRate')) await applyCam({ frameRate: s.fps });
        await applyShutter();
        renderDeck();
      };
    });
  }
  if(panel === 'look'){
    $$('[data-lut]').forEach(b=>{
      b.onclick = ()=>{ s.lutId = b.dataset.lut || null; save(); renderDeck(); renderHud(); };
    });
    const r = document.getElementById('pLutMix');
    if(r) r.oninput = ()=>{
      s.lutStrength = Number(r.value);
      document.getElementById('pLutMixVal').textContent = Math.round(s.lutStrength*100) + '%';
      save();
    };
    const bake = document.getElementById('pBake');
    if(bake) bake.onchange = ()=>{ s.recordGraded = bake.checked; save(); };
  }
  if(panel === 'assist'){
    const z = document.getElementById('pZebra');
    if(z) z.onchange = ()=>{ s.zebra = z.checked; save(); renderDeck(); };
    const zl = document.getElementById('pZebraLvl');
    if(zl) zl.oninput = ()=>{ s.zebraLevel = Number(zl.value); document.getElementById('pZebraVal').textContent = zl.value + ' IRE'; save(); };
    const p = document.getElementById('pPeak');
    if(p) p.onchange = ()=>{ s.peaking = p.checked; save(); renderDeck(); };
    const pl = document.getElementById('pPeakLvl');
    if(pl) pl.oninput = ()=>{ s.peakLevel = Number(pl.value); document.getElementById('pPeakVal').textContent = Math.round(s.peakLevel*100); save(); };
  }
}

   TIME-LAPSE VIEW
========================================================= */
function renderTimelapse(main){
  const tl = state.settings.timelapse;
  const plan = lapsePlan(tl);
  const warns = lapseWarnings(plan, tl);
  const subj = LAPSE_SUBJECTS[tl.subject];
  const solveInterval = tl.mode === 'solveInterval';

  main.innerHTML = `<div class="page">
    <div class="view-head">
      <h2>Time-lapse</h2>
      <p>Work out the interval before you get there. Needs no camera — plan on the bus, shoot later, on this phone or on a real camera.</p>
    </div>

    <div class="paper">
      <div class="field">
        <label>What are you solving for?</label>
        <select id="tlMode">
          <option value="solveInterval" ${solveInterval?'selected':''}>I know the clip length I want → give me the interval</option>
          <option value="solveDuration" ${!solveInterval?'selected':''}>I know my interval → tell me the clip I'll get</option>
        </select>
      </div>
      <div class="form-grid">
        ${solveInterval ? `
          <div class="field"><label>Final clip length</label>
            <input type="number" id="tlFinal" min="0.5" step="0.5" value="${tl.finalSeconds}"><span class="tiny muted">seconds</span></div>
          <div class="field"><label>Playback frame rate</label>
            <select id="tlFps">${[24,25,30,60].map(f=>`<option ${tl.playbackFps===f?'selected':''}>${f}</option>`).join('')}</select></div>
          <div class="field"><label>Time you'll be shooting</label>
            <input type="number" id="tlShootMin" min="1" step="1" value="${Math.round(tl.shootSeconds/60)}"><span class="tiny muted">minutes</span></div>
        ` : `
          <div class="field"><label>Interval between frames</label>
            <input type="number" id="tlInterval" min="0.1" step="0.1" value="${tl.interval}"><span class="tiny muted">seconds</span></div>
          <div class="field"><label>Time you'll be shooting</label>
            <input type="number" id="tlShootMin" min="1" step="1" value="${Math.round(tl.shootSeconds/60)}"><span class="tiny muted">minutes</span></div>
          <div class="field"><label>Playback frame rate</label>
            <select id="tlFps">${[24,25,30,60].map(f=>`<option ${tl.playbackFps===f?'selected':''}>${f}</option>`).join('')}</select></div>
        `}
      </div>
      <div class="field"><label>Subject</label>
        <select id="tlSubject">
          ${Object.keys(LAPSE_SUBJECTS).map(k=>`<option value="${k}" ${tl.subject===k?'selected':''}>${esc(LAPSE_SUBJECTS[k].label)}</option>`).join('')}
        </select>
      </div>
      ${subj ? `<div class="tiny muted" style="line-height:1.55;">${esc(subj.note)} Usual interval: ${fmtInterval(subj.min)}–${fmtInterval(subj.max)}.</div>
        <div class="btn-row" style="margin-top:10px;"><button class="btn btn-outline btn-sm" id="tlUseTypical">Use ${fmtInterval(subj.typical)} — the typical interval</button></div>` : ''}
      <div class="form-grid" style="margin-top:14px;">
        <div class="field"><label>Resolution</label>
          <select id="tlRes">${Object.keys(LAPSE_RES).map(k=>`<option value="${k}" ${tl.resolution===k?'selected':''}>${LAPSE_RES[k].label}</option>`).join('')}</select></div>
        <div class="field"><label>Stored as</label>
          <select id="tlCodec">${Object.keys(LAPSE_CODECS).map(k=>`<option value="${k}" ${tl.codec===k?'selected':''}>${esc(LAPSE_CODECS[k].label)}</option>`).join('')}</select></div>
      </div>
    </div>

    <div class="section-title">The numbers</div>
    <div class="paper">
      <table class="data">
        <tr><th>Interval between frames</th><td class="mono">${esc(fmtInterval(plan.interval))}</td></tr>
        <tr><th>Total frames to shoot</th><td class="mono">${plan.frames.toLocaleString()}</td></tr>
        <tr><th>Time on location</th><td class="mono">${esc(fmtDuration(plan.shootSeconds))}</td></tr>
        <tr><th>Finished clip length</th><td class="mono">${esc(fmtDuration(plan.finalSeconds))} at ${plan.fps}fps</td></tr>
        <tr><th>Storage</th><td class="mono">${esc(fmtBytes(plan.storageBytes))} <span class="muted tiny">(${esc(plan.codec.label)}, ${esc(plan.res.label)})</span></td></tr>
        <tr><th>Battery</th><td class="mono">~${Math.round(plan.batteryPct)}% <span class="muted tiny">(≈${plan.perHour}%/hr with the screen on)</span></td></tr>
      </table>
      <div class="tiny muted" style="margin-top:10px;line-height:1.5;">
        Storage and battery are planning estimates — real files move with how much detail is in the scene.
      </div>
    </div>

    ${warns.map(w=>`<div class="note ${w.level==='warn'?'warn':''}">${esc(w.text)}</div>`).join('')}

    <div class="section-title">Shoot it here</div>
    <div class="paper">
      ${!state.cam.stream ? `<div class="empty">Start the camera on the Shoot tab to capture a sequence on this device.</div>` : `
        <div class="list-item"><div class="grow">
          <div class="ttl">${state.lapse.active ? 'Shooting' : (state.lapse.frames.length ? 'Captured' : 'Ready')}</div>
          <div class="sub" id="lapseStatus">${state.lapse.active
            ? state.lapse.shots + ' frames'
            : (state.lapse.frames.length
                ? state.lapse.frames.length + ' frames held in memory — assemble or discard before you leave this page'
                : 'One frame every ' + fmtInterval(plan.interval) + ', for ' + fmtDuration(plan.shootSeconds))}</div>
        </div></div>
        <div class="btn-row" style="margin-top:12px;">
          ${state.lapse.active
            ? `<button class="btn btn-danger" id="tlStop">Stop</button>`
            : `<button class="btn btn-tape" id="tlStart" ${plan.frames > MAX_LAPSE_FRAMES ? 'disabled' : ''}>Start shooting</button>`}
          ${state.lapse.frames.length && !state.lapse.active
            ? `<button class="btn btn-chalk" id="tlAssemble">Assemble clip</button>
               <button class="btn btn-outline" id="tlDiscard">Discard frames</button>` : ''}
        </div>
        ${plan.frames > MAX_LAPSE_FRAMES ? `<div class="tiny muted" style="margin-top:8px;">Too many frames to shoot in-app. The plan above is still good for a real camera.</div>` : ''}
        <div class="tiny muted" style="margin-top:10px;line-height:1.5;">
          Frames are held in memory until you assemble them, so don't close the tab mid-shoot.
          Assembly replays them at ${plan.fps}fps and records the result, so it takes about ${esc(fmtDuration(plan.finalSeconds))}.
        </div>`}
    </div>
    ${state.settings.learnMode ? `<div class="paper"><h3>Why this works</h3>${explain('timelapse')}</div>` : ''}
  </div>`;

  const upd = (fn)=>{ fn(); saveSettings(); renderTimelapse(main); };
  const on = (id, ev, fn)=>{ const el = document.getElementById(id); if(el) el[ev] = fn; };

  on('tlMode','onchange', e=>upd(()=>{ tl.mode = e.target.value; }));
  on('tlFinal','oninput', e=>upd(()=>{ tl.finalSeconds = Math.max(0.1, Number(e.target.value)||1); }));
  on('tlInterval','oninput', e=>upd(()=>{ tl.interval = Math.max(0.1, Number(e.target.value)||1); }));
  on('tlShootMin','oninput', e=>upd(()=>{ tl.shootSeconds = Math.max(1, (Number(e.target.value)||1) * 60); }));
  on('tlFps','onchange', e=>upd(()=>{ tl.playbackFps = Number(e.target.value); }));
  on('tlSubject','onchange', e=>upd(()=>{ tl.subject = e.target.value; }));
  on('tlRes','onchange', e=>upd(()=>{ tl.resolution = e.target.value; }));
  on('tlCodec','onchange', e=>upd(()=>{ tl.codec = e.target.value; }));
  on('tlUseTypical','onclick', ()=>upd(()=>{
    const t = LAPSE_SUBJECTS[tl.subject];
    if(!t) return;
    if(tl.mode === 'solveDuration'){ tl.interval = t.typical; }
    else {
      // Hold the clip length, move the location time to land on the typical interval.
      tl.shootSeconds = Math.round(t.typical * tl.finalSeconds * tl.playbackFps);
    }
  }));
  on('tlStart','onclick', ()=>startLapse());
  on('tlStop','onclick', ()=>stopLapse());
  on('tlAssemble','onclick', ()=>assembleLapse());
  on('tlDiscard','onclick', async ()=>{
    if(await openConfirmModal('Discard frames', 'Throw away the ' + state.lapse.frames.length + ' captured frames?', 'Discard')) discardLapse();
  });
}

        <h3>Sign in to CineSlab</h3>

        <div class="field"><label>Email</label><input type="email" id="sbEmail" autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" id="sbPass" autocomplete="current-password"></div>
        <button class="btn btn-tape" id="sbGo">Sign in</button>

      <div class="paper">
        <div class="list-item"><div class="grow">
          <div class="ttl">Signed in</div><div class="sub">${esc(sh.email)}</div>
        </div><button class="btn btn-outline btn-sm" id="sbOut">Sign out</button></div>
        <div class="field" style="margin-top:12px;"><label>Project</label>
          <select id="sbProj">
            <option value="">Choose a project…</option>
            ${sh.projects.map(p=>`<option value="${esc(p.id)}" ${state.settings.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select></div>
        <div class="btn-row">
          <button class="btn btn-outline btn-sm" id="sbRefresh">Refresh projects</button>
          <button class="btn btn-chalk btn-sm" id="sbPull">Pull shot lists</button>
        </div>
      </div>`}

    ${sh.pulledAt ? `<div class="tiny muted" style="margin:-4px 0 12px;">Last pulled ${esc(new Date(sh.pulledAt).toLocaleString())}${state.settings.projectName ? ' · ' + esc(state.settings.projectName) : ''}</div>` : ''}

    ${!lists.length ? `<div class="empty">No shot lists yet.<br>Pull them from a CineSlab project, or just shoot — the camera doesn't need them.</div>`
      : lists.map(l=>`
        <div class="section-title">${esc(l.name || 'Untitled list')}</div>
        <div class="paper">
          ${(l.shots||[]).length ? (l.shots||[]).map(shot=>{
            const f = focalForShot(shot);
            return `<div class="list-item">
              <div class="grow">
                <div class="ttl">${esc([shot.scene ? 'Sc ' + shot.scene : '', shot.shotNum, shot.type].filter(Boolean).join(' · ') || 'Shot')}</div>
                <div class="sub">${esc(shot.desc || '')}</div>
                <div class="sub"><span class="badge ${f.fromList?'on':''}">${f.mm}mm${f.fromList?'':' suggested'}</span> ${esc(f.why)}</div>
              </div>
              <button class="btn btn-outline btn-sm" data-load="${esc(shot.id||'')}" data-list="${esc(l.id||'')}">Load</button>
            </div>`;
          }).join('') : '<div class="empty">This list has no shots.</div>'}
        </div>`).join('')}
  </div>`;

  const on = (id, ev, fn)=>{ const el = document.getElementById(id); if(el) el[ev] = fn; };
  on('sbGo','onclick', async ()=>{
    const email = (document.getElementById('sbEmail').value || '').trim();
    const pass = document.getElementById('sbPass').value || '';
    if(!email || !pass) return toast('Enter your email and password.', true);
    toast('Signing in…');
    const r = await sbSignIn(email, pass);
    if(!r.ok) return toast(r.message, true);
    await fetchProjects();
    render();
  });
  on('sbOut','onclick', ()=>sbSignOut());
  on('sbRefresh','onclick', async ()=>{
    const r = await fetchProjects();
    toast(r.ok ? 'Projects refreshed.' : r.message, !r.ok);
    render();
  });
  on('sbProj','onchange', e=>{ state.settings.projectId = e.target.value || null; debouncedSaveSettings(); });
  on('sbPull','onclick', async ()=>{
    const id = state.settings.projectId;
    if(!id) return toast('Choose a project first.', true);
    toast('Pulling…');
    const r = await pullShotlists(id);
    toast(r.ok ? 'Pulled ' + r.count + ' shots.' : r.message, !r.ok);
    render();
  });
  $$('[data-load]').forEach(b=>{
    b.onclick = ()=>{
      const list = lists.find(l=>String(l.id) === b.dataset.list);
      const shot = list && (list.shots||[]).find(s=>String(s.id) === b.dataset.load);
      if(shot) loadShot(shot);
    };
  });
}

      <div class="form-grid">

        <div class="field"><label>Shot</label><input type="text" id="slShot" value="${esc(s.shotNum)}" placeholder="A"></div>
        <div class="field"><label>Take</label><input type="number" id="slTake" min="1" value="${s.takeNum}"></div>
        <div class="field"><label>Card / roll</label><input type="text" id="slRoll" value="${esc(s.roll)}"></div>
      </div>
      <div class="tiny muted">These stamp the next take, and name the file it writes.</div>
    </div>

    ${!r ? `<div class="empty">No reports yet. Record a take and one appears.</div>` : `
      <div class="section-title">${esc(r.name)}</div>
      <div class="paper">
        <div class="btn-row" style="margin-bottom:12px;">
          <button class="btn btn-chalk btn-sm" id="rExport">Export CSV</button>
          <button class="btn btn-outline btn-sm" id="rNew">New report</button>
          ${state.reports.length > 1 ? `<button class="btn btn-outline btn-sm" id="rSwitch">Switch (${state.reports.length})</button>` : ''}
        </div>
        ${!r.takes.length ? '<div class="empty">No takes logged yet.</div>' : `
        <div class="scroll-x"><table class="data">
          <thead><tr><th>Sc/Sh</th><th>Take</th><th>TC</th><th>Dur</th><th>Lens</th><th>EI</th><th>Sh</th><th>WB</th><th>Look</th></tr></thead>
          <tbody>${r.takes.map(t=>`<tr>
            <td>${esc([t.scene, t.shot].filter(Boolean).join('/') || '—')}</td>
            <td class="mono">${t.take}</td>
            <td class="mono tiny">${esc(t.startTc)}</td>
            <td class="mono tiny">${esc(fmtDuration(t.duration))}</td>
            <td class="mono">${t.focal}${t.digital?'<span class="badge warn" style="margin-left:3px;">D</span>':''}</td>
            <td class="mono">${t.ei || '—'}</td>
            <td class="mono">${t.shutterAngle}°</td>
            <td class="mono">${t.wb ? t.wb + 'K' : 'Auto'}</td>
            <td class="tiny">${esc(t.lut)}${t.lutBaked?' <span class="badge warn">baked</span>':''}</td>
          </tr>
          ${(t.flags||[]).length ? `<tr><td colspan="9" class="tiny" style="color:var(--warn);padding-top:0;">⚠ ${esc(t.flags.join(' '))}</td></tr>` : ''}
          `).join('')}</tbody>
        </table></div>`}
      </div>`}
  </div>`;

  const on = (id, ev, fn)=>{ const el = document.getElementById(id); if(el) el[ev] = fn; };
  on('slScene','oninput', e=>{ s.scene = e.target.value; debouncedSaveSettings(); });
  on('slShot','oninput', e=>{ s.shotNum = e.target.value; debouncedSaveSettings(); });
  on('slTake','oninput', e=>{ s.takeNum = Math.max(1, Number(e.target.value)||1); debouncedSaveSettings(); });
  on('slRoll','oninput', e=>{ s.roll = e.target.value; debouncedSaveSettings(); });
  on('rExport','onclick', ()=>exportReportCsv(r));
  on('rNew','onclick', async ()=>{
    const nr = emptyReport();
    const name = await openPromptModal('Name this report', 'e.g. "Day 3 — Camera A"', nr.name);
    if(!name) return;
    nr.name = name;
    state.reports.unshift(nr);
    if(state.reports.length > MAX_REPORTS) state.reports.length = MAX_REPORTS;
    s.reportId = nr.id; s.takeNum = 1;
    await saveReports(); await saveSettings();
    render();
  });
  on('rSwitch','onclick', async ()=>{
    const names = state.reports.map((x,i)=>(i+1) + '. ' + x.name).join('\n');
    const pick = await openPromptModal('Switch report', 'Type a number:\n' + names, '1');
    const i = Number(pick) - 1;
    if(state.reports[i]){ s.reportId = state.reports[i].id; await saveSettings(); render(); }
  });
}

/* =========================================================
   LOOKS VIEW
========================================================= */
function renderLooks(main){
  const s = state.settings;
  const custom = state.luts.filter(l=>!l.builtin);
  main.innerHTML = `<div class="page">
    <div class="view-head">
      <h2>Looks</h2>
      <p>A look sits on the viewfinder so you can judge the image the way it will finally be seen. Your recording stays clean unless you say otherwise.</p>
    </div>
    ${!state.glReady ? `<div class="note warn"><strong>No WebGL on this browser.</strong> Looks can't be previewed here. The camera, HUD readouts, reports and the time-lapse calculator all still work.</div>` : ''}

    <div class="paper">
      <div class="switch"><span class="lbl">Bake the look into the recording
        <small>Off (recommended) — footage records clean and can still be graded any way you like.<br>
        On — what you see is written to the file, permanently.</small></span>
        <input type="checkbox" id="lkBake" ${s.recordGraded?'checked':''}></div>
      <div class="row" style="display:flex;align-items:center;gap:10px;padding-top:12px;">
        <span class="tiny muted" style="width:64px;">Strength</span>
        <input type="range" id="lkMix" min="0" max="1" step="0.05" value="${s.lutStrength}">
        <span class="mono" style="min-width:48px;text-align:right;" id="lkMixVal">${Math.round(s.lutStrength*100)}%</span>
      </div>
    </div>

    <div class="section-title">Built in</div>
    <div class="paper">
      <div class="list-item"><div class="grow"><div class="ttl">None</div>
        <div class="sub">Straight out of the sensor. What the camera sees.</div></div>
        <button class="btn ${!s.lutId?'btn-chalk':'btn-outline'} btn-sm" data-pick="">${!s.lutId?'Active':'Use'}</button></div>
      ${state.luts.filter(l=>l.builtin).map(l=>`
        <div class="list-item"><div class="grow"><div class="ttl">${esc(l.name)}</div>
          <div class="sub">${esc(l.desc||'')}</div></div>
          <button class="btn ${s.lutId===l.id?'btn-chalk':'btn-outline'} btn-sm" data-pick="${esc(l.id)}">${s.lutId===l.id?'Active':'Use'}</button></div>`).join('')}
    </div>

    <div class="section-title">Your LUTs</div>
    <div class="paper">
      ${custom.length ? custom.map(l=>`
        <div class="list-item"><div class="grow"><div class="ttl">${esc(l.name)}</div>
          <div class="sub">${l.size}³ · imported</div></div>
          <button class="btn ${s.lutId===l.id?'btn-chalk':'btn-outline'} btn-sm" data-pick="${esc(l.id)}">${s.lutId===l.id?'Active':'Use'}</button>
          <button class="btn btn-danger btn-sm" data-del="${esc(l.id)}">✕</button></div>`).join('')
        : '<div class="empty">No imported LUTs yet.</div>'}
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-outline btn-sm" id="lkImport">Import a .cube file</button>
      </div>
      <input type="file" id="lkFile" accept=".cube,text/plain" style="display:none;">
      <div class="tiny muted" style="margin-top:8px;line-height:1.5;">
        3D .cube files up to 64³. ${MAX_LUTS} imports max.
      </div>
    </div>

    <div class="note">
      <strong>On selling looks.</strong> Generating a LUT by matching a frame from someone else's film — and then selling it — is legally murky ground, whatever the result is called. The built-ins here are original curves, not derived from any film or stock. See CAMERA-COMPANION.md §2.3.
    </div>
    ${s.learnMode ? `<div class="paper"><h3>What a LUT is</h3>${explain('lut')}</div>` : ''}
  </div>`;

  const on = (id, ev, fn)=>{ const el = document.getElementById(id); if(el) el[ev] = fn; };
  $$('[data-pick]').forEach(b=>{
    b.onclick = ()=>{ s.lutId = b.dataset.pick || null; saveSettings(); render(); };
  });
  $$('[data-del]').forEach(b=>{
    b.onclick = async ()=>{
      const l = state.luts.find(x=>x.id === b.dataset.del);
      if(!l) return;
      if(!(await openConfirmModal('Delete LUT', 'Remove "' + l.name + '"?', 'Delete'))) return;
      state.luts = state.luts.filter(x=>x.id !== l.id);
      if(s.lutId === l.id) s.lutId = null;
      GL.lutId = null;
      await saveLuts(); await saveSettings();
      render();
    };
  });
  on('lkBake','onchange', e=>{ s.recordGraded = e.target.checked; saveSettings(); });
  on('lkMix','oninput', e=>{
    s.lutStrength = Number(e.target.value);
    document.getElementById('lkMixVal').textContent = Math.round(s.lutStrength*100) + '%';
    debouncedSaveSettings();
  });
  on('lkImport','onclick', ()=>document.getElementById('lkFile').click());
  on('lkFile','onchange', async e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > LUT_BYTES_LIMIT){
      return openAlertModal('Too big', 'That file is ' + fmtBytes(file.size) + '. The limit is ' + fmtBytes(LUT_BYTES_LIMIT) + ' — a 3D LUT above 64³ is far more precision than a viewfinder can show.');
    }
    if(state.luts.filter(l=>!l.builtin).length >= MAX_LUTS){
      return openAlertModal('LUT limit', 'You already have ' + MAX_LUTS + ' imported LUTs. Delete one first.');
    }
    try{
      const text = await file.text();
      const cube = parseCube(text);
      const lut = {
        id: uid(),
        name: cube.title || file.name.replace(/\.cube$/i, ''),
        size: cube.size, data: cube.data, builtin: false
      };
      state.luts.push(lut);
      s.lutId = lut.id;
      await saveLuts(); await saveSettings();
      render();
      toast('Imported ' + lut.name + ' (' + lut.size + '³).');
    }catch(err){
      openAlertModal('Could not read that LUT', err.message);
    }
    e.target.value = '';
  });
}

/* =========================================================
   SETTINGS VIEW
========================================================= */
function renderSettings(main){
  const s = state.settings;
  const caps = state.cam.caps || {};
  const capRow = (name, label)=>{
    const ok = camSupports(name);
    return `<div class="list-item"><div class="grow"><div class="ttl">${esc(label)}</div>
      <div class="sub">${ok ? esc(rangeLabel(name)) : esc(CAP_NOTES[name] || 'Not available on this device.')}</div></div>
      <span class="badge ${ok?'on':''}">${ok?'Yes':'No'}</span></div>`;
  };
  main.innerHTML = `<div class="page">
    <div class="view-head"><h2>Setup</h2><p>${esc(APP_NAME)} ${esc(APP_VERSION)} · storage: ${esc((window.__storageBackend && window.__storageBackend()) || 'host')}</p></div>

    <div class="section-title">HUD</div>

    <div class="section-title">Capture</div>
    <div class="paper">
      <div class="field"><label>Resolution</label>
        <select id="stRes">${Object.keys(RES_PRESETS).map(k=>`<option value="${k}" ${s.resolution===k?'selected':''}>${k==='4k'?'4K':k+'p'}</option>`).join('')}</select></div>
      <div class="field"><label>Timecode</label>

function rangeLabel(name){
  const r = capRange(name);
  if(!r) return 'Supported.';
  const unit = name === 'colorTemperature' ? 'K' : name === 'exposureTime' ? ' (100µs units)' : '';
  return 'Range ' + r.min + '–' + r.max + unit + (r.step ? ', step ' + r.step : '');
}

/* =========================================================
   BOOT
========================================================= */
async function boot(){
  state.settings = normalizeSettings(await storeGet(KEY_SETTINGS, false));
  state.reports  = normalizeReports(await storeGet(KEY_REPORTS, false));
  const customLuts = (await storeGet(KEY_LUTS, false)) || [];
  state.luts = makeBuiltinLuts().concat(customLuts.filter(l=>l && l.data && l.size));

  // A shot list pulled on wi-fi has to still be there in a field with no
  // signal, so the last pull is cached and shown before any network call.
  const cached = await storeGet(KEY_SHOTS, false);
  if(cached && Array.isArray(cached.lists)){
    state.shots.lists = cached.lists;
    state.shots.pulledAt = cached.pulledAt || null;
    if(cached.projectId && !state.settings.projectId){
      state.settings.projectId = cached.projectId;
      state.settings.projectName = cached.projectName || '';
    }
  }
  if(state.settings.lutId && !state.luts.some(l=>l.id === state.settings.lutId)){
    state.settings.lutId = null;
  }

  initBattery();
  state.booted = true;
  render();

  // Nothing above this line touches the network. Session restore is a
  // best-effort extra: if the CDN is unreachable the app never notices.
  if(state.settings.projectId){
    ensureSupabase().then(async ok=>{
      if(!ok) return;
      await sbRestoreSession();
      if(state.shots.signedIn){ await fetchProjects(); render(); }
    });
  }
}

/* Don't let a phone quietly bin a shoot: frames live in memory until they
   are assembled, and a recording in progress has nothing on disk yet. */
window.addEventListener('beforeunload', e=>{
  if(state.rec.active || (state.lapse.frames && state.lapse.frames.length)){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
document.addEventListener('visibilitychange', ()=>{
  // Backgrounding a tab suspends timers unpredictably. Interval shooting
  // keeps its own end time, so it self-corrects, but say so rather than
  // silently producing a gappy sequence.
  if(document.hidden && state.lapse.active){
    console.warn(APP_NAME + ': backgrounded during interval shooting — frame spacing may drift.');
  }
});
window.addEventListener('orientationchange', ()=>setTimeout(measureNav, 250));
window.addEventListener('resize', measureNav);

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* Exposed for debugging from a console on a real device, where there is no
   other way to see what the camera reported. */
window.__cam = {
  state, lapsePlan, lapseWarnings, parseCube, planFocal, captureMetadata,
  caps: ()=>state.cam.caps, live: ()=>state.cam.live
};
})();
</script>
