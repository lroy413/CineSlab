      <li>Create a new set of sides and give it a name, like "Jane — Audition Sides" or "Day 3 Sides."</li>
      <li>Note who they're prepared for — this also doubles as the character filter below.</li>
      <li>Check scenes manually, or use <b>Filter &amp; auto-select scenes</b> to pull in every scene matching a character, INT/EXT, and Day/Night — it replaces your current selection with the matches.</li>
      <li>Turn on <b>Dialogue only for this character</b> to strip out action lines and other characters' dialogue, leaving just that actor's lines — useful for a line-memorization sheet rather than a full scene read.</li>
      <li>Click the small circle next to any line in the preview to add a note or highlight, same as in the Script tool — it's the same underlying line, so it shows up back in Script too.</li>
      <li>Export to PDF — it uses the same screenplay formatting as the full script, so it reads exactly like a page out of the real thing.</li>
    </ul>
    <div class="tip">Tip: keep audition sides short — two or three scenes is usually plenty. For daily shoot sides, include only what's being shot that day so nobody's flipping through pages they don't need.</div>
  `},
  breakdown: { title:'Breaking Down a Script', types:['narrative','documentary','reality'], html: `
    <h3 class="g-h">What a script breakdown is</h3>
    <p>Before a production can be scheduled or budgeted, someone — usually the 1st AD — goes through the script scene by scene and tags every element it needs: which cast members, what props, what wardrobe, what vehicles, and so on. This is called "breaking down" the script, and it's one of the most fundamental skills in professional production.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Write your scenes in the Script tool first — anything starting with <code>INT.</code> or <code>EXT.</code> becomes a scene heading, and shows up here automatically.</li>
      <li>Open a scene and add elements one at a time, choosing a category for each.</li>
      <li>Elements are grouped and color-coded by category as you add them, so you can see everything a scene needs at a glance.</li>
      <li>Export a full Element List PDF — a report of every tagged element across every scene, similar to what a production office would print out and pin to the wall.</li>
    </ul>
    <div class="tip">Heads up: the category colors here follow a common convention used in the industry, but exact color schemes vary by production and by software — always check with your 1st AD or production coordinator on a professional set.</div>
    <div class="tip">Tip: a good breakdown is what makes an accurate schedule and budget possible. If a scene needs a specific prop or a background actor, tag it here now so nobody is caught off guard on the shoot day.</div>
  `},
  schedule: { title:'Building a Shooting Schedule', types:['narrative','documentary','reality'], html: `
    <h3 class="g-h">Why you don't shoot in script order</h3>
    <p>Almost no production shoots its scenes in the order they appear in the script. Instead, scenes get grouped by location, cast availability, time of day, or budget — so you might shoot the film's final scene on day one because that's when you have the location. This grouping is called a shooting schedule, or "stripboard" in traditional AD terminology.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add a shoot day for each day you'll be filming.</li>
      <li>Assign scenes to a day from the dropdown on that day's card, or from the "Unscheduled Scenes" list at the bottom.</li>
      <li>A scene can only belong to one day at a time — reassigning it moves it, it doesn't duplicate it.</li>
      <li>Once your days are set, open a Call Sheet and use "Import scenes from a shoot day" to pull that day's scene list in automatically.</li>
    </ul>
    <div class="tip">Tip: group scenes by location first, then by cast availability. Minimizing how many times you move your crew and gear ("company moves") is one of the biggest time-savers on a shoot.</div>
  `},
  contacts: { title:'Managing Cast & Crew', types:['narrative','documentary','reality'], html: `
    <h3 class="g-h">Why a directory helps</h3>
    <p>Retyping the same names, roles, and phone numbers into every call sheet wastes time and invites typos. A cast and crew directory is a single source of truth for this project — save someone once, then reuse them anywhere.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add each person once, marking them as Cast or Crew and noting their role or character.</li>
      <li>Open any Call Sheet and use "+ From directory" under the Cast or Crew tables to pull someone in without retyping.</li>
      <li>Keep contact info up to date here and every future call sheet benefits.</li>
      <li><b>Export Crew List PDF</b> generates a clean, printable contact sheet — crew first, sorted by position, then cast — the kind of document you'd file for insurance or hand out to department heads.</li>
    </ul>
    <div class="tip">Tip: this directory is scoped to the current project. If you work with the same people across multiple projects, you'll re-add them per project for now.</div>
  `},
  locations: { title:'Managing Locations', types:['all'], html: `
    <h3 class="g-h">Why a locations directory helps</h3>
    <p>Locations often get revisited — for a scout, then a tech scout, then the actual shoot day, sometimes for pickups later. Saving the address, a contact person, and a few reference photos once means you're never digging through old texts to remember how to get somewhere.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add a location with its address and a contact person if you needed permission to film there.</li>
      <li>Attach up to 4 reference photos per location, just like on a shot list.</li>
      <li>Open any Call Sheet and use "Pick saved location" to fill in the location fields instantly.</li>
    </ul>
    <div class="tip">Tip: photograph power outlets, parking, and natural light direction when you scout — future you will be grateful on shoot day.</div>
  `},
  continuity: { title:'Tracking Continuity', types:['all'], html: `
    <h3 class="g-h">Why continuity matters</h3>
    <p>Scenes almost never get shot in the order they appear in the story — you might shoot the end of a scene on Monday and the beginning three weeks later. Continuity is the practice of keeping every visual detail consistent across that gap: what someone was wearing, how a room was arranged, where a prop was sitting.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add an entry for Wardrobe (an actor's outfit, accessories, hair) or Set (how a location or room is dressed).</li>
      <li>Link it to a scene if it's specific to one, and write a precise description — "watch on left wrist," not just "watch."</li>
      <li>Attach reference photos — this is the fastest way to check a match without re-reading notes.</li>
      <li>Use the Wardrobe / Set filter tabs to quickly find what you need on a busy set.</li>
    </ul>
    <div class="tip">Tip: take continuity photos at the start and end of every scene, not just once — small things (a rolled-up sleeve, a moved chair) change during a take.</div>
  `},
  storyboards: { title:'Building a Storyboard', types:['all'], html: `
    <h3 class="g-h">What a storyboard is for</h3>
    <p>A storyboard is a sequence of drawings or images that plan out a sequence of shots before you film them. It's the fastest way to figure out if a sequence actually works — visually, spatially, and in terms of pacing — before you're standing on set trying to figure it out live.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Create a storyboard for any sequence you want to plan visually — it doesn't have to be the whole film.</li>
      <li>Add a panel for each shot, upload a sketch, photo reference, or screenshot, and set its shot type.</li>
      <li>Use the up/down arrows to reorder panels until the sequence flows the way you want.</li>
      <li>Export the whole board as a PDF to share with your DP or crew.</li>
    </ul>
    <div class="tip">Tip: storyboard panels don't need to be good drawings — stick figures and rough shapes are completely normal. The point is to communicate composition and sequence, not to make art.</div>
  `},
  tasks: { title:'Using Tasks & Checklists', types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>Pre-production has a lot of small, easy-to-forget steps. This tool turns your to-do list into real, checkable tasks with a visible progress bar, instead of a static checklist you have to re-read every time.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add a task for each concrete step — "Confirm location for Day 2," "Send sides to cast," "Book audio gear."</li>
      <li>Check tasks off as you complete them — the progress bar updates automatically.</li>
      <li>Add a due date if a task is time-sensitive.</li>
    </ul>
    <div class="tip">Tip: break big vague tasks ("get ready for the shoot") into smaller concrete ones ("confirm crew call times," "charge batteries," "print sides"). Concrete tasks actually get done.</div>
  `},
  trash: { title:'Using the Recycle Bin', types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>Deleting a shot list, call sheet, or any other top-level item doesn't erase it right away — it moves to the Recycle Bin first, so an accidental delete doesn't cost you real work.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Anything you delete from a tool's main list — Shot Lists, Call Sheets, Docs, Budgets, Storyboards, Sides, Contacts, Locations, Continuity, Camera Reports, Lighting, Shoot Days, Notes, and Tasks — lands here.</li>
      <li><b>Restore</b> puts it back exactly where it came from.</li>
      <li><b>Delete Forever</b> removes a single item permanently, right away.</li>
      <li><b>Empty Recycle Bin</b> clears everything in it at once.</li>
    </ul>
    <div class="tip">Items are automatically and permanently removed ${TRASH_RETENTION_DAYS} days after being deleted — each one shows a countdown so you always know how much time is left to restore it.</div>
    <div class="tip">Heads up: deleting individual rows inside a tool — a single shot, a fixture, a budget line item — is not recoverable. The Recycle Bin only covers whole items from a tool's main list.</div>
  `},
  search: { title:'Searching Your Project', types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>As a project grows, it gets harder to remember which tool something lives in. The search icon in the header looks across your whole project at once — script text, shot descriptions, notes, tasks, contacts, and more — and jumps you straight to the match.</p>
    <h3 class="g-h">Using it</h3>
    <ul>
      <li>Tap the magnifying glass in the header and start typing — results update as you go.</li>
      <li>Results are grouped by tool, so you can see at a glance where a match came from.</li>
      <li>Tap any result to jump straight to it.</li>
    </ul>
    <div class="tip">Tip: search works on exact text, so try a few different words if your first search doesn't turn anything up.</div>
  `},
  calendar: { title:'Calendar Export & Reminders', types:['all'], html: `
    <h3 class="g-h">What this actually is</h3>
    <p>This app doesn't have a live, two-way connection to Google Calendar or Apple Calendar — that kind of sync needs account sign-in and a server, which this version doesn't have yet. What it does have is real and useful today: one-tap export of any date in your project into a calendar file that Apple Calendar, Google Calendar, Outlook, or anything else can open.</p>
    <h3 class="g-h">Adding dates to your calendar</h3>
    <ul>
      <li>Look for a <b>+ Add to Calendar</b> button (or a small calendar icon) anywhere you see a date — Call Sheets, Shoot Days in the Shooting Schedule, and Tasks with a due date.</li>
      <li>The Dashboard's <b>Upcoming Deadlines</b> section pulls every dated item in the project into one list, with a button to add everything at once.</li>
      <li>Each export downloads a small .ics file — open it and your phone or computer will ask which calendar to add it to.</li>
    </ul>
    <h3 class="g-h">In-App Reminders</h3>
    <p>Turn these on in Settings to get a notification for anything due today, right in the app. Important: these only fire while the app is actually open in your browser — they are <b>not</b> push notifications, and won't reach you if the tab or app is closed. True push notifications need a real backend and, for a phone app, a proper native build.</p>
    <div class="tip">Tip: if you want a reliable reminder that reaches you even when the app is closed, export the date to your phone's calendar app instead — that's the one that will actually alert you.</div>
  `},
  shotlists: { title:'Building a Shot List', types:['all'], html: `
    <h3 class="g-h">Why a shot list matters</h3>
    <p>A shot list turns a scene into a concrete checklist of individual shots. Without one, it's easy to get to the edit and realize you never got a close-up you needed, or that you wasted an hour on a shot that didn't matter.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Pick a template that matches the scene (Basic Coverage is a safe default for most dialogue scenes) or start blank.</li>
      <li>Name the list after the scene, e.g. "Scene 4 - Kitchen."</li>
      <li>Edit any cell directly: scene number, shot number, type, description, camera movement, lens, and notes.</li>
      <li>Check the <b>Got</b> box on set as you complete each shot, so everyone can see progress at a glance.</li>
      <li>Add up to 4 reference photos per shot in the Refs column — frame grabs, location photos, or mood references. Click a thumbnail to view it larger or delete it.</li>
      <li>Export the whole list as a PDF to print or send to your DP.</li>
    </ul>
    <h3 class="g-h">Shot type cheat sheet</h3>
    <div class="cheat-grid">
      <div class="k">Wide</div><div>Shows the full scene and geography</div>
      <div class="k">Medium</div><div>Roughly waist-up on a subject</div>
      <div class="k">Close-Up</div><div>Fills the frame with a face or object</div>
      <div class="k">OTS</div><div>Over-the-shoulder, framed past one character toward another</div>
      <div class="k">Two-Shot</div><div>Two subjects framed together</div>
      <div class="k">Insert</div><div>A tight shot of a specific detail (a note, a watch)</div>
      <div class="k">Cutaway</div><div>A shot away from the main action, useful for editing</div>
      <div class="k">POV</div><div>The camera shows what a character sees</div>
    </div>
    <div class="tip">Tip: shoot your widest shots first, then move progressively tighter. Always grab a few extra "safety" cutaways — they save edits later.</div>
  `},
  lighting: { title:'Planning a Lighting Setup', types:['narrative'], html: `
    <h3 class="g-h">The basics: three-point lighting</h3>
    <p>Most setups start from three lights: a <b>Key</b> (the main, brightest source that defines direction), a <b>Fill</b> (softer, opposite the key, to soften shadows), and a <b>Back/Rim</b> light (behind the subject, separating them from the background).</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Create a setup per scene or per major lighting change within a scene.</li>
      <li>Add fixtures and assign each a role (Key, Fill, Back/Rim, Background, Kicker, Practical) and a position around the subject.</li>
      <li>The diagram above the fixture table redraws automatically from your choices — camera is always at the bottom, subject in the center.</li>
      <li>Use Color Temp and Gel fields to keep continuity between shots — mixing daylight and tungsten without correction causes color casts.</li>
      <li>Export to PDF for a printable lighting plan with the diagram included.</li>
    </ul>
    <h3 class="g-h">Lighting ratio</h3>
    <p>The ratio between key and fill brightness controls contrast. A low ratio like 2:1 looks soft and even (common for interviews or comedy); a high ratio like 8:1 looks harsh and dramatic (common for thrillers or noir).</p>
    <div class="tip">Tip: practicals — lamps, neon signs, window light — read as more realistic than rigged fixtures. Use them as motivation for where your key light "comes from."</div>
  `},
  broll: { title:'Tracking B-Roll', types:['all'], html: `
    <h3 class="g-h">What b-roll is</h3>
    <p>B-roll is supplemental footage that isn't part of your planned coverage — establishing shots, texture, hands, environment, reactions. It's what gives an edit room to breathe and covers awkward cuts.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Log ideas as <b>Needed</b> before a shoot day so you remember to grab them opportunistically.</li>
      <li>Mark an entry <b>Captured</b> once you've shot it, and <b>Used</b> once it's cut into the edit.</li>
      <li>Use Tags to group related footage (e.g. "nature," "hands," "establishing") so it's easy to find later.</li>
      <li>Add up to 4 reference photos per entry, just like on a shot list.</li>
      <li>Export the whole log to PDF to share with an editor or DP.</li>
    </ul>
    <div class="tip">Tip: documentary and reality shoots live or die on b-roll — always grab more than you think you need.</div>
  `},
  camerareports: { title:'Filling Out Camera Reports', types:['all'], html: `
    <h3 class="g-h">What a camera report is</h3>
    <p>A camera report is a per-day (or per-camera) log of every roll and take shot, including which takes are good enough to print. It's the camera department's paper trail, handed off to editorial and the DIT.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Create one report per shoot day, or per camera if you're running multiple units.</li>
      <li>Fill in the card/roll number and sound roll number so footage and audio can be matched up later.</li>
      <li>Log each take with its scene and take number, then check <b>Circle</b> for any take the director wants printed — that's the signal to editorial that it's a keeper.</li>
      <li>Use the Sound column to flag Sync, MOS (no sound), or Wild (sound recorded separately).</li>
      <li>Export to PDF to hand off at wrap.</li>
    </ul>
    <div class="tip">Tip: circling takes on set saves your editor hours of hunting through footage later.</div>
  `},
  callsheets: { title:'Creating a Call Sheet', types:['all'], html: `
    <h3 class="g-h">What it is</h3>
    <p>The call sheet is the single most important document of a shoot day. It tells every cast and crew member where to be, when, and what's being shot — it's usually sent out the evening before.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Fill in production info: date, crew call, shooting call, and estimated wrap.</li>
      <li>Add the location and nearest hospital — always include this, even if you don't expect to need it.</li>
      <li>Build the scene schedule so everyone knows shooting order.</li>
      <li>List cast and crew with individual call times if they differ from the general crew call.</li>
      <li>The formatted preview below updates as you type — export it as a PDF or print it directly.</li>
    </ul>
    <div class="tip">Tip: keep it to one page if you can. A call sheet nobody reads because it's too long doesn't help anyone.</div>
  `},
  docs: { title:'Pre-Production Docs & Releases', types:['all'], html: `
    <h3 class="g-h">Why pre-production docs matter</h3>
    <p>Pre-production is where you de-risk your shoot before you've spent a single dollar on set. A little planning here saves a lot of scrambling later.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Pick a template that fits your project type — the templates shown are tailored automatically.</li>
      <li>Fill it out like a normal document; every doc is fully editable text.</li>
      <li>Print or export any doc to PDF to bring on set or send to collaborators.</li>
    </ul>
    <h3 class="g-h">About release forms (Documentary &amp; Reality)</h3>
    <p>If you're filming real people, real homes, or real property, you generally need written permission to use that footage. A <b>talent release</b> covers a person's likeness and words, a <b>location release</b> covers filming on someone's property, and a <b>property release</b> covers filming someone's belongings. These aren't a substitute for legal advice on a paid production, but they're a solid starting point for indie and student work.</p>
    <div class="tip">Tip: get releases signed the same day you shoot — it's much harder to track someone down for a signature weeks later.</div>
  `},
  budget: { title:'Budgeting Your Production', types:['all'], html: `
    <h3 class="g-h">What it is</h3>
    <p>A budget matches your ambition to the money you actually have. It also becomes your shot list for what you can and can't afford to compromise on.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add line items under each category — the totals for that category update instantly.</li>
      <li>Use "+ Add category" if your production needs a category the defaults don't cover.</li>
      <li>Set a contingency percentage — 10-15% is standard for indie productions — to cover the unexpected.</li>
      <li>The grand total combines your subtotal and contingency automatically.</li>
      <li>Export to PDF for a clean, shareable budget summary.</li>
    </ul>
    <div class="tip">Tip: track what you actually spend against this budget as you go. It's much easier to catch an overage on day 2 than after wrap.</div>
  `},
  collaboration: { title:'Working with a Crew', types:['all'], html: `
    <h3 class="g-h">What "Collaborate" does</h3>
    <p>Turning a project into a shared project gives it a 6-character invite code. Anyone who enters that code gets a copy of the project in their own list, kept in sync with yours. Whoever creates the shared project is automatically its Admin.</p>
    <h3 class="g-h">Access levels — read this carefully</h3>
    <p>When someone joins with a code, they pick Admin, Collaborator, or Viewer, identified by whatever name is in their own Profile. Viewer locks <em>their own</em> interface to read-only — inputs, checkboxes, and add/delete buttons stop responding, with a banner reminding them they're viewing, not editing.</p>
    <p><b>Important:</b> this app has no account system or login, so there's no way to actually verify who's who — access levels are based on a self-reported name, not a credential. Anyone with the invite code (and password, if one is set) has the exact same underlying access to the data no matter which role they're assigned. Viewer and the join password are honesty-based courtesies that prevent accidental edits and casual snooping — not a real security boundary.</p>
    <h3 class="g-h">Join Passwords</h3>
    <p>As Admin, you can set an optional password in the Collaborate window — an extra word or code someone needs, in addition to the invite code, before they can join. It's stored in plain text within the project, so don't reuse a password you use anywhere else; it's a speed bump, not encryption.</p>
    <h3 class="g-h">Managing Crew Access</h3>
    <p>Once people have joined, the Admin sees a <b>Crew Access</b> list in the Collaborate window — everyone's name and current access level. Changing someone's level there takes effect the next time their device loads the project, overriding whatever they picked for themselves when they joined.</p>
    <h3 class="g-h">Using it</h3>
    <ul>
      <li>Open Collaborate on a project and choose "Make this project shared" to generate a code.</li>
      <li>Optionally set a join password right below the code.</li>
      <li>Send the code (and password, if set) to your crew however you'd normally share a password.</li>
      <li>They open Collaborate on their own device, enter the code under "Join," enter the password if asked, and pick their access level.</li>
      <li>As Admin, adjust anyone's access level anytime from the Crew Access list.</li>
    </ul>
    <div class="tip">Tip: remove old shared projects from your list once a shoot wraps, and treat both the invite code and any join password like credentials you wouldn't want posted publicly.</div>
  `},
  episodes: { title:'Organizing a Series', types:['narrative','documentary'], html: `
    <h3 class="g-h">What this is for</h3>
    <p>A season isn't one continuous story — it's discrete episodes that still share one script space, one cast and crew, and one shooting schedule. This tool keeps each episode's identity straight without splitting everything else into separate silos.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add an episode with a number, title, synopsis, and status (Planned, Writing, Shooting, Editing, Locked).</li>
      <li>Over in the Script tool, each scene in the Scenes sidebar has a small episode dropdown — tag scenes to whichever episode they belong to.</li>
      <li>Use the Episode filter in the Script tool's Scenes panel to jump straight to one episode's scenes.</li>
    </ul>
    <div class="tip">Tip: tag scenes to episodes as you write them rather than all at once at the end — it's much faster in small batches.</div>
  `},
  directornotes: { title:"Using Director's Notes", types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>A dedicated place for blocking, staging, and scene direction — the kind of notes that don't belong in a general Notes list because they're tied to specific creative choices, not reminders or to-dos.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Pick a type: <b>Blocking</b> (where actors move and stand), <b>Staging</b> (how the set is arranged for camera), <b>Scene Direction</b> (performance, tone, intention), or <b>General</b>.</li>
      <li>Link a note to a specific scene from the script, or leave it as a general note not tied to any scene.</li>
      <li>Use the filter tabs at the top to see just one type of note at a time.</li>
    </ul>
    <h3 class="g-h">Alerts for shared projects</h3>
    <p>If you turn on Director's Note Alerts in Settings, you'll get a notification when a collaborator adds a note on a shared project — but only while the app is open and happens to check. This isn't push notification — see the Collaboration guide for the full picture on what's real here and what isn't.</p>
    <div class="tip">Tip: write direction notes in the moment, right after a rehearsal or take — the specific phrasing you were thinking in is easy to lose by end of day.</div>
  `},
  moodboard: { title:'Building a Moodboard', types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>A place to collect visual references — stills from other films, color palettes, lighting setups, wardrobe inspiration — so the whole crew is working from the same picture of the tone you're chasing, not just words describing it.</p>
    <h3 class="g-h">Using this tool</h3>
    <ul>
      <li>Add a reference, then tap the image area to upload a photo — up to 4 images per reference if you want variations of the same idea.</li>
      <li>Give it a caption (what it is or where it's from) and tags (like "lighting," "wardrobe," "palette") so it's easy to scan later.</li>
    </ul>
    <div class="tip">Tip: a moodboard is most useful early — before the shoot, not during. Build it while you're still figuring out the look, then reference it on set.</div>
  `},
  notes: { title:'Using Notes', types:['all'], html: `
    <h3 class="g-h">What it's for</h3>
    <p>Notes are a quick capture space for anything that doesn't belong in a structured tool yet — an idea for a shot, a reminder to call a location owner, a line of dialogue you thought of in the shower.</p>
    <h3 class="g-h">Using this tool</h3>

    </ul>
  `}

const GLOSSARY_TERMS = [

  {term:'ADR (Automated Dialogue Replacement)', def:'Re-recording dialogue in a studio after shooting, synced to the picture.'},
  {term:'Aspect Ratio', def:'The width-to-height ratio of the frame, e.g. 16:9 or 2.39:1.'},
  {term:'B-Roll', def:'Supplemental footage used to cover cuts, add context, or illustrate a topic.'},
  {term:'Background (BG)', def:'Extras or action happening behind the main subject.'},

  {term:'Below-the-Line', def:'Budget costs for crew, equipment, and physical production.'},
  {term:'Best Boy', def:"The chief assistant to the gaffer (electric department) or key grip (grip department)."},

  {term:'Eating It', def:'Slang for flubbing a line or messing up an action during a take.', slang:true},
  {term:'First Team / Second Team', def:'First Team is the principal actors; Second Team is their stand-ins used for lighting and blocking.', slang:true},
  {term:'Fish Pole', def:'A handheld boom pole used to position a microphone just out of frame.', slang:true},
  {term:'Gang Box', def:'A portable electrical distribution box that splits power for multiple lights on set.', slang:true},
  {term:'Golden Time', def:'Premium overtime pay, often double time, kicking in after a long shooting day.', slang:true},
  {term:'Hot Set', def:'A fully dressed, ready-to-shoot set that must not be touched or rearranged between takes.', slang:true},
  {term:'Hot Points!', def:'A warning shouted when carrying sharp or hot equipment (like a C-stand or light) through a crowded area.', slang:true},
  {term:'In the Can', def:'Footage that has been successfully shot and is considered complete.', slang:true},
  {term:'Kill It', def:'An instruction to turn off a specific light or piece of equipment.', slang:true},

  {term:'New Deal', def:'Moving on to a completely different camera setup or shot.', slang:true},
  {term:"Picture's Up!", def:'A call warning the set that the camera is about to roll.', slang:true},
  {term:'Points', def:`A percentage of a film's profits, often given to key talent, e.g. "they get five points on the back end."`, slang:true},
  {term:'Pulling Focus', def:'The 1st AC manually adjusting lens focus during a shot as the subject moves.', slang:true},

  {term:'Window Burn', def:'Overexposure or flare from a bright window visible in a shot.', slang:true},
  {term:'Wrangler', def:'Someone responsible for managing something specific on set, like animals, kids, or cables (e.g. "cable wrangler").', slang:true}

function renderLearn(main){
  const proj = currentProject();
  const roleInfo = { label: hatsLabel(proj) };
  main.innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Resources</div>
      <h2>Learn</h2>
      <p>Guides for every tool in this app, a glossary of film terms, and Learn Film for how production works and how to conduct yourself on set. Guides marked "Recommended" are picked for the hats you are wearing: ${esc(roleInfo.label)}.</p>
    </div>
    <div class="subtabs">
      <div class="subtab ${state.learnTab==='guides'?'active':''}" data-tab="guides">Guides</div>
      <div class="subtab ${state.learnTab==='glossary'?'active':''}" data-tab="glossary">Glossary</div>
      <div class="subtab ${state.learnTab==='academy'?'active':''}" data-tab="academy">Learn Film</div>
    </div>
    <div id="learnBody"></div>
  `;
  main.querySelectorAll('.subtab').forEach(t=>{
    t.onclick = ()=>{ state.learnTab = t.dataset.tab; state.learnTopic = null; state.academyTopic = null; render(); };
  });
  const body = document.getElementById('learnBody');
  if(state.learnTab === 'guides'){
    if(state.learnTopic && GUIDES[state.learnTopic]){
      renderGuideDetail(body, state.learnTopic);
    } else {
      const topics = Object.entries(GUIDES).filter(([key,g])=> g.types.includes('all') || g.types.includes(proj.type));
      const roleTopics = unionForHats(ROLE_GUIDE_TOPICS, proj);
      const groups = {};
      topics.forEach(([key,g])=>{
        const sec = guideSectionFor(key);
        (groups[sec] = groups[sec] || []).push([key,g]);
      });
      const sectionOrder = ['story','camera','production','general','appwide'];
      body.innerHTML = `
        <input type="text" id="guideSearch" class="glossary-search" placeholder="Search guides...">
        <div id="guideSections">
          ${sectionOrder.filter(sec=>groups[sec] && groups[sec].length).map(sec=>{
            const collapsed = state.guideSectionsCollapsed[sec] !== false;
            return `
            <button class="section-title guide-section-title" data-toggle-section="${sec}" style="margin-top:22px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding-bottom:6px;text-align:left;">
              <span>${GUIDE_SECTION_LABELS[sec]} <span style="color:var(--ink-mute);font-weight:400;">(${groups[sec].length})</span></span>
              <span class="chevron ${collapsed?'':'open'}" style="font-size:10px;color:var(--ink-mute);transition:transform .15s ease;${collapsed?'':'transform:rotate(90deg);'}">▸</span>
            </button>
            <div class="tpl-grid guide-section-grid" style="${collapsed?'display:none;':''}margin-top:14px;">
              ${groups[sec].sort((a,b)=>{
                const ai = roleTopics.indexOf(a[0]), bi = roleTopics.indexOf(b[0]);
                return (ai===-1?999:ai) - (bi===-1?999:bi);
              }).map(([key,g])=>`
                <div class="tpl-card" data-topic="${key}" data-search="${esc(g.title.toLowerCase())}">
                  <span class="stamp-icon">${roleTopics.includes(key) ? 'Recommended' : GUIDE_SECTION_LABELS[sec]}</span>
                  <h4>${esc(g.title)}</h4>
                  <div class="tpl-open">Open <span>&rarr;</span></div>
                </div>
              `).join('')}
            </div>
          `;}).join('')}
        </div>
      `;
      body.querySelectorAll('.tpl-card').forEach(c=>{
        c.onclick = ()=>{ state.learnTopic = c.dataset.topic; render(); };
      });
      body.querySelectorAll('[data-toggle-section]').forEach(btn=>{
        btn.onclick = ()=>{
          const sec = btn.dataset.toggleSection;
          const currentlyCollapsed = state.guideSectionsCollapsed[sec] !== false;
          state.guideSectionsCollapsed[sec] = currentlyCollapsed ? false : true;
          renderLearn(main);
        };
      });
      document.getElementById('guideSearch').addEventListener('input', (e)=>{
        const q = e.target.value.trim().toLowerCase();
        if(!q){ renderLearn(main); return; }
        body.querySelectorAll('.guide-section-grid').forEach(grid=>{ grid.style.display = ''; });
        body.querySelectorAll('.chevron').forEach(c=>{ c.classList.add('open'); c.style.transform = 'rotate(90deg)'; });
        body.querySelectorAll('.tpl-card').forEach(c=>{
          c.style.display = (!q || c.dataset.search.includes(q)) ? '' : 'none';
        });
        body.querySelectorAll('.guide-section-grid').forEach(grid=>{
          const anyVisible = Array.from(grid.children).some(c=>c.style.display !== 'none');
          grid.style.display = anyVisible ? '' : 'none';
          if(grid.previousElementSibling) grid.previousElementSibling.style.display = anyVisible ? '' : 'none';
        });
      });
    }
  } else if(state.learnTab === 'academy'){
    renderAcademy(body);
  } else {
    renderGlossary(body);
  }
}

const ACADEMY_CONTENT = {
  process: `
    <p>Every production, no matter the size, moves through the same five stages. What changes is how long each stage takes, how many people are involved, and how formal it gets. Below, each stage compares three rough scales: a <b>solo content creator</b>, a <b>micro-budget short film</b> (a handful of crew, one to a few shoot days), and an <b>indie feature</b> (a full crew, weeks of prep and shooting).</p>

    <h3 class="g-h">1. Development</h3>
    <p>This is where the idea becomes a script. It's the one stage where all you truly need is time.</p>
    <p><b>Solo Creator:</b> Often just an outline or a few bullet points rather than a full script — sometimes you write and shoot the same day.</p>
    <p><b>Micro-Budget Short:</b> A finished script, usually well under 20 pages, tight enough for everyone attached to read in one sitting.</p>
    <p><b>Indie Feature:</b> Multiple drafts over months, often with outside notes before the script is considered "locked" and ready to schedule around.</p>

    <h3 class="g-h">2. Pre-Production</h3>
    <p>Everything that has to happen before anyone presses record: breaking the script into elements, scheduling, budgeting, casting, and scouting locations.</p>
    <p><b>Solo Creator:</b> Might be a single afternoon — a rough shot list and a location, and that's the whole plan.</p>
    <p><b>Micro-Budget Short:</b> One to three weeks. A small crew (roughly 5–15 people), a shoot of one to three days, a budget usually covered by savings or a small crowdfund.</p>
    <p><b>Indie Feature:</b> Months of prep. A full crew across every department, a multi-week shooting schedule, and a budget that's been through real fundraising.</p>

    <h3 class="g-h">3. Production</h3>
    <p>The actual shoot. Everything before this was planning; everything after is what you do with what you captured.</p>
    <p><b>Solo Creator:</b> You're likely playing every role at once — director, camera, sound — often completely alone.</p>
    <p><b>Micro-Budget Short:</b> A handful of dedicated crew, each doing one job. Days run long, and the schedule rarely survives contact with reality.</p>
    <p><b>Indie Feature:</b> A full crew working structured 10–14 hour days over several weeks, with a 1st AD running the set and a call sheet issued each night for the next day.</p>

    <h3 class="g-h">4. Post-Production</h3>
    <p>Editing, sound design, music, and color — turning raw footage into a finished piece.</p>
    <p><b>Solo Creator:</b> Usually done by the same person who shot it, often the same day or week.</p>
    <p><b>Micro-Budget Short:</b> Weeks to a couple of months, typically one editor, with sound and color handled by whoever on the team has the skill.</p>
    <p><b>Indie Feature:</b> Months. A dedicated editor, a separate sound mix, and a color grading pass — often each handled by a different specialist.</p>

    <h3 class="g-h">5. Distribution</h3>
    <p>Getting the finished film in front of an audience.</p>
    <p><b>Solo Creator:</b> Upload directly — YouTube, TikTok, Instagram. The platform is the distribution.</p>
    <p><b>Micro-Budget Short:</b> Film festival submissions, often followed by posting publicly once a festival run wraps up.</p>
    <p><b>Indie Feature:</b> A festival strategy, often starting with a premiere at a major festival, followed by a sales agent or distributor negotiating theatrical, streaming, or on-demand release.</p>

    <div class="tip">Tip: whatever scale you're working at, the stages don't change — only the formality does. Even a solo creator benefits from treating these as five distinct phases rather than blurring them all together.</div>
  `,
  departments: `
    <p>Bigger productions split work into specialized departments. On smaller shoots, one person often wears several of these hats — but knowing the "official" division helps you understand what each job actually covers.</p>

    <h3 class="g-h">Directing</h3>
    <p><b>Director</b> — owns the overall creative vision; guides performance and story.</p>
    <p><b>1st Assistant Director (1st AD)</b> — runs the set day-to-day and keeps the schedule moving.</p>
    <p><b>2nd Assistant Director</b> — manages background actors, paperwork, and next-day prep.</p>

    <h3 class="g-h">Producing</h3>
    <p><b>Producer</b> — oversees the whole production: budget, scheduling, hiring, problem-solving.</p>
    <p><b>Executive Producer</b> — usually finances or attaches key talent; less involved day-to-day.</p>
    <p><b>Line Producer</b> — manages the practical budget and logistics on larger productions.</p>

    <h3 class="g-h">Camera</h3>
    <p><b>Director of Photography (DP / Cinematographer)</b> — designs the visual look; oversees camera and lighting.</p>
    <p><b>Camera Operator</b> — physically operates the camera.</p>
    <p><b>1st Assistant Camera (1st AC / Focus Puller)</b> — keeps the shot in focus and manages the camera body.</p>

    <h3 class="g-h">Grip &amp; Electric</h3>

    <p><b>Key Hair / Key Makeup</b> — leads hair and makeup styling and continuity.</p>

    <h3 class="g-h">Script &amp; Continuity</h3>
    <p><b>Script Supervisor</b> — tracks continuity scene-to-scene and take-to-take, and keeps detailed notes for editorial.</p>

    <h3 class="g-h">Editorial (Post-Production)</h3>
    <p><b>Editor</b> — assembles the footage into the finished cut.</p>

    <p><b>Unit Production Manager (UPM)</b> — runs the logistics and the money day to day; approves spending and hires crew.</p>
    <p><b>Production Coordinator</b> — the office hub. Handles paperwork, travel, gear orders, and the flow of information to everyone.</p>
    <p><b>Production Assistant (PA)</b> — general support wherever needed: lock-ups, runs, setup, and keeping the day moving.</p>

    <h3 class="g-h">Locations</h3>
    <p><b>Location Manager</b> — finds, secures, and permits the places you shoot, and keeps the neighbors happy.</p>

    <h3 class="g-h">Television — Scripted Series</h3>
    <p>Series flip the film hierarchy. On a feature the director is the top creative voice; on a scripted series the <b>showrunner</b> is, because the show has to stay consistent across episodes and years while directors rotate in and out.</p>
    <p><b>Showrunner</b> — the head writer and final creative authority. Owns the story across the season, runs the writers' room, and approves cuts.</p>
    <p><b>Executive Producer (EP)</b> — a title covering several different jobs. Some EPs are writers, some financiers, some the person who set the show up. On a series the showrunner is usually also an EP.</p>
    <p><b>Co-Executive Producer / Supervising Producer / Story Editor</b> — these are writers' room ranks, not separate departments. The ladder runs roughly Staff Writer → Story Editor → Executive Story Editor → Co-Producer → Producer → Supervising Producer → Co-EP → EP.</p>
    <p><b>Episodic Director</b> — directs one or two episodes and serves the established look and tone rather than inventing one. A guest, not the boss.</p>
    <p><b>Writers' Assistant / Script Coordinator</b> — takes room notes, tracks continuity across episodes, and keeps script drafts and revision colors straight.</p>
    <p><b>Line Producer</b> — runs the physical production and the budget episode to episode.</p>
    <p><b>Post Producer / Post Supervisor</b> — manages the post pipeline, which on a series is running on several episodes simultaneously.</p>
    <div class="tip">Because episodes overlap, a series is often prepping episode 5, shooting episode 4, and cutting episode 3 in the same week. If you're tracking a series here, use Episodes to keep each one's script and schedule separate.</div>

    <h3 class="g-h">Television — Unscripted / Reality</h3>
    <p>Unscripted has no script to break down, so the structure shifts toward finding story in the field and building it in post. Titles borrow from both film and journalism.</p>
    <p><b>Showrunner</b> — again the top creative voice, but here the job is shaping story out of what actually happened rather than what was written.</p>
    <p><b>Field Producer</b> — runs the shoot on location. Decides what to cover, conducts interviews, and steers situations without scripting them.</p>
    <p><b>Story Producer</b> — finds the narrative. Works across footage and field notes to figure out what the episode is actually about, often working closely with editors.</p>
    <p><b>Segment Producer</b> — owns one self-contained piece of an episode start to finish.</p>
    <p><b>Casting Producer</b> — finds and vets participants, which on unscripted is closer to documentary research than to traditional casting.</p>
    <p><b>Associate Producer (AP) / Production Coordinator</b> — releases, logistics, scheduling, and keeping the paperwork trail intact.</p>
    <p><b>Logger / Assistant Editor</b> — transcribes and tags footage so story producers and editors can find moments later. On a show with hundreds of hours, this job quietly determines whether anything is findable.</p>
    <p><b>Camera Operator / DIT</b> — often shooting handheld and run-and-gun, with the DIT managing enormous daily card volume.</p>
    <p><b>Story Editor (post)</b> — in unscripted this is an <i>editing</i> role, not a writing rank. Different meaning from the scripted ladder above, which trips people up constantly.</p>

  walkie: `
    <p>The walkie is how a set stays coordinated, and it is one of the fastest ways to signal whether you have worked before. The vocabulary is small and worth learning properly — it exists to keep transmissions short, because everyone shares one channel.</p>

    <h3 class="g-h">Channels</h3>
    <p>Channel 1 is almost always <b>production</b> — the ADs and everyone who needs to hear them. Departments get their own channels so they can talk at length without clogging the main one: camera, G&amp;E, art, and so on. Numbering varies by production, so check the call sheet or ask.</p>
    <p>If you leave channel 1 to talk on another channel, say <b>"switching to 4"</b> first, and switch back promptly. If someone can't reach you, you were effectively off the radio.</p>

    <h3 class="g-h">The basic exchange</h3>
    <p>Someone calls your name or role. You answer with <b>"Go for Sam"</b> — meaning go ahead, I'm listening. They give you a short instruction. You reply <b>"Copy"</b> — meaning received and understood.</p>
    <p>That's the whole pattern, and it works because it confirms receipt. Silence is ambiguous; "copy" is not.</p>

    <h3 class="g-h">Phrases worth knowing</h3>
    <p><b>"Copy" / "Copy that"</b> — understood. The default acknowledgment.</p>
    <p><b>"Go for [name]"</b> — I'm here, go ahead.</p>
    <p><b>"Stand by"</b> — wait, I can't deal with this yet. Perfectly acceptable to say.</p>
    <p><b>"What's your 20?"</b> — where are you? (From the old ten-code "10-20", location.)</p>
    <p><b>"Eyes on…"</b> — do you have visual contact with this person or thing?</p>
    <p><b>"Flying in"</b> — the thing you asked for is on its way right now.</p>
    <p><b>"Back to one"</b> — everyone return to first positions for another take.</p>
    <p><b>"Last looks"</b> — hair, makeup, and wardrobe get final touches; a take is imminent.</p>
    <p><b>"Rolling"</b> — camera and sound are recording. Stop moving and be silent.</p>
    <p><b>"We're clear" / "Cut"</b> — the take is over, normal activity resumes.</p>
    <p><b>"10-1"</b> — bathroom break, briefly. <b>"10-2"</b> — a longer one. Both are normal; say it rather than vanishing.</p>
    <p><b>"20 minutes out"</b> — an estimated time until something arrives or happens.</p>
    <p><b>"Points" / "Hot points"</b> — I'm coming around a corner carrying something that could hit you.</p>

    <h3 class="g-h">Discipline</h3>
    <p><b>Wait a beat before you key up.</b> Press the button, pause half a second, then talk — otherwise the first word gets clipped. Release fully when done, or you hold the channel open and block everyone.</p>
    <p><b>Keep it short.</b> If it needs more than two sentences, switch to a department channel or find the person.</p>
    <p><b>Don't step on transmissions.</b> If two people key up at once, neither is heard. If you cut someone off, let them finish and come back after.</p>
    <p><b>Don't editorialize.</b> Jokes and complaints go on the walkie eventually and get heard by exactly the wrong person. Assume the director is listening, because they are.</p>
    <p><b>Use names, not "hey."</b> "Camera, this is Sam" beats "uh, hey, is anybody there."</p>

    <h3 class="g-h">Practical care</h3>
    <p>Do a <b>walkie check</b> when you sign one out — key up and ask for a radio check before you need it. Tape your name on it with a piece of gaff so it comes back to the right person, and so you don't lose it in a pile of identical radios.</p>
    <p>Batteries die around hour eight. Know where the spares and the charger are before that happens, and swap during a break rather than mid-take. If you have a surveillance earpiece, wear it — it keeps set quiet and keeps chatter out of the take.</p>
    <p>Return your radio at wrap. Lost walkies come out of somebody's budget, and everyone remembers whose.</p>

function renderAcademy(body){
  if(state.academyTopic && ACADEMY_CHAPTERS[state.academyTopic]){
    renderAcademyDetail(body, state.academyTopic);
    return;
  }
  const groups = {};
  Object.entries(ACADEMY_CHAPTERS).forEach(([key,c])=>{
    const cat = c.cat || 'reference';
    (groups[cat] = groups[cat] || []).push([key,c]);
  });
  body.innerHTML = `
    <input type="text" id="academySearch" class="glossary-search" placeholder="Search Learn Film...">
    <div id="academySections">
      ${Object.entries(ACADEMY_CATEGORIES).filter(([cat])=>groups[cat] && groups[cat].length).map(([cat,label])=>`
        <div class="section-title" style="margin-top:22px;">${esc(label)}</div>
        <div class="tpl-grid academy-grid" style="margin-top:12px;">
          ${groups[cat].map(([key,c])=>`
            <div class="tpl-card" data-topic="${key}" data-search="${esc((c.title+' '+c.desc).toLowerCase())}">
              <span class="stamp-icon">${esc(label)}</span>
              <h4>${esc(c.title)}</h4>
              <p style="font-size:12.5px;color:var(--ink-mute);margin:2px 0 0;line-height:1.4;">${esc(c.desc)}</p>
              <div class="tpl-open">Open <span>&rarr;</span></div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
    <div id="academyNoMatch" class="empty empty-plain" style="display:none;"><b>No matches</b>Try a different word.</div>
  `;
  body.querySelectorAll('.tpl-card').forEach(c=>{
    c.onclick = ()=>{ state.academyTopic = c.dataset.topic; render(); };
  });
  document.getElementById('academySearch').addEventListener('input', (e)=>{
    const q = e.target.value.trim().toLowerCase();
    let anyVisibleAtAll = false;
    body.querySelectorAll('.academy-grid').forEach(grid=>{
      let anyVisible = false;
      grid.querySelectorAll('.tpl-card').forEach(card=>{
        const show = !q || card.dataset.search.includes(q);
        card.style.display = show ? '' : 'none';
        if(show) anyVisible = true;
      });
      grid.style.display = anyVisible ? '' : 'none';
      if(grid.previousElementSibling) grid.previousElementSibling.style.display = anyVisible ? '' : 'none';
      if(anyVisible) anyVisibleAtAll = true;
    });
    document.getElementById('academyNoMatch').style.display = anyVisibleAtAll ? 'none' : '';
  });
}

function renderGlossary(body){
  const terms = [...GLOSSARY_TERMS].sort((a,b)=>a.term.localeCompare(b.term));
  let mode = 'all';
  body.innerHTML = `
    <input type="text" class="glossary-search" id="glossarySearch" placeholder="Search terms, e.g. 'gaffer' or 'coverage'...">
    <div class="subtabs" id="glossaryFilter">
      <div class="subtab active" data-mode="all">All Terms</div>
      <div class="subtab" data-mode="slang">On-Set Slang Only</div>
    </div>
    <div class="paper" id="glossaryList"></div>
  `;
  function draw(filter){
    const f = (filter||'').toLowerCase();
    const filtered = terms.filter(t=>{
      if(mode==='slang' && !t.slang) return false;
      return !f || t.term.toLowerCase().includes(f) || t.def.toLowerCase().includes(f);
    });
    document.getElementById('glossaryList').innerHTML = filtered.length ? filtered.map(t=>`
      <div class="glossary-item"><div class="term">${esc(t.term)}${t.slang ? '<span class="slang-badge">On-Set Slang</span>' : ''}</div><div class="def">${esc(t.def)}</div></div>
    `).join('') : '<div class="empty empty-plain">No terms match your search.</div>';
  }
  draw('');
  document.getElementById('glossarySearch').addEventListener('input', (e)=>draw(e.target.value));
  document.querySelectorAll('#glossaryFilter .subtab').forEach(chip=>{
    chip.onclick = ()=>{
      mode = chip.dataset.mode;
      document.querySelectorAll('#glossaryFilter .subtab').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      draw(document.getElementById('glossarySearch').value);
    };
  });
}

/* =========================================================
   SWIPE RIGHT FROM LEFT EDGE — opens the drawer, like a native app
========================================================= */
(function setupEdgeSwipe(){
  let startX = null, startY = null, mode = null; // 'open' | 'close'
  document.addEventListener('touchstart', (e)=>{
    if(!state.loaded || state.atHome || state.atSettings) { mode = null; return; }
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    // Drawer open: a left-swipe anywhere closes it. Closed: a right-swipe
    // that starts at the very left edge opens it.
    if(state.drawerOpen) mode = 'close';
    else mode = (t.clientX < 28) ? 'open' : null;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(!mode || startX===null) { startX = null; mode = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if(mode === 'open' && dx > 55 && dy < 60){ state.drawerOpen = true; render(); }
    else if(mode === 'close' && dx < -55 && dy < 60){ state.drawerOpen = false; render(); }
    startX = null; mode = null;
  }, {passive:true});
})();

/* =========================================================
   GLASS HEADER ON SCROLL — header goes translucent + blurred
   once content scrolls under it, solid at the very top.
========================================================= */
(function setupHeaderScrollGlass(){
  let ticking = false;
  function apply(){
    const header = document.querySelector('header.slate');
    // The in-project shell scrolls inside .layout; other screens scroll the
    // document. Take whichever is actually scrolled.
    const layout = document.querySelector('.app-shell .layout');
    const y = (layout && layout.scrollTop) || window.scrollY || 0;
    if(header) header.classList.toggle('scrolled', y > 8);
    ticking = false;
  }
  // Capture so scroll events from the inner .layout (which don't bubble) are
  // still seen, alongside document scroll on the home/settings screens.
  document.addEventListener('scroll', ()=>{
    if(!ticking){ requestAnimationFrame(apply); ticking = true; }
  }, {passive:true, capture:true});
})();

/* Single, permanent listener for all menubar-style dropdowns (Script's
   File/Edit/View, the sidebar's Filters, etc). Closes anything open
   whenever a click lands outside its own trigger+dropdown pair, found
   dynamically each time rather than captured per-render — so adding a
   new menubar anywhere never requires touching this listener. */
document.addEventListener('click', (e)=>{
  if(e.target.closest('.menubar-wrap')) return;
  document.querySelectorAll('.menubar-dropdown.open').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.menubar-trigger.open').forEach(t=>t.classList.remove('open'));
});

/* Undo/Redo keyboard shortcuts — scoped narrowly: only acts when the
   key event originates from inside an actual script block, so it never
   hijacks a browser's native undo in some other text field elsewhere
   in the app (project name, task text, etc). */
document.addEventListener('keydown', (e)=>{
  const key = e.key.toLowerCase();
  const mod = e.metaKey || e.ctrlKey;
  if(!mod) return;
  const isUndo = key === 'z' && !e.shiftKey;
  const isRedo = (key === 'z' && e.shiftKey) || key === 'y';
  if(!isUndo && !isRedo) return;
  const target = e.target;
  const inScriptBlock = target && target.closest && target.closest('.sblock');
  const nothingFocused = document.activeElement === document.body || !document.activeElement;
  const onScriptView = state.view === 'script' || state.scriptFocusMode;
  if(!inScriptBlock && !(nothingFocused && onScriptView)) return;
  e.preventDefault();
  const app = document.getElementById('app');
  if(isUndo) scriptUndo(app); else scriptRedo(app);
});

/* Bold/Italic/Underline shortcuts — simpler scoping than undo/redo
   since these never trigger a full re-render, so focus is never lost;
   requiring the event to originate inside an actual script block is
   sufficient here. */
document.addEventListener('keydown', (e)=>{
  const target = e.target;
  if(!target || !target.closest || !target.closest('.sblock')) return;
  const mod = e.metaKey || e.ctrlKey;
  if(!mod) return;
  const key = e.key.toLowerCase();
  const marker = key === 'b' ? '**' : key === 'i' ? '*' : key === 'u' ? '_' : null;
  if(!marker) return;
  e.preventDefault();
  applyTextStyleMarker(marker);
});

init();
