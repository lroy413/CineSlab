/* Parses Fountain-style **bold** / *italic* / _underline_ markers into
   renderable segments. Full segment rendering only applies when a
   block's text fits on one PDF line — for a line that wraps, markers
   are cleanly stripped instead of rendered rich. Correctly tracking
   marker positions across a word-wrap boundary is a much bigger
   problem than this feature needs to solve; better to degrade to
   plain (but clean) text than risk the export path everyone relies on. */
function parseEmphasisSegments(text){
  const segments = [];
  let remaining = text;
  const regex = /(\*\*(.+?)\*\*)|(\*(.+?)\*)|(_(.+?)_)/;
  let guard = 0;
  while(remaining.length && guard++ < 200){
    const m = remaining.match(regex);
    if(!m){ segments.push({text:remaining, bold:false, italic:false, underline:false}); break; }
    if(m.index > 0){ segments.push({text:remaining.slice(0, m.index), bold:false, italic:false, underline:false}); }
    if(m[1]) segments.push({text:m[2], bold:true, italic:false, underline:false});
    else if(m[3]) segments.push({text:m[4], bold:false, italic:true, underline:false});
    else if(m[5]) segments.push({text:m[6], bold:false, italic:false, underline:true});
    remaining = remaining.slice(m.index + m[0].length);
  }
  return segments;
}
function stripEmphasisMarkers(text){
  return text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1').replace(/_(.+?)_/g, '$1');
}
function drawScreenplayBlocks(doc, blocks, startY){
  let y = startY;
  const lineH = 0.19;
  function ensureSpace(n){ if(y + n*lineH > 10){ doc.addPage(); y = 1; } }
  doc.setFont('courier','normal'); doc.setFontSize(12);
  blocks.forEach(b=>{
    if(!b.text || !b.text.trim()) return;
    let x=1.5, width=6, align='left', bold=false, upper=false, extraTop=0.12;
    if(b.type==='scene'){ width=6; upper=true; bold=true; }
    else if(b.type==='action'){ width=6; }
    else if(b.type==='character'){ x=3.7; width=3; upper=true; extraTop=0.19; }
    else if(b.type==='parenthetical'){ x=3.1; width=2.3; }
    else if(b.type==='dialogue'){ x=2.5; width=3.3; }
    else if(b.type==='transition'){ x=7.5; width=3; align='right'; upper=true; extraTop=0.19; }
    else if(b.type==='shot'){ width=6; upper=true; }
    else if(b.type==='newact'){ x=4.25; width=5; align='center'; upper=true; bold=true; extraTop=0.3; }
    else if(b.type==='endact'){ x=4.25; width=5; align='center'; upper=true; bold=true; extraTop=0.3; }

    const stripped = stripEmphasisMarkers(b.text);
    const displayStripped = upper ? stripped.toUpperCase() : stripped;
    const lines = doc.splitTextToSize(displayStripped, width);
    ensureSpace(lines.length + extraTop/lineH);
    y += extraTop;

    const hasMarkers = /(\*\*|\*|_)/.test(b.text);
    const canRenderRich = align === 'left' && !bold && lines.length === 1 && hasMarkers;
    if(canRenderRich){
      ensureSpace(1);
      const segments = parseEmphasisSegments(upper ? b.text.toUpperCase() : b.text);
      let curX = x;
      segments.forEach(seg=>{
        if(!seg.text) return;
        doc.setFont('courier', seg.bold ? 'bold' : (seg.italic ? 'italic' : 'normal'));
        doc.text(seg.text, curX, y);
        if(seg.underline){
          const w = doc.getTextWidth(seg.text);
          doc.line(curX, y+0.02, curX+w, y+0.02);
        }
        curX += doc.getTextWidth(seg.text);
      });
      y += lineH;
    } else {
      doc.setFont('courier', bold ? 'bold' : 'normal');
      lines.forEach(line=>{
        ensureSpace(1);
        doc.text(line, x, y, {align});
        y += lineH;
      });
    }
  });
  return y;
}
function drawTitlePagePDF(doc, tp, addTrailingPage){

function openRevisionsModal(main){
  const revs = currentScript().revisions;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  function paint(){
    overlay.innerHTML = `<div class="modal">
      <h3>Script Revisions</h3>
      <p class="modal-note">Save a snapshot before a major rewrite. Each saved revision gets the next color in the standard industry sequence — White is always your current, live draft, never a saved snapshot itself.</p>
      <button class="btn btn-tape btn-sm" id="saveRevBtn" style="width:100%;margin-bottom:14px;">+ Save Current Draft as a Revision</button>
      ${revs.length ? `<div class="picker-list">
        ${revs.slice().reverse().map(r=>`
          <div class="rev-row" data-id="${r.id}">
            <span class="rev-dot" style="background:${r.color.hex};"></span>
            <div style="flex:1;min-width:0;">
              <div class="card-title" style="font-size:13.5px;">${esc(r.color.name)}${r.label ? ' — '+esc(r.label) : ''}</div>
              <div class="card-sub">${new Date(r.savedAt).toLocaleDateString()} · ${r.blockCount} elements</div>
            </div>
            <button class="btn btn-outline btn-sm" data-restore="${r.id}">Restore</button>
            <button class="btn-icon" data-delrev="${r.id}" title="Delete this revision">${UI_ICONS.trash}</button>
          </div>
        `).join('')}
      </div>` : `<div class="empty"><b>No revisions saved yet</b>Save one before a big rewrite so you can always go back.</div>`}
      <button class="btn btn-ghost btn-sm" id="closeRevModal" style="margin-top:16px;width:100%;background:var(--slate);color:#fff;border:none;">Close</button>
    </div>`;
    overlay.querySelector('#closeRevModal').onclick = ()=>overlay.remove();
    overlay.querySelector('#saveRevBtn').onclick = async ()=>{
      const label = await openPromptModal('Save Revision', 'Optional label (e.g. "Before act 2 rewrite")', '');
      if(label === null) return;
      saveScriptRevision(label);
      renderScript(main);
      paint();
    };
    overlay.querySelectorAll('[data-restore]').forEach(btn=>{
      btn.onclick = async ()=>{
        const rev = revs.find(r=>r.id===btn.dataset.restore);
        const ok = await openConfirmModal(`Restore ${rev.color.name}${rev.label?' — '+rev.label:''}?`, "This replaces your current script with this saved revision. Your current draft isn't automatically saved first — close this and save it as a revision now if you want to keep it.", 'Restore');
        if(ok){
          currentScript().blocks = JSON.parse(JSON.stringify(rev.blocks));
          saveProjectData();
          overlay.remove();
          renderScript(main);
        }
      };
    });
    overlay.querySelectorAll('[data-delrev]').forEach(btn=>{
      btn.onclick = async ()=>{
        const ok = await openConfirmModal('Delete this revision?', 'This cannot be undone.', 'Delete');
        if(ok){
          currentScript().revisions = revs.filter(r=>r.id!==btn.dataset.delrev);
          saveProjectData();
          paint();
        }
      };
    });
  }
  paint();
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

function exportBreakdownPDF(){
  const scenes = scriptScenes();
  const breakdown = state.projectData.breakdown;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text('Script Breakdown — Element List', 0.6, 0.7);
  let y = 1.1;
  scenes.forEach(scene=>{
    const entries = breakdown[scene.id] || [];
    if(!entries.length) return;
    if(y > 9.5){ pdf.addPage(); y = 1; }
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11);
    pdf.text(scene.text || '(untitled scene)', 0.6, y);
    y += 0.22;
    const body = BREAKDOWN_CATEGORIES.flatMap(cat=>
      entries.filter(e=>e.category===cat.key).map(e=>[cat.label, e.text])
    );
    pdf.autoTable({ startY:y, head:[['Category','Element']], body, styles:{fontSize:9}, margin:{left:0.6,right:0.6} });
    y = pdf.lastAutoTable.finalY + 0.3;
  });
  pdf.save('script-breakdown.pdf');
}

  if(!blocks.length) return blocks;
  const result = [blocks[0]];
  let including = false;
  blocks.slice(1).forEach(b=>{
    if(b.type === 'character'){
      including = b.text.trim().toUpperCase() === characterName.trim().toUpperCase();
      if(including) result.push(b);
    } else if(including && (b.type==='dialogue' || b.type==='parenthetical')){
      result.push(b);
    }
  });
  return result;
}
function sidesBlocksForScene(s, sceneId){
  if(s.dialogueOnly && s.characterName.trim()) return blocksForSceneCharacterFocus(sceneId, s.characterName);
  return blocksForScene(sceneId);
}

function orderedSelectedScenes(s){
  const allScenes = scriptScenes();
  return allScenes.filter(sc=>s.sceneIds.includes(sc.id));
}
function renderSidesPreview(s){
  const el = document.getElementById('sidesPreview');
  if(!el) return;
  const orderedScenes = orderedSelectedScenes(s);
  el.innerHTML = orderedScenes.map(sc=>{
    const blocks = sidesBlocksForScene(s, sc.id);
    return blocks.map(b=>`<div class="sblock-row">
      <div class="sblock sb-${b.type}" data-id="${b.id}" style="${b.highlight ? 'background:'+highlightColor(b.highlight,0.35)+';' : ''}">${esc(b.text)}</div>
      <button class="sblock-annotate" type="button" title="${b.note?'Has a note — click to edit':'Add note or highlight'}" style="${b.highlight?'color:'+highlightColor(b.highlight,1)+';border-color:'+highlightColor(b.highlight,1)+';':''}">${b.note?'●':'○'}</button>
    </div>`).join('');
  }).join('<hr style="border:none;border-top:1px dashed var(--line);margin:18px 0;">');
  el.querySelectorAll('.sblock-annotate').forEach(btn=>{
    const blockEl = btn.previousElementSibling;
    btn.onclick = ()=>openBlockAnnotateModal(blockEl.dataset.id, document.getElementById('mainView'));
  });
}

function exportSidesPDF(s){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'in', format:'letter'});
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('SIDES', 1, 0.8);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const proj = currentProject();
  doc.text(`${(proj && proj.name) || ''}${s.characterName ? '  —  Prepared for: '+s.characterName : ''}`, 1, 1.0);
  let y = 1.3;
  if(s.notes){
    const lines = doc.splitTextToSize('Note: '+s.notes, 6.5);
    doc.text(lines, 1, y);
    y += lines.length * 0.16 + 0.15;
  }
  const orderedScenes = orderedSelectedScenes(s);
  orderedScenes.forEach((sc, i)=>{
    const blocks = sidesBlocksForScene(s, sc.id);
    y = drawScreenplayBlocks(doc, blocks, y);
    if(i < orderedScenes.length - 1){
      y += 0.15;
      if(y > 9.5){ doc.addPage(); y = 1; }
    }
  });
  doc.save((s.name || 'sides').replace(/[^\w\- ]/g,'') + '.pdf');
}

function wireShotRows(main, sl){
  const fileInput = document.getElementById('refFileInput');
  fileInput.onchange = async ()=>{
    const files = Array.from(fileInput.files || []);
    const targetShot = fileInput.dataset.target;
    for(const f of files){
      try{
        const dataUrl = await resizeImageFile(f);
        await addRefImage(targetShot, dataUrl);
      }catch(err){
        await openAlertModal('Could not add photo', 'That file could not be read as an image.');
      }
    }
    fileInput.value = '';
    renderShotlistDetail(main);
  };

  main.querySelectorAll('#shotBody .shot-toggle').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggle;
      const idx = state.collapsedShotIds.indexOf(id);
      if(idx === -1) state.collapsedShotIds.push(id);
      else state.collapsedShotIds.splice(idx, 1);
      renderShotlistDetail(main);
    };
  });
  main.querySelectorAll('#shotBody .shot-card').forEach(tr=>{
    const shot = sl.shots.find(s=>s.id===tr.dataset.id);
    tr.querySelectorAll('[data-f]').forEach(el=>{
      const field = el.dataset.f;
      const evt = (el.tagName==='SELECT'||el.type==='checkbox') ? 'change' : 'input';
      el.addEventListener(evt, ()=>{ shot[field] = el.type==='checkbox' ? el.checked : el.value; saveProjectData(); });
    });
    tr.querySelectorAll('[data-addref]').forEach(btn=>{
      btn.onclick = ()=>{ fileInput.dataset.target = btn.dataset.addref; fileInput.click(); };
    });
    tr.querySelectorAll('.ref-thumb').forEach(img=>{
      img.onclick = ()=>{
        openLightbox(img.dataset.shot, parseInt(img.dataset.idx), ()=>renderShotlistDetail(main));
      };
    });
    tr.querySelector('.row-del').onclick = ()=>{
      sl.shots = sl.shots.filter(s=>s.id!==shot.id);
      saveProjectData();
      renderShotlistDetail(main);
    };
  });
}

function exportShotlistPDF(sl){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter', orientation:'landscape'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(14);
  pdf.text(sl.name, 0.5, 0.6);
  pdf.autoTable({

            <div class="cf"><label>Height</label><select data-f="height">${LIGHT_HEIGHTS.map(h=>`<option ${h===(f.height||'—')?'selected':''}>${h}</option>`).join('')}</select></div>
            <div class="cf"><label>Gel</label><input type="text" data-f="gel" value="${esc(f.gel)}" placeholder="CTO / CTB"></div>

  document.getElementById('colorTemp').oninput = (e)=>{ s.colorTemp = e.target.value; debouncedSaveProject(); };
  document.getElementById('ratio').oninput = (e)=>{ s.ratio = e.target.value; debouncedSaveProject(); };
  document.getElementById('mood').oninput = (e)=>{ s.mood = e.target.value; debouncedSaveProject(); };
  document.getElementById('setupScene').onchange = (e)=>{ s.sceneId = e.target.value; saveProjectData(); renderLightingDetail(main); };

  const sunDateEl = document.getElementById('sunDate');
  if(sunDateEl) sunDateEl.onchange = (e)=>{ s.sunDate = e.target.value; saveProjectData(); renderLightingDetail(main); };
  const northEl = document.getElementById('northOffset');
  if(northEl) northEl.oninput = (e)=>{
    s.northOffset = ((parseInt(e.target.value,10) || 0) % 360 + 360) % 360;
    debouncedSaveProject();
    drawDiagram();
  };
  document.getElementById('addFixture').onclick = ()=>{
    const p = polarNorm(135, LIGHT_CANVAS.orbitR);
    s.fixtures.push({id:uid(), role:'Key', x:p.x, y:p.y, fixtureType:'', intensity:'', gel:'', modifier:'—', height:'—', colorTemp:'', notes:''});
    saveProjectData();
    renderLightingDetail(main);
  };

  function drawDiagram(){
    const wrap = document.getElementById('diagramWrap');
    wrap.innerHTML = buildLightingSVG(s, {interactive:true, sun:sceneIsExterior(s.sceneId) ? setupSunInfo(s) : null});

    const files = Array.from(refInput.files || []);
    for(const f of files){
      try{
        const dataUrl = await resizeImageFile(f);
        const ok = await addRefImage(s.id, dataUrl);
        if(!ok) break;
      } catch(err){
        await openAlertModal('Could not add photo', 'That file could not be read as an image.');
      }

    img.onclick = ()=>openLightbox(img.dataset.shot, parseInt(img.dataset.idx,10), ()=>renderLightingDetail(main));
  });
  document.getElementById('addSubject').onclick = ()=>{
    const n = s.subjects.length + 1;
    const sub = emptyLightSubject(n);
    // Offset so a new subject doesn't land exactly under an existing one.
    sub.x = Math.min(0.85, 0.5 + 0.13 * (n - 1));
    s.subjects.push(sub);
    saveProjectData();
    renderLightingDetail(main);
  };
  document.getElementById('addCamera').onclick = ()=>{
    const n = s.cameras.length + 1;
    const cam = emptyLightCamera(n);
    cam.x = Math.min(0.9, 0.5 + 0.16 * (n - 1));
    s.cameras.push(cam);
    saveProjectData();
    renderLightingDetail(main);
  };

    const kind = chip.dataset.elkind;
    const list = kind === 'subject' ? s.subjects : s.cameras;
    const item = list.find(x=>x.id === chip.dataset.elid);
    if(!item) return;
    chip.querySelector('.ld-chip-name').oninput = (e)=>{
      item.label = e.target.value;
      debouncedSaveProject();
      drawDiagram();
    };
    const x = chip.querySelector('.ld-chip-x');
    if(x) x.onclick = ()=>{
      const i = list.indexOf(item);
      if(i > -1) list.splice(i, 1);
      saveProjectData();
      renderLightingDetail(main);
    };
  });
  main.querySelectorAll('#fixtureBody [data-place]').forEach(sel=>{
    sel.onchange = ()=>{
      const f = s.fixtures.find(x=>x.id === sel.closest('.fixture-card').dataset.id);
      if(!f || !sel.value) return;
      if(sel.value === 'Overhead'){
        f.x = 0.5; f.y = 0.5 - LIGHT_CANVAS.overheadR;
      } else {
        const angle = LIGHT_ANGLE[sel.value] !== undefined ? LIGHT_ANGLE[sel.value] : 180;
        const p = polarNorm(angle, LIGHT_CANVAS.orbitR);
        f.x = p.x; f.y = p.y;
      }
      sel.value = '';           // it's an action, not a stored value
      saveProjectData();
      drawDiagram();
    };
  });

  const collapseAllFx = document.getElementById('collapseAllFixtures');
  if(collapseAllFx) collapseAllFx.onclick = ()=>{
    const ids = s.fixtures.map(f=>f.id);
    if(allFixturesCollapsed){
      state.collapsedFixtureIds = state.collapsedFixtureIds.filter(id=>!ids.includes(id));
    } else {
      ids.forEach(id=>{ if(!state.collapsedFixtureIds.includes(id)) state.collapsedFixtureIds.push(id); });
    }
    renderLightingDetail(main);
  };
  main.querySelectorAll('[data-togglefx]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.togglefx;
      const i = state.collapsedFixtureIds.indexOf(id);
      if(i === -1) state.collapsedFixtureIds.push(id); else state.collapsedFixtureIds.splice(i,1);
      renderLightingDetail(main);
    };
  });
  function moveFixture(id, delta){
    const i = s.fixtures.findIndex(f=>f.id===id);
    const j = i + delta;
    if(i < 0 || j < 0 || j >= s.fixtures.length) return;
    const [item] = s.fixtures.splice(i, 1);
    s.fixtures.splice(j, 0, item);
    saveProjectData();
    renderLightingDetail(main);
  }
  main.querySelectorAll('[data-fxup]').forEach(b=>{ b.onclick = ()=>moveFixture(b.dataset.fxup, -1); });
  main.querySelectorAll('[data-fxdown]').forEach(b=>{ b.onclick = ()=>moveFixture(b.dataset.fxdown, 1); });
  main.querySelectorAll('[data-fxdup]').forEach(b=>{
    b.onclick = ()=>{
      const i = s.fixtures.findIndex(f=>f.id===b.dataset.fxdup);
      if(i < 0) return;
      const copy = { ...s.fixtures[i], id: uid() };
      // Nudge it clear of the original, otherwise the duplicate hides
      // underneath and looks like nothing happened.
      copy.x = Math.min(0.96, copy.x + 0.06);
      copy.y = Math.min(0.96, copy.y + 0.06);
      s.fixtures.splice(i + 1, 0, copy);
      saveProjectData();
      renderLightingDetail(main);
    };
  });
  main.querySelectorAll('#fixtureBody .fixture-card').forEach(card=>{
    const fixture = s.fixtures.find(f=>f.id===card.dataset.id);
    if(!fixture) return;
    card.querySelectorAll('[data-f]').forEach(el=>{
      const field = el.dataset.f;
      const evt = el.tagName==='SELECT' ? 'change' : 'input';
      el.addEventListener(evt, ()=>{
        fixture[field] = el.value;
        saveProjectData();
        if(field === 'role') renderLightingDetail(main);   // colour dot + diagram
        else drawDiagram();
      });
    });
    const del = card.querySelector('[data-fxdel]');
    if(del) del.onclick = ()=>{
      s.fixtures = s.fixtures.filter(f=>f.id!==fixture.id);
      state.collapsedFixtureIds = state.collapsedFixtureIds.filter(id=>id!==fixture.id);
      saveProjectData();
      renderLightingDetail(main);
    };
  });
}

/* Turns a dragged position back into words for printed paperwork.
   Angles follow the diagram's convention, where camera-left appears on
   the right of an overhead plan because the camera faces the subject. */
function describeFixturePosition(f, subjects){
  if(!subjects || !subjects.length) return '—';
  let nearest = subjects[0], best = Infinity;
  subjects.forEach(sub=>{
    const d = (sub.x-f.x)**2 + (sub.y-f.y)**2;
    if(d < best){ best = d; nearest = sub; }
  });
  const dx = f.x - nearest.x, dy = f.y - nearest.y;
  const dist = Math.hypot(dx, dy);
  // Overhead sits at LIGHT_CANVAS.overheadR from the subject, well inside
  // the normal orbit, so the cut-off has to sit between the two.
  if(dist < 0.20) return 'Overhead';
  let ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  if(ang < 0) ang += 360;
  let bestName = 'Back', bestDiff = 999;
  LIGHT_POSITIONS.forEach(name=>{
    const target = LIGHT_ANGLE[name];
    if(target === undefined || name === 'Overhead') return;
    // Standard circular distance: 0 when identical, 180 when opposite.
    const diff = Math.abs(((ang - target + 540) % 360) - 180);
    if(diff < bestDiff){ bestDiff = diff; bestName = name; }
  });
  return bestName;
}
function exportLightingPDF(s){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text(s.name, 0.6, 0.7);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
  const sceneBlock = s.sceneId ? scriptScenes().find(x=>x.id===s.sceneId) : null;
  if(sceneBlock){
    pdf.setFont('helvetica','bold');
    pdf.text(pdf.splitTextToSize(sceneBlock.text || '(untitled scene)', 7), 0.6, 0.95);
    pdf.setFont('helvetica','normal');
  }
  pdf.text(`Color Temp: ${s.colorTemp||'-'}   Ratio: ${s.ratio||'-'}`, 0.6, sceneBlock ? 1.18 : 1.0);
  if(s.mood){ pdf.text(pdf.splitTextToSize('Mood/Style: '+s.mood, 7), 0.6, sceneBlock ? 1.36 : 1.2); }

  // The printed diagram uses the same normalized coordinates the on-screen
  // one does, so what you dragged is what you get on paper.
  normalizeLightingSetup(s);
  const PX = 0.6, PY = 1.5, PW = 3.4, PH = 3.4;      // inches
  const nx = (n)=> PX + n * PW;
  const ny = (n)=> PY + n * PH;

  s.fixtures.forEach(f=>{
    if(!s.subjects.length) return;
    let nearest = s.subjects[0], best = Infinity;
    s.subjects.forEach(sub=>{
      const d = (sub.x-f.x)**2 + (sub.y-f.y)**2;
      if(d < best){ best = d; nearest = sub; }
    });
    const hex = (LIGHT_ROLE_COLOR[f.role]||'#726C60').replace('#','');
    const rC = parseInt(hex.substring(0,2),16), gC = parseInt(hex.substring(2,4),16), bC = parseInt(hex.substring(4,6),16);
    pdf.setDrawColor(rC,gC,bC); pdf.setLineDashPattern([0.03,0.03],0);
    pdf.line(nx(f.x), ny(f.y), nx(nearest.x), ny(nearest.y));
    pdf.setLineDashPattern([],0);
  });

  s.subjects.forEach(sub=>{
    pdf.setDrawColor(114,108,96); pdf.setFillColor(239,234,221);
    pdf.circle(nx(sub.x), ny(sub.y), 0.2, 'FD');
    pdf.setFontSize(7); pdf.setTextColor(114,108,96);
    pdf.text((sub.label||'S').slice(0,4).toUpperCase(), nx(sub.x), ny(sub.y)+0.04, {align:'center'});
  });
  s.cameras.forEach(cam=>{
    pdf.setFillColor(28,27,25);
    pdf.rect(nx(cam.x)-0.13, ny(cam.y)-0.09, 0.26, 0.18, 'F');
    pdf.setFontSize(7); pdf.setTextColor(114,108,96);
    pdf.text((cam.label||'CAM').toUpperCase(), nx(cam.x), ny(cam.y)+0.3, {align:'center'});
  });
  s.fixtures.forEach(f=>{
    const hex = (LIGHT_ROLE_COLOR[f.role]||'#726C60').replace('#','');
    const rC = parseInt(hex.substring(0,2),16), gC = parseInt(hex.substring(2,4),16), bC = parseInt(hex.substring(4,6),16);
    pdf.setFillColor(rC,gC,bC);
    pdf.circle(nx(f.x), ny(f.y), 0.09, 'F');
    pdf.setTextColor(44,42,38); pdf.setFontSize(7);
    pdf.text(f.role, nx(f.x), ny(f.y)+0.22, {align:'center'});
  });

  pdf.setTextColor(44,42,38);
  let y = 4.3;
  pdf.autoTable({
    startY: y,
    head: [['Role','Position','Fixture','Mod / Height','Intensity','Gel / Temp','Notes']],
    body: s.fixtures.map(f=>[f.role, describeFixturePosition(f, s.subjects), f.fixtureType,
      [f.modifier && f.modifier!=='—' ? f.modifier : '', f.height && f.height!=='—' ? f.height : ''].filter(Boolean).join(' / ') || '—',
      f.intensity, [f.gel, f.colorTemp].filter(Boolean).join(' ') || '—', f.notes]),
    styles:{fontSize:9}, margin:{left:0.6,right:0.6}
  });
  pdf.save(s.name.replace(/[^\w\- ]/g,'') + '.pdf');
}

function wireBrollRows(main, entries){

        const dataUrl = await resizeImageFile(f);
        await addRefImage(target, dataUrl);
      }catch(err){
        await openAlertModal('Could not add photo', 'That file could not be read as an image.');
      }
    }
    fileInput.value = '';
    renderBrollTracker(main);
  };
  main.querySelectorAll('#brollBody tr').forEach(tr=>{
    const entry = entries.find(e=>e.id===tr.dataset.id);
    tr.querySelectorAll('[data-f]').forEach(el=>{
      const field = el.dataset.f;
      const evt = el.tagName==='SELECT' ? 'change' : 'input';
      el.addEventListener(evt, ()=>{ entry[field] = el.value; saveProjectData(); });
    });
    tr.querySelectorAll('[data-addref]').forEach(btn=>{
      btn.onclick = ()=>{ fileInput.dataset.target = btn.dataset.addref; fileInput.click(); };
    });
    tr.querySelectorAll('.ref-thumb').forEach(img=>{
      img.onclick = ()=>{ openLightbox(img.dataset.shot, parseInt(img.dataset.idx), ()=>renderBrollTracker(main)); };

      state.projectData.brollEntries = state.projectData.brollEntries.filter(x=>x.id!==entry.id);
      saveProjectData();
      renderBrollTracker(main);
    };
  });
}

  fileInput.onchange = async ()=>{
    const files = Array.from(fileInput.files || []);
    const target = fileInput.dataset.target;

      try{ const dataUrl = await resizeImageFile(f); await addRefImage(target, dataUrl); }

  };
  main.querySelectorAll('.storyboard-panel').forEach(panelEl=>{
    const panel = b.panels.find(p=>p.id===panelEl.dataset.id);
    const idx = b.panels.indexOf(panel);
    panelEl.querySelectorAll('[data-f]').forEach(el=>{
      const field = el.dataset.f;
      const evt = el.tagName==='SELECT' ? 'change' : 'input';
      el.addEventListener(evt, ()=>{ panel[field] = el.value; saveProjectData(); });
    });
    panelEl.querySelectorAll('[data-addref]').forEach(el=>{
      el.onclick = ()=>{ fileInput.dataset.target = panel.id; fileInput.click(); };

      img.onclick = ()=>openLightbox(img.dataset.shot, parseInt(img.dataset.idx), ()=>renderStoryboardDetail(main));
    });

      b.panels = b.panels.filter(p=>p.id!==panel.id);

      btn.onclick = ()=>{

        const swapIdx = idx + dir;
        if(swapIdx < 0 || swapIdx >= b.panels.length) return;
        [b.panels[idx], b.panels[swapIdx]] = [b.panels[swapIdx], b.panels[idx]];
        saveProjectData();
        renderStoryboardDetail(main);
      };
    });
  });
}

function exportStoryboardPDF(b){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text(b.name, 0.6, 0.6);
  const colW = 3.3, rowH = 3.1, startX = 0.6, startY = 0.9, gapX = 0.3, gapY = 0.3;
  let col = 0, row = 0;
  b.panels.forEach((p, i)=>{
    const x = startX + col*(colW+gapX);
    const y = startY + row*(rowH+gapY);
    if(y + rowH > 10){ pdf.addPage(); row = 0; col = 0; }
    const fx = startX + col*(colW+gapX), fy = startY + row*(rowH+gapY);
    pdf.setDrawColor(180,180,180);
    pdf.rect(fx, fy, colW, rowH);
    const imgs = state.images[p.id] || [];
    if(imgs[0]){
      try{ pdf.addImage(imgs[0], 'JPEG', fx+0.1, fy+0.1, colW-0.2, rowH-1.1, undefined, 'FAST'); }catch(e){}
    }
    pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
    pdf.text(`Panel ${i+1} — ${p.shotType}`, fx+0.1, fy+rowH-0.75);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    const lines = pdf.splitTextToSize(p.description || '', colW-0.2);
    pdf.text(lines.slice(0,3), fx+0.1, fy+rowH-0.55);
    col++;
    if(col >= 2){ col = 0; row++; }
  });
  pdf.save(b.name.replace(/[^\w\- ]/g,'') + '.pdf');
}

    const ids = days.map(d=>d.id);
    const allDown = ids.length && ids.every(id=>state.collapsedDayIds.includes(id));
    if(allDown) state.collapsedDayIds = state.collapsedDayIds.filter(id=>!ids.includes(id));
    else ids.forEach(id=>{ if(!state.collapsedDayIds.includes(id)) state.collapsedDayIds.push(id); });
    renderScheduleListView(main, fullMain);
  };
  main.querySelectorAll('[data-opensheet]').forEach(a=>{
    a.onclick = (e)=>{
      e.preventDefault();
      state.currentCallsheetId = a.dataset.opensheet;
      state.view = 'callsheet-detail';
      render();
    };
  });
  main.querySelectorAll('[data-delday]').forEach(btn=>{
    btn.onclick = async ()=>{
      const ok = await openConfirmModal('Delete shoot day?', 'Scenes assigned to this day become unscheduled again. You can restore this from the Recycle Bin if you change your mind.', 'Delete');
      if(ok){

        moveToTrash('shootDay', 'shootDays', item, item.label);
        state.projectData.shootDays = days.filter(d=>d.id!==btn.dataset.delday);
        saveProjectData();
        renderScheduleHome(fullMain);
      }
    };
  });
  main.querySelectorAll('[data-unschedule]').forEach(btn=>{
    btn.onclick = ()=>{
      const day = days.find(d=>d.id===btn.dataset.day);
      day.sceneIds = day.sceneIds.filter(id=>id!==btn.dataset.unschedule);
      saveProjectData();
      renderScheduleHome(fullMain);
    };
  });
  main.querySelectorAll('.schedule-add-select').forEach(sel=>{

      saveProjectData();
      renderScheduleHome(fullMain);
    };
  });
}

function renderScheduleStripboard(main, fullMain){
  const scenes = scriptScenes();
  const days = state.projectData.shootDays;
  const scheduledIds = new Set(days.flatMap(d=>d.sceneIds));
  const unscheduled = scenes.filter(s=>!scheduledIds.has(s.id));
  const dayOfScene = {};
  days.forEach(d=>{ d.sceneIds.forEach(sid=>{ dayOfScene[sid] = d.id; }); });

  function strip(s){
    const meta = sceneMeta(s);
    const settingClass = meta.setting === 'EXT' ? 'strip-ext' : meta.setting === 'INT/EXT' ? 'strip-intext' : 'strip-int';
    const nightClass = meta.timeOfDay === 'NIGHT' ? 'strip-night' : '';
    const currentDayId = dayOfScene[s.id] || '';
    return `<div class="strip ${settingClass} ${nightClass}" draggable="true" data-scene="${s.id}">
      <span class="strip-tag">${esc(meta.setting||'—')}${meta.timeOfDay?' · '+esc(meta.timeOfDay):''}</span>
      <span class="strip-text">${esc(s.text || '(untitled scene)')}</span>
      <select class="strip-move" data-scenemove="${s.id}" title="Move to a different day">
        <option value="">Move to…</option>
        <option value="__unscheduled__" ${!currentDayId?'disabled':''}>Unscheduled</option>
        ${days.map(d=>`<option value="${d.id}" ${d.id===currentDayId?'disabled':''}>${esc(d.label)}</option>`).join('')}
      </select>
    </div>`;
  }

  main.innerHTML = `
    <div class="toolbar">
      <button class="fab-add" id="addDayStrip" title="Add Shoot Day" aria-label="Add Shoot Day">+</button>
      <button class="btn btn-outline btn-sm" id="learnBtnStrip">? How this works</button>
    </div>
    <p class="modal-note" style="margin:-8px 0 16px;">Drag scenes between days on desktop, or use the "Move to…" picker on any device, to test different shooting orders. Blue = interior, orange = exterior; a darker strip means a night scene.</p>
    <div class="strip-bucket" data-bucket="unscheduled">
      <div class="strip-bucket-head">Unscheduled <span>(${unscheduled.length})</span></div>
      <div class="strip-list" data-day="">
        ${unscheduled.length ? unscheduled.map(strip).join('') : '<div class="strip-empty">Every scene is scheduled.</div>'}
      </div>
    </div>
    ${days.map(d=>`
      <div class="strip-bucket" data-bucket="${d.id}">
        <div class="strip-bucket-head">${esc(d.label)}${d.date?' · '+esc(d.date):''} <span>(${d.sceneIds.length})</span></div>
        <div class="strip-list" data-day="${d.id}">
          ${d.sceneIds.length ? d.sceneIds.map(sid=>{
            const s = scenes.find(x=>x.id===sid);
            return s ? strip(s) : '';
          }).join('') : '<div class="strip-empty">Drop scenes here, or use "Move to…" on a scene above.</div>'}
        </div>
      </div>
    `).join('')}
    ${days.length===0 ? '<div class="empty"><b>No shoot days yet</b>Add a shoot day to start arranging scenes.</div>' : ''}
  `;
  document.getElementById('learnBtnStrip').onclick = ()=>goLearn('schedule');
  document.getElementById('addDayStrip').onclick = async ()=>{
    const label = await openPromptModal('New shoot day', 'e.g. "Day 1"', 'Day '+(days.length+1));
    if(!label) return;
    days.push({id:uid(), label, date:'', sceneIds:[], notes:''});
    saveProjectData();
    renderScheduleHome(fullMain);
  };

  function moveSceneInStripboard(sceneId, targetDayId, beforeSceneId){
    days.forEach(d=>{ d.sceneIds = d.sceneIds.filter(id=>id!==sceneId); });
    if(targetDayId){
      const day = days.find(d=>d.id===targetDayId);
      if(day){
        if(beforeSceneId){
          const idx = day.sceneIds.indexOf(beforeSceneId);
          if(idx === -1) day.sceneIds.push(sceneId); else day.sceneIds.splice(idx, 0, sceneId);
        } else {
          day.sceneIds.push(sceneId);
        }
      }
    }
    saveProjectData();
    renderScheduleStripboard(main, fullMain);
  }

  let draggedSceneId = null;
  main.querySelectorAll('.strip').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ draggedSceneId = el.dataset.scene; el.classList.add('strip-dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('strip-dragging'); });
    el.addEventListener('dragover', (e)=>{ e.preventDefault(); });
    el.addEventListener('drop', (e)=>{
      e.preventDefault(); e.stopPropagation();
      if(!draggedSceneId || draggedSceneId === el.dataset.scene) return;
      moveSceneInStripboard(draggedSceneId, el.closest('.strip-list').dataset.day, el.dataset.scene);
    });
  });
  main.querySelectorAll('.strip-list').forEach(listEl=>{
    listEl.addEventListener('dragover', (e)=>{ e.preventDefault(); });
    listEl.addEventListener('drop', (e)=>{
      e.preventDefault();
      if(!draggedSceneId) return;
      moveSceneInStripboard(draggedSceneId, listEl.dataset.day, null);
    });
  });
  main.querySelectorAll('.strip-move').forEach(sel=>{
    sel.onclick = (e)=>e.stopPropagation();
    sel.onchange = ()=>{
      if(!sel.value) return;
      moveSceneInStripboard(sel.dataset.scenemove, sel.value === '__unscheduled__' ? null : sel.value, null);
    };
  });
}

function exportSchedulePDF(){
  const scenes = scriptScenes();
  const days = state.projectData.shootDays;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text('Shooting Schedule', 0.6, 0.7);
  let y = 1.1;
  days.forEach(d=>{
    if(y > 9.3){ pdf.addPage(); y = 1; }
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11);
    pdf.text(`${d.label}${d.date ? '  —  '+d.date : ''}`, 0.6, y);
    y += 0.2;
    const body = d.sceneIds.map((sid,i)=>{
      const s = scenes.find(x=>x.id===sid);
      return [i+1, s ? (s.text||'(untitled scene)') : '(scene removed)'];
    });
    pdf.autoTable({ startY:y, head:[['#','Scene']], body, styles:{fontSize:9}, margin:{left:0.6,right:0.6} });
    y = pdf.lastAutoTable.finalY + 0.3;
  });
  pdf.save('shooting-schedule.pdf');
}

async function exportDoodPDF(){
  const proj = currentProject();
  const scenes = scriptScenes();
  const days = state.projectData.shootDays;
  if(!days.length){
    await openAlertModal('No shoot days yet', 'Add shoot days and assign scenes to them in the Shooting Schedule before generating a Day Out of Days report.');
    return;
  }
  const charDays = {};
  days.forEach(day=>{
    day.sceneIds.forEach(sid=>{
      const scene = scenes.find(s=>s.id===sid);
      if(!scene) return;
      sceneCharacters(scene.id).forEach(ch=>{
        if(!charDays[ch]) charDays[ch] = new Set();
        charDays[ch].add(day.id);
      });
    });
  });
  const characters = Object.keys(charDays).sort();
  if(!characters.length){
    await openAlertModal('No characters found', "This report is built from character names in your script's dialogue. Make sure scheduled scenes have characters speaking, then try again.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'in', format:'letter', orientation: days.length > 5 ? 'landscape' : 'portrait'});
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Day Out of Days', 0.6, 0.7);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`${(proj&&proj.name)||'Untitled Project'} — Generated ${new Date().toLocaleDateString()}`, 0.6, 0.92);
  doc.autoTable({
    startY: 1.2,
    head: [['Character', ...days.map(d=>d.label)]],
    body: characters.map(ch=>[ch, ...days.map(d=>charDays[ch].has(d.id) ? 'W' : '—')]),
    styles:{fontSize:9, halign:'center'},
    columnStyles:{0:{halign:'left', fontStyle:'bold'}},
    margin:{left:0.6,right:0.6}
  });
  doc.setFontSize(8); doc.setFont('helvetica','italic');
  doc.text('W = Working. Reflects scenes currently assigned to shoot days in your Shooting Schedule.', 0.6, doc.lastAutoTable.finalY + 0.3);
  doc.save(((proj&&proj.name)||'production').replace(/[^\w\- ]/g,'')+'-dood.pdf');
}

/* =========================================================
   CAST & CREW (contacts directory)
========================================================= */
/* Standard film crew departments, consolidated for small-crew reality
   (G&E is one group here, as it usually is on an indie shoot). Existing
   contacts have no department field, so contactDepartment() infers one
   from the role text rather than dumping everyone into "Other". */
const CREW_DEPARTMENTS = [
  {key:'production', label:'Production'},
  {key:'camera',     label:'Camera'},
  {key:'lighting',   label:'Lighting & Grip'},
  {key:'sound',      label:'Sound'},
  {key:'art',        label:'Art'},
  {key:'wardrobe',   label:'Hair, Makeup & Wardrobe'},
  {key:'post',       label:'Post-Production'},
  {key:'other',      label:'Other'}
];
/* Role -> department guesses. Two rules keep this honest:
     1. A keyword must start on a word boundary, so "Editor" no longer
        matches "DIT" (the substring hides inside e-DIT-or).
     2. Longest match wins, so compound titles beat their fragments —
        "Art Director" resolves to Art, not Production, because
        'art director' is longer than 'director'.
   Compound entries below exist specifically to settle known collisions.
   This is only a starting guess; the Department dropdown always wins. */
const DEPT_KEYWORDS = [
  ['production', ['director','producer','assistant director','1st ad','2nd ad','a.d','script supervisor','scripty','coordinator','upm','production manager','production assistant','casting director','line producer','pa']],
  ['camera',     ['camera','camera operator','cinematographer','director of photography','dp','d.p','operator','steadicam operator','drone operator','ac','1st ac','2nd ac','focus puller','dit','loader','drone','steadicam']],
  ['lighting',   ['gaffer','grip','key grip','best boy','electric','electrician','lighting','rigger','dolly grip','swing']],
  ['sound',      ['sound','sound mixer','sound designer','production sound mixer','boom','boom op','boom operator','mixer','audio','sound utility']],
  ['art',        ['art','art director','production designer','production design','props','prop master','set dec','set decorator','set design','scenic','construction']],
  ['wardrobe',   ['wardrobe','costume','costume designer','makeup','make-up','hair','hair stylist','stylist','sfx makeup']],
  ['post',       ['editor','edit','assistant editor','colorist','color grade','composer','vfx','post','post supervisor','sound design','foley']]
];
/* Flattened once at load: [keyword, dept] sorted longest-first.
   Keywords of 3 characters or fewer also need a CLOSING boundary --
   without it "VFX Artist" matches 'art' and lands in the Art dept. */
const DEPT_MATCHERS = DEPT_KEYWORDS
  .flatMap(([dept, words]) => words.map(w => [w, dept]))
  .sort((a, b) => b[0].length - a[0].length)
  .map(([w, dept]) => {
    const safe = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return [new RegExp('\\b' + safe + (w.length <= 3 ? '\\b' : ''), 'i'), dept];
  });
function contactDepartment(c){
  if(c.department && CREW_DEPARTMENTS.some(d=>d.key===c.department)) return c.department;
  const role = (c.role||'').trim();
  if(role){
    for(const [re, dept] of DEPT_MATCHERS){
      if(re.test(role)) return dept;
    }
  }
  return 'other';
}
function emptyContact(){ return {id:uid(), name:'', kind:'Cast', role:'', email:'', phone:'', notes:'', department:''}; }
function renderContactsHome(main){
  const contacts = state.projectData.contacts;
  const allIds = contacts.map(c=>c.id);
  const allCollapsed = allIds.length > 0 && allIds.every(id=>state.collapsedContactIds.includes(id));

  // Cast is its own group regardless of department; crew groups by department.
  const groups = [];
  const cast = contacts.filter(c=>c.kind==='Cast');
  if(cast.length) groups.push({key:'cast', label:'Cast', people:cast});
  CREW_DEPARTMENTS.forEach(d=>{
    const people = contacts.filter(c=>c.kind!=='Cast' && contactDepartment(c)===d.key);
    if(people.length) groups.push({key:d.key, label:d.label, people});
  });

  const cardHtml = (c)=>{
    const collapsed = state.collapsedContactIds.includes(c.id);
    const isCast = c.kind==='Cast';
    const summary = [c.role, c.phone].filter(Boolean).join(' · ');
    return `
    <div class="paper contact-card ${collapsed?'contact-card-collapsed':''}" data-id="${c.id}">
      <div class="contact-head">
        <button class="shot-toggle" data-toggle="${c.id}" title="${collapsed?'Expand':'Collapse'}"><span class="chevron ${collapsed?'':'open'}">▸</span></button>
        <div class="contact-head-main">
          <input class="contact-name" data-f="name" value="${esc(c.name)}" placeholder="Name">
          ${collapsed && summary ? `<div class="contact-summary">${esc(summary)}</div>` : ''}
        </div>
        <button class="row-del" title="Remove person">✕</button>
      </div>
      ${collapsed ? '' : `
      <div class="contact-fields">
        <div class="cf"><label>Type</label>
          <select data-f="kind">
            <option ${c.kind==='Cast'?'selected':''}>Cast</option>
            <option ${c.kind==='Crew'?'selected':''}>Crew</option>
          </select>
        </div>
        ${isCast ? '' : `
        <div class="cf"><label>Department</label>
          <select data-f="department">
            ${CREW_DEPARTMENTS.map(d=>`<option value="${d.key}" ${contactDepartment(c)===d.key?'selected':''}>${d.label}</option>`).join('')}
          </select>
        </div>`}
        <div class="cf"><label>${isCast?'Character':'Role'}</label><input type="text" data-f="role" value="${esc(c.role)}" placeholder="${isCast?'e.g. Mia':'e.g. Gaffer'}"></div>
        <div class="cf"><label>Phone</label><input type="tel" data-f="phone" value="${esc(c.phone)}"></div>
        <div class="cf"><label>Email</label><input type="email" data-f="email" value="${esc(c.email)}"></div>
        <div class="cf cf-wide"><label>Notes</label><input type="text" data-f="notes" value="${esc(c.notes)}"></div>
      </div>`}
    </div>`;
  };

  main.innerHTML = `
    <div class="view-head">
      <div class="eyebrow">Production Department</div>
      <h2>Cast &amp; Crew</h2>
      <p>A reusable directory for this project — save people once, then pull them straight into your call sheets.</p>
    </div>
    <div class="toolbar">
      <button class="fab-add" id="addContact" title="Add Person" aria-label="Add Person">+</button>
      <button class="btn btn-chalk btn-sm" id="exportCrewListBtn">Export Crew List PDF</button>
      <button class="btn btn-outline btn-sm" id="collapseAllContacts" ${allIds.length===0?'disabled':''}>${allCollapsed?'Expand All':'Collapse All'}</button>
      <button class="btn btn-outline btn-sm" id="learnBtn">? How this works</button>
    </div>
    ${groups.length ? groups.map(g=>`
      <div class="contact-group">
        <div class="contact-group-head">
          <span class="contact-group-label">${esc(g.label)}</span>
          <span class="contact-group-count">${g.people.length}</span>
        </div>
        ${g.people.map(cardHtml).join('')}
      </div>
    `).join('') : '<div class="empty"><b>No cast or crew saved yet</b>Add people here once, then pull them into any call sheet.</div>'}
  `;

  document.getElementById('learnBtn').onclick = ()=>goLearn('contacts');
  document.getElementById('exportCrewListBtn').onclick = exportCrewListPDF;
  document.getElementById('addContact').onclick = ()=>{
    contacts.unshift(emptyContact());
    saveProjectData();
    renderContactsHome(main);
  };
  document.getElementById('collapseAllContacts').onclick = ()=>{
    if(allCollapsed){
      state.collapsedContactIds = state.collapsedContactIds.filter(id=>!allIds.includes(id));
    } else {
      allIds.forEach(id=>{ if(!state.collapsedContactIds.includes(id)) state.collapsedContactIds.push(id); });
    }
    renderContactsHome(main);
  };
  main.querySelectorAll('.shot-toggle[data-toggle]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggle;
      const i = state.collapsedContactIds.indexOf(id);
      if(i === -1) state.collapsedContactIds.push(id); else state.collapsedContactIds.splice(i,1);
      renderContactsHome(main);
    };
  });
  main.querySelectorAll('.contact-card').forEach(card=>{
    const c = contacts.find(x=>x.id===card.dataset.id);
    card.querySelectorAll('[data-f]').forEach(el=>{
      const field = el.dataset.f;
      const evt = el.tagName==='SELECT' ? 'change' : 'input';
      el.addEventListener(evt, ()=>{
        c[field] = el.value;
        saveProjectData();
        // Type and department change which group a person belongs to,
        // so the list has to regroup. Text fields must not re-render,
        // or the input loses focus mid-typing.
        if(field === 'kind' || field === 'department') renderContactsHome(main);
      });
    });
    card.querySelector('.row-del').onclick = ()=>{
      moveToTrash('contact', 'contacts', c, c.name || '(unnamed)');
      state.projectData.contacts = contacts.filter(x=>x.id!==c.id);
      saveProjectData();
      renderContactsHome(main);
    };
  });
}

/* =========================================================
   PRODUCTION BIBLE — compiles the whole project into one
   document, exportable as PDF, Word-compatible file, or plain text.
========================================================= */
function compileProductionBible(){
  const proj = currentProject();
  const pd = state.projectData;
  const scenes = scriptScenes();
  const sections = [];
  const cs = currentScript();
  if(cs && cs.titlePage && cs.titlePage.title){
    sections.push({ kind:'titlepage', title:'Title Page', data: cs.titlePage });
  }
  sections.push({ kind:'overview', title:'Project Overview', data:{
    name: proj.name,
    type: (PROJECT_TYPES[proj.type]||{}).label || proj.type,
    subtype: proj.subtype ? (PROJECT_SUBTYPES[proj.subtype]||{}).label : null,
    role: (PROJECT_ROLES[proj.role]||{}).label || proj.role,
    generated: new Date().toLocaleDateString()
  }});
  if(cs.blocks.some(b=>b.text && b.text.trim())){
    sections.push({ kind:'script', title:'Script'+(pd.scripts.length>1?' — '+cs.name:''), data: cs.blocks });
  }
  if(pd.contacts.length){ sections.push({ kind:'contacts', title:'Cast & Crew', data: pd.contacts }); }
  if(pd.locations.length){ sections.push({ kind:'locations', title:'Locations', data: pd.locations }); }
  if(pd.shotlists.length){ sections.push({ kind:'shotlists', title:'Shot Lists', data: pd.shotlists }); }
  if(pd.shootDays.length){ sections.push({ kind:'schedule', title:'Shooting Schedule', data: pd.shootDays, scenes }); }
  if(pd.budgets.length){ sections.push({ kind:'budget', title:'Budget', data: pd.budgets }); }
  if(pd.continuity.length){ sections.push({ kind:'continuity', title:'Continuity Notes', data: pd.continuity }); }
  if(pd.directorNotes.length){ sections.push({ kind:'directornotes', title:"Director's Notes", data: pd.directorNotes, scenes }); }
  return { proj, sections };
}

function exportBibleAsPDF(){
  const { proj, sections } = compileProductionBible();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'in', format:'letter'});
  let firstPage = true;
  sections.forEach(sec=>{
    if(sec.kind === 'titlepage'){
      drawTitlePagePDF(doc, sec.data, true);
      firstPage = false;
      return;
    }
    if(!firstPage) doc.addPage();
    firstPage = false;
    let y = 0.8;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(sec.title, 0.6, y);
    y += 0.35;
    if(sec.kind === 'overview'){
      doc.setFont('helvetica','normal'); doc.setFontSize(11);
      const o = sec.data;
      [`Project: ${o.name}`, `Type: ${o.type}${o.subtype ? ' — '+o.subtype : ''}`, `Prepared by: ${o.role}`, `Generated: ${o.generated}`]
        .forEach(l=>{ doc.text(l, 0.6, y); y += 0.25; });
    } else if(sec.kind === 'script'){
      drawScreenplayBlocks(doc, sec.data, y);
    } else if(sec.kind === 'contacts'){
      const crew = sec.data.filter(c=>c.kind==='Crew').sort((a,b)=>(a.role||'').localeCompare(b.role||''));
      const cast = sec.data.filter(c=>c.kind==='Cast').sort((a,b)=>(a.role||'').localeCompare(b.role||''));
      if(crew.length){
        doc.autoTable({ startY:y, head:[['Position','Name','Email','Phone']], body: crew.map(c=>[c.role||'—',c.name||'—',c.email||'—',c.phone||'—']), styles:{fontSize:9}, margin:{left:0.6,right:0.6} });
        y = doc.lastAutoTable.finalY + 0.3;
      }
      if(cast.length){
        if(y > 9){ doc.addPage(); y = 0.8; }
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Cast', 0.6, y); y += 0.2;
        doc.autoTable({ startY:y, head:[['Character','Name','Email','Phone']], body: cast.map(c=>[c.role||'—',c.name||'—',c.email||'—',c.phone||'—']), styles:{fontSize:9}, margin:{left:0.6,right:0.6} });
      }
    } else if(sec.kind === 'locations'){
      doc.autoTable({ startY:y, head:[['Name','Address','Contact','Phone','Notes']], body: sec.data.map(l=>[l.name||'—', l.address||'—', l.contactName||'—', l.contactPhone||'—', l.notes||'—']), styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
    } else if(sec.kind === 'shotlists'){
      sec.data.forEach(sl=>{
        if(y > 9){ doc.addPage(); y = 0.8; }
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(sl.name, 0.6, y); y += 0.2;
        doc.autoTable({ startY:y, head:[['Scene','Shot #','Type','Description','Movement','Lens']], body: sl.shots.map(s=>[s.scene||'—', s.shotNum||'—', s.type||'—', s.desc||'—', s.movement||'—', s.lens||'—']), styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
        y = doc.lastAutoTable.finalY + 0.35;
      });
    } else if(sec.kind === 'schedule'){
      doc.autoTable({ startY:y, head:[['Day','Date','Scenes']], body: sec.data.map(d=>{
        const sceneNames = d.sceneIds.map(id=>{ const s = sec.scenes.find(x=>x.id===id); return s ? (s.text||'(untitled)') : ''; }).filter(Boolean).join('; ');
        return [d.label, d.date||'—', sceneNames||'—'];
      }), styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
    } else if(sec.kind === 'budget'){
      sec.data.forEach(b=>{
        if(y > 9){ doc.addPage(); y = 0.8; }
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(b.name, 0.6, y); y += 0.2;
        const rows = [];
        b.categories.forEach(cat=>{ cat.items.forEach(it=>{ rows.push([cat.name, it.label||'(untitled)', '$'+(parseFloat(it.amount)||0).toFixed(2)]); }); });
        doc.autoTable({ startY:y, head:[['Category','Item','Amount']], body: rows, styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
        y = doc.lastAutoTable.finalY + 0.35;
      });
    } else if(sec.kind === 'continuity'){
      doc.autoTable({ startY:y, head:[['Category','Subject','Description']], body: sec.data.map(c=>[c.category==='wardrobe'?'Wardrobe':'Set', c.subject||'—', c.description||'—']), styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
    } else if(sec.kind === 'directornotes'){
      doc.autoTable({ startY:y, head:[['Type','Scene','Note']], body: sec.data.map(n=>{
        const s = sec.scenes.find(x=>x.id===n.sceneId);

      }), styles:{fontSize:8}, margin:{left:0.6,right:0.6} });
    }
  });
  doc.save(((proj&&proj.name)||'production-bible').replace(/[^\w\- ]/g,'')+'-bible.pdf');
}

function bibleSectionToHTML(sec){
  const esc2 = (s)=>esc(String(s==null?'':s));
  if(sec.kind === 'overview'){
    const o = sec.data;
    return `<p>Project: ${esc2(o.name)}<br>Type: ${esc2(o.type)}${o.subtype?' — '+esc2(o.subtype):''}<br>Prepared by: ${esc2(o.role)}<br>Generated: ${esc2(o.generated)}</p>`;
  }
  if(sec.kind === 'script'){
    return sec.data.filter(b=>b.text && b.text.trim()).map(b=>{
      const align = b.type==='character'||b.type==='transition' ? 'center' : (b.type==='dialogue'||b.type==='parenthetical' ? 'left;margin-left:80px' : 'left');
      const upper = (b.type==='scene'||b.type==='character'||b.type==='transition') ? esc2(b.text).toUpperCase() : esc2(b.text);
      return `<p style="text-align:${align};font-family:'Courier New',monospace;">${upper}</p>`;
    }).join('');
  }
  if(sec.kind === 'contacts'){

    return (crew.length?table(crew,'Position'):'') + (cast.length?'<p><b>Cast</b></p>'+table(cast,'Character'):'');

  if(sec.kind === 'locations'){
    return `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Name</th><th>Address</th><th>Contact</th><th>Phone</th><th>Notes</th></tr>${sec.data.map(l=>`<tr><td>${esc2(l.name)}</td><td>${esc2(l.address)}</td><td>${esc2(l.contactName)}</td><td>${esc2(l.contactPhone)}</td><td>${esc2(l.notes)}</td></tr>`).join('')}</table>`;
  }
  if(sec.kind === 'shotlists'){
    return sec.data.map(sl=>`<p><b>${esc2(sl.name)}</b></p><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Scene</th><th>Shot #</th><th>Type</th><th>Description</th><th>Movement</th><th>Lens</th></tr>${sl.shots.map(s=>`<tr><td>${esc2(s.scene)}</td><td>${esc2(s.shotNum)}</td><td>${esc2(s.type)}</td><td>${esc2(s.desc)}</td><td>${esc2(s.movement)}</td><td>${esc2(s.lens)}</td></tr>`).join('')}</table>`).join('');
  }
  if(sec.kind === 'schedule'){
    return `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Day</th><th>Date</th><th>Scenes</th></tr>${sec.data.map(d=>{
      const sceneNames = d.sceneIds.map(id=>{ const s = sec.scenes.find(x=>x.id===id); return s ? (s.text||'(untitled)') : ''; }).filter(Boolean).join('; ');
      return `<tr><td>${esc2(d.label)}</td><td>${esc2(d.date)}</td><td>${esc2(sceneNames)}</td></tr>`;
    }).join('')}</table>`;
  }
  if(sec.kind === 'budget'){
    return sec.data.map(b=>{
      const rows = [];
      b.categories.forEach(cat=>{ cat.items.forEach(it=>{ rows.push(`<tr><td>${esc2(cat.name)}</td><td>${esc2(it.label||'(untitled)')}</td><td>$${(parseFloat(it.amount)||0).toFixed(2)}</td></tr>`); }); });
      return `<p><b>${esc2(b.name)}</b></p><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Category</th><th>Item</th><th>Amount</th></tr>${rows.join('')}</table>`;
    }).join('');
  }
  if(sec.kind === 'continuity'){
    return `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Category</th><th>Subject</th><th>Description</th></tr>${sec.data.map(c=>`<tr><td>${c.category==='wardrobe'?'Wardrobe':'Set'}</td><td>${esc2(c.subject)}</td><td>${esc2(c.description)}</td></tr>`).join('')}</table>`;
  }
  if(sec.kind === 'directornotes'){
    return `<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;"><tr><th>Type</th><th>Scene</th><th>Note</th></tr>${sec.data.map(n=>{
      const s = sec.scenes.find(x=>x.id===n.sceneId);
      return `<tr><td>${esc2((DIRECTOR_NOTE_KINDS[n.kind]||{}).label||n.kind)}</td><td>${esc2(s?s.text:'')}</td><td>${esc2(n.text)}</td></tr>`;
    }).join('')}</table>`;
  }
  return '';
}
function exportBibleAsWord(){
  const { proj, sections } = compileProductionBible();
  const body = sections.map(sec=>`<h1>${esc(sec.title)}</h1>${bibleSectionToHTML(sec)}`).join('<br clear="all" style="page-break-before:always;">');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset="utf-8"><title>${esc((proj&&proj.name)||'Production Bible')}</title></head>
    <body style="font-family:Calibri,Arial,sans-serif;">${body}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ((proj&&proj.name)||'production-bible').replace(/[^\w\- ]/g,'') + '-bible.doc';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function bibleSectionToText(sec){
  const scenesLookup = sec.scenes;
  if(sec.kind === 'overview'){
    const o = sec.data;
    return `Project: ${o.name}\nType: ${o.type}${o.subtype?' — '+o.subtype:''}\nPrepared by: ${o.role}\nGenerated: ${o.generated}`;
  }
  if(sec.kind === 'script'){
    return sec.data.filter(b=>b.text && b.text.trim()).map(b=>{
      const upper = (b.type==='scene'||b.type==='character'||b.type==='transition') ? b.text.toUpperCase() : b.text;
      const indent = (b.type==='dialogue'||b.type==='parenthetical') ? '        ' : (b.type==='character'||b.type==='transition' ? '    ' : '');
      return indent + upper;
    }).join('\n\n');
  }
  if(sec.kind === 'contacts'){
    const crew = sec.data.filter(c=>c.kind==='Crew');
    const cast = sec.data.filter(c=>c.kind==='Cast');
    let out = 'CREW\n' + crew.map(c=>`  ${c.role||'—'} — ${c.name||'—'} — ${c.email||'—'} — ${c.phone||'—'}`).join('\n');
    if(cast.length) out += '\n\nCAST\n' + cast.map(c=>`  ${c.role||'—'} — ${c.name||'—'} — ${c.email||'—'} — ${c.phone||'—'}`).join('\n');
    return out;
  }
  if(sec.kind === 'locations'){
    return sec.data.map(l=>`${l.name||'—'}\n  ${l.address||'—'}\n  Contact: ${l.contactName||'—'} — ${l.contactPhone||'—'}\n  ${l.notes||''}`).join('\n\n');
  }
  if(sec.kind === 'shotlists'){
    return sec.data.map(sl=>`${sl.name}\n` + sl.shots.map(s=>`  Scene ${s.scene||'—'} / Shot ${s.shotNum||'—'} — ${s.type||''} — ${s.desc||''} — ${s.movement||''} — ${s.lens||''}`).join('\n')).join('\n\n');
  }
  if(sec.kind === 'schedule'){
    return sec.data.map(d=>{
      const sceneNames = d.sceneIds.map(id=>{ const s = scenesLookup.find(x=>x.id===id); return s ? (s.text||'(untitled)') : ''; }).filter(Boolean).join('; ');
      return `${d.label} — ${d.date||'no date'}\n  ${sceneNames||'No scenes assigned'}`;
    }).join('\n\n');
  }
  if(sec.kind === 'budget'){
    return sec.data.map(b=>{
      const rows = [];
      b.categories.forEach(cat=>{ cat.items.forEach(it=>{ rows.push(`  ${cat.name} — ${it.label||'(untitled)'} — $${(parseFloat(it.amount)||0).toFixed(2)}`); }); });
      return `${b.name}\n${rows.join('\n')}`;
    }).join('\n\n');
  }
  if(sec.kind === 'continuity'){
    return sec.data.map(c=>`[${c.category==='wardrobe'?'Wardrobe':'Set'}] ${c.subject||'—'} — ${c.description||''}`).join('\n');
  }
  if(sec.kind === 'directornotes'){
    return sec.data.map(n=>{
      const s = scenesLookup.find(x=>x.id===n.sceneId);
      return `[${(DIRECTOR_NOTE_KINDS[n.kind]||{}).label||n.kind}]${s?' '+(s.text||''):''}\n  ${n.text||''}`;
    }).join('\n\n');
  }
  if(sec.kind === 'titlepage'){
    const tp = sec.data;
    return `${(tp.title||'').toUpperCase()}\n${tp.writtenBy?'Written by '+tp.writtenBy+'\n':''}${tp.basedOn?'Based on '+tp.basedOn+'\n':''}`;
  }
  return '';
}
function exportBibleAsText(){
  const { proj, sections } = compileProductionBible();
  const divider = '\n\n' + '='.repeat(60) + '\n';
  const text = sections.map(sec=>`${sec.title.toUpperCase()}\n${'-'.repeat(sec.title.length)}\n\n${bibleSectionToText(sec)}`).join(divider);
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = ((proj&&proj.name)||'production-bible').replace(/[^\w\- ]/g,'') + '-bible.txt';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportDocPDF(doc_){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text(doc_.name, 1, 1);
  pdf.setFont('courier','normal'); pdf.setFontSize(10);
  const lines = pdf.splitTextToSize(doc_.body || '', 6.5);
  let y = 1.4;
  lines.forEach(line=>{
    if(y > 10){ pdf.addPage(); y = 1; }
    pdf.text(line, 1, y);
    y += 0.19;
  });
  pdf.save(doc_.name.replace(/[^\w\- ]/g,'') + '.pdf');
}

        <div class="row"><span>Subtotal</span><span id="grand-sub">$${overallSubtotal(b).toFixed(2)}</span></div>
        <div class="row"><span>Contingency (<input type="number" class="contingency-input" id="contPct" value="${b.contingencyPct}">%)</span><span id="grand-cont">$${(overallSubtotal(b)*b.contingencyPct/100).toFixed(2)}</span></div>
        <div class="row grand"><span>Total</span><span id="grand-total">$${(overallSubtotal(b)*(1+b.contingencyPct/100)).toFixed(2)}</span></div>
      </div>
    `;
    wireBudgetEvents(b);
  }

  function recalcTotals(b){
    b.categories.forEach(cat=>{
      const el = document.getElementById('sub-'+cat.id);
      if(el) el.textContent = '$'+catSubtotal(cat).toFixed(2);
    });
    BUDGET_GROUPS.forEach(g=>{
      const el = document.getElementById('gsub-'+g.key);
      if(el) el.textContent = '$'+groupSubtotal(b, g.key).toFixed(2);
    });
    const sub = overallSubtotal(b);
    const cont = sub * (parseFloat(b.contingencyPct)||0) / 100;
    document.getElementById('grand-sub').textContent = '$'+sub.toFixed(2);
    document.getElementById('grand-cont').textContent = '$'+cont.toFixed(2);
    document.getElementById('grand-total').textContent = '$'+(sub+cont).toFixed(2);
    renderBudgetChart(b);
  }

  function wireBudgetEvents(b){
    const paper = document.getElementById('budgetPaper');
    paper.querySelectorAll('.budget-cat').forEach(catEl=>{
      const cat = b.categories.find(c=>c.id===catEl.dataset.cat);
      catEl.querySelector('[data-catname]').onblur = (e)=>{ cat.name = e.target.textContent.trim() || cat.name; saveProjectData(); };
      catEl.querySelector('[data-catgroup]').onchange = (e)=>{
        cat.group = e.target.value;
        saveProjectData();
        renderBudgetBody(b);
      };
      catEl.querySelector('[data-delcat]').onclick = async ()=>{
        const ok = await openConfirmModal('Delete category?', 'Delete category "'+cat.name+'" and all its line items?', 'Delete');
        if(ok){
          b.categories = b.categories.filter(c=>c.id!==cat.id);
          saveProjectData();
          renderBudgetBody(b);
        }
      };
      catEl.querySelector('[data-additem]').onclick = ()=>{
        cat.items.push({id:uid(), label:'', amount:0});
        saveProjectData();
        renderBudgetBody(b);
      };
      catEl.querySelectorAll('tr[data-item]').forEach(tr=>{
        const item = cat.items.find(i=>i.id===tr.dataset.item);
        tr.querySelector('[data-lbl]').addEventListener('input', (e)=>{ item.label = e.target.value; debouncedSaveProject(); });
        tr.querySelector('[data-amt]').addEventListener('input', (e)=>{
          item.amount = parseFloat(e.target.value) || 0;
          recalcTotals(b);
          debouncedSaveProject();
        });
        tr.querySelector('[data-delitem]').onclick = ()=>{
          cat.items = cat.items.filter(i=>i.id!==item.id);
          saveProjectData();
          renderBudgetBody(b);
        };
      });
    });
    document.getElementById('addCat').onclick = async ()=>{
      const name = await openPromptModal('New category', 'Category name', 'New Category');
      if(!name) return;
      b.categories.push({id:uid(), name, group:'below', items:[{id:uid(), label:'', amount:0}]});
      saveProjectData();
      renderBudgetBody(b);
    };
    document.getElementById('contPct').addEventListener('input', (e)=>{
      b.contingencyPct = parseFloat(e.target.value) || 0;
      recalcTotals(b);
      debouncedSaveProject();
    });
  }
}

function renderBudgetChart(b){
  const el = document.getElementById('budgetChartBody');
  const wrap = document.getElementById('budgetChartPaper');
  if(!el || !wrap) return;
  const cats = b.categories.filter(c=>catSubtotal(c) > 0);
  if(!cats.length){ wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const total = cats.reduce((s,c)=>s+catSubtotal(c),0);
  const palette = ['#E8A83C','#C4501F','#3A5A78','#4E9E8C','#8B5FBF','#C46FA0','#8B5E34','#726C60','#D64545','#E8B93E'];
  const cx=90, cy=90, r=80;
  let svgInner = '';
  if(cats.length === 1){
    svgInner = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${palette[0]}"></circle>`;
  } else {
    let angleStart = -90;
    svgInner = cats.map((c,i)=>{
      const value = catSubtotal(c);
      const angleSpan = (value/total)*360;
      const angleEnd = angleStart + angleSpan;
      const x1 = cx + r*Math.cos(angleStart*Math.PI/180), y1 = cy + r*Math.sin(angleStart*Math.PI/180);
      const x2 = cx + r*Math.cos(angleEnd*Math.PI/180), y2 = cy + r*Math.sin(angleEnd*Math.PI/180);
      const largeArc = angleSpan > 180 ? 1 : 0;
      const path = `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${palette[i % palette.length]}"></path>`;
      angleStart = angleEnd;
      return path;
    }).join('');
  }
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
      <svg viewBox="0 0 180 180" width="150" height="150" style="flex-shrink:0;">${svgInner}</svg>
      <div style="flex:1;min-width:160px;display:flex;flex-direction:column;gap:7px;">
        ${cats.map((c,i)=>{
          const value = catSubtotal(c);
          return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;">
            <span style="width:11px;height:11px;border-radius:3px;background:${palette[i % palette.length]};flex-shrink:0;"></span>
            <span style="flex:1;color:var(--ink);">${esc(c.name)}</span>
            <span style="color:var(--ink-mute);">$${value.toFixed(0)} · ${((value/total)*100).toFixed(0)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

async function importBudgetFromBreakdown(b, main){
  const breakdown = state.projectData.breakdown;
  const byCategory = {};
  Object.values(breakdown).forEach(entries=>{
    (entries||[]).forEach(e=>{
      if(!e.text || !e.text.trim()) return;
      if(!byCategory[e.category]) byCategory[e.category] = new Set();
      byCategory[e.category].add(e.text.trim());
    });
  });
  const catKeys = Object.keys(byCategory);
  if(!catKeys.length){
    await openAlertModal('Nothing to import', 'No elements have been tagged in Script Breakdown yet. Tag cast, props, wardrobe, and other elements there first.');
    return;
  }
  let addedCount = 0;
  catKeys.forEach(key=>{
    const catInfo = breakdownCategory(key);
    let budgetCat = b.categories.find(c=>c.name.toLowerCase() === catInfo.label.toLowerCase());
    if(!budgetCat){
      budgetCat = {id:uid(), name:catInfo.label, group:'below', items:[]};
      b.categories.push(budgetCat);
    }
    byCategory[key].forEach(text=>{
      const exists = budgetCat.items.some(it=>it.label.toLowerCase() === text.toLowerCase());
      if(!exists){
        budgetCat.items.push({id:uid(), label:text, amount:0});
        addedCount++;
      }
    });
  });
  saveProjectData();
  renderBudgetDetail(main);
  await openAlertModal('Imported from Breakdown', addedCount > 0 ? `Added ${addedCount} new line item${addedCount!==1?'s':''} from your tagged breakdown elements, grouped by category. Amounts start at $0 — fill them in as you get quotes.` : 'Everything from your breakdown is already in this budget — no new line items to add.');
}

function exportBudgetPDF(b){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'in', format:'letter'});
  pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text(b.name, 0.6, 0.7);
  const proj = currentProject();
  pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
  pdf.text(`${(proj && proj.name) || 'Untitled Project'}  —  ${new Date().toLocaleDateString()}`, 0.6, 0.95);
  let y = 1.2;
  BUDGET_GROUPS.forEach(g=>{
    const cats = b.categories.filter(c=>categoryGroup(c)===g.key);
    if(!cats.length) return;
    if(y > 9.3){ pdf.addPage(); y = 1; }
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11);
    pdf.setFillColor(28,26,23); pdf.rect(0.6, y-0.16, 7.3, 0.28, 'F');
    pdf.setTextColor(255,255,255);
    pdf.text(g.label.toUpperCase(), 0.7, y+0.04);
    pdf.text('$'+groupSubtotal(b, g.key).toFixed(2), 7.8, y+0.04, {align:'right'});
    pdf.setTextColor(0,0,0);
    y += 0.32;
    cats.forEach(cat=>{
      pdf.autoTable({
        startY: y,
        head: [[cat.name, 'Amount']],
        body: cat.items.map(it=>[it.label || '(untitled)', '$'+(parseFloat(it.amount)||0).toFixed(2)]),
        styles:{fontSize:9}, margin:{left:0.6,right:0.6},
        columnStyles:{1:{halign:'right'}},
        foot: [['Subtotal', '$'+catSubtotal(cat).toFixed(2)]],
        footStyles: {fontStyle:'bold', halign:'left'}
      });
      y = pdf.lastAutoTable.finalY + 0.2;
    });
    y += 0.1;
  });
  const sub = overallSubtotal(b);
  const cont = sub * (b.contingencyPct||0) / 100;
  const total = sub + cont;
  pdf.setFontSize(11); pdf.setFont('helvetica','bold');
  if(y > 9.5){ pdf.addPage(); y = 1; }
  pdf.text(`Subtotal: $${sub.toFixed(2)}`, 0.6, y); y += 0.24;
  pdf.text(`Contingency (${b.contingencyPct||0}%): $${cont.toFixed(2)}`, 0.6, y); y += 0.24;
  pdf.setFontSize(13);
  pdf.text(`Total: $${total.toFixed(2)}`, 0.6, y);
  pdf.save(b.name.replace(/[^\w\- ]/g,'') + '.pdf');
}

/* =========================================================
   RECYCLE BIN
========================================================= */
function renderTrashHome(main){
  const trash = (state.projectData.trash || []).slice().sort((a,b)=>b.deletedAt-a.deletedAt);
  main.innerHTML = `
    <div class="view-head">
      <div class="eyebrow">General</div>
      <h2>Recycle Bin</h2>
      <p>Deleted shot lists, call sheets, docs, and other top-level items land here for ${TRASH_RETENTION_DAYS} days before being permanently removed — plenty of time to restore something you didn't mean to delete.</p>
    </div>
    ${trash.length ? `<div class="toolbar"><button class="btn btn-outline btn-sm" id="learnBtn">? How this works</button><button class="rail-delete-btn" id="emptyTrash" style="width:auto;padding:8px 14px;border:1px solid #e3c8c8;border-radius:var(--radius-btn);">Empty Recycle Bin</button></div>` : `<div class="toolbar"><button class="btn btn-outline btn-sm" id="learnBtn">? How this works</button></div>`}
    <div class="card-list">
      ${trash.length ? trash.map(t=>{
        const daysLeft = Math.max(0, TRASH_RETENTION_DAYS - Math.floor((Date.now()-t.deletedAt)/86400000));
        const countdown = daysLeft <= 0 ? 'Auto-deletes today' : daysLeft === 1 ? 'Auto-deletes tomorrow' : `Auto-deletes in ${daysLeft} days`;
        return `<div class="paper" data-id="${t.id}" style="cursor:default;">
          <div>
            <div class="card-title">${esc(t.label)} <span class="stamp-icon" style="margin-left:6px;">${esc(TRASH_KIND_LABELS[t.kind]||t.kind)}</span></div>
            <div class="card-sub">Deleted ${new Date(t.deletedAt).toLocaleDateString()} · ${countdown}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" data-restore="${t.id}">Restore</button>
            <button class="btn btn-danger btn-sm" data-purge="${t.id}">Delete Forever</button>
          </div>
        </div>`;
      }).join('') : `<div class="empty empty-plain"><b>Recycle Bin is empty</b>Anything you delete from a tool's list view shows up here first.</div>`}
    </div>
  `;
  const learnBtn = document.getElementById('learnBtn');
  if(learnBtn) learnBtn.onclick = ()=>goLearn('trash');
  main.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.onclick = ()=>{
      const entry = trash.find(t=>t.id===btn.dataset.restore);
      if(!entry) return;
      if(entry.kind === 'note'){
        state.projectData.notes.unshift(entry.data);
      } else {
        state.projectData[entry.arrayKey].push(entry.data);
      }
      state.projectData.trash = state.projectData.trash.filter(t=>t.id!==entry.id);
      saveProjectData();
      renderTrashHome(main);
    };
  });
  main.querySelectorAll('[data-purge]').forEach(btn=>{
    btn.onclick = async ()=>{
      const ok = await openConfirmModal('Delete forever?', 'This permanently removes it. There is no way to get it back after this.', 'Delete Forever');
      if(ok){
        state.projectData.trash = state.projectData.trash.filter(t=>t.id!==btn.dataset.purge);
        saveProjectData();
        renderTrashHome(main);
      }
    };
  });
  const emptyBtn = document.getElementById('emptyTrash');
  if(emptyBtn) emptyBtn.onclick = async ()=>{
    const ok = await openConfirmModal('Empty Recycle Bin?', `This permanently deletes all ${trash.length} item(s). There is no way to get them back after this.`, 'Empty It');
    if(ok){
      state.projectData.trash = [];
      saveProjectData();
      renderTrashHome(main);
    }
  };
}
