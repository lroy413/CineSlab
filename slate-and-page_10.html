function buildLightingSVG(setup, opts){
  const o = opts || {};
  const W = o.size || 300, H = o.size || 300;
  const interactive = !!o.interactive;
  const px = (n)=> +(n * W).toFixed(1);
  const py = (n)=> +(n * H).toFixed(1);
  const subjR = LIGHT_CANVAS.subjR * W;
  normalizeLightingSetup(setup);
  const subjects = setup.subjects || [];
  const cameras  = setup.cameras || [];
  let inner = '';

  // Throw lines first so they sit behind everything else. Each fixture
  // points at the nearest subject, which is what actually communicates
  // intent once there is more than one person in the scene.
  setup.fixtures.forEach(f=>{
    if(!subjects.length) return;
    let nearest = subjects[0], best = Infinity;
    subjects.forEach(sub=>{
      const d = (sub.x-f.x)**2 + (sub.y-f.y)**2;
      if(d < best){ best = d; nearest = sub; }
    });
    const color = LIGHT_ROLE_COLOR[f.role] || '#726C60';
    inner += `<line data-fx="${f.id}" x1="${px(f.x)}" y1="${py(f.y)}" x2="${px(nearest.x)}" y2="${py(nearest.y)}" stroke="${color}" stroke-width="1" stroke-dasharray="2,2" opacity="0.45"/>`;
  });

  subjects.forEach(sub=>{
    inner += `<g class="ld-node ld-subject" data-kind="subject" data-id="${sub.id}" style="${interactive?'cursor:grab;':''}">
      ${interactive?`<circle cx="${px(sub.x)}" cy="${py(sub.y)}" r="${Math.max(subjR,24)}" fill="transparent"/>`:''}
      <circle cx="${px(sub.x)}" cy="${py(sub.y)}" r="${subjR}" fill="#EFEADB" stroke="#726C60" stroke-width="1.5"/>
      <text x="${px(sub.x)}" y="${py(sub.y)+4}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="9" fill="#726C60">${esc((sub.label||'S').slice(0,4).toUpperCase())}</text>
    </g>`;
  });

  cameras.forEach(cam=>{
    inner += `<g class="ld-node ld-camera" data-kind="camera" data-id="${cam.id}" style="${interactive?'cursor:grab;':''}">
      ${interactive?`<circle cx="${px(cam.x)}" cy="${py(cam.y)}" r="24" fill="transparent"/>`:''}
      <rect x="${px(cam.x)-11}" y="${py(cam.y)-8}" width="22" height="16" rx="2.5" fill="#1C1B19" stroke="#EFEADB" stroke-width="1"/>
      <text x="${px(cam.x)}" y="${py(cam.y)+26}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="9" fill="#8A8378">${esc((cam.label||'CAM').toUpperCase())}</text>
    </g>`;
  });

  // The sun, when this setup is tied to a scheduled exterior scene.
  if(o.sun && o.sun.altitude > 0){
    const ang = ((o.sun.azimuth - (setup.northOffset || 0)) % 360) * Math.PI/180;
    const sx = 0.5 + 0.44 * Math.sin(ang), sy = 0.5 - 0.44 * Math.cos(ang);
    if(subjects.length){
      inner += `<line x1="${px(sx)}" y1="${py(sy)}" x2="${px(subjects[0].x)}" y2="${py(subjects[0].y)}" stroke="#E8B93E" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.55"/>`;
    }
    inner += `<g class="ld-sun">
      <circle cx="${px(sx)}" cy="${py(sy)}" r="11" fill="#E8B93E" opacity="0.22"/>
      <circle cx="${px(sx)}" cy="${py(sy)}" r="7" fill="#E8B93E"/>
      <text x="${px(sx)}" y="${py(sy)+22}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="8.5" fill="#E8B93E">${Math.round(o.sun.altitude)}&#176;</text>
    </g>`;
  }
  // North marker, so the plan can be read against the real world.
  if(o.sun){
    const nAng = (-(setup.northOffset || 0)) * Math.PI/180;
    const nx2 = 0.5 + 0.47 * Math.sin(nAng), ny2 = 0.5 - 0.47 * Math.cos(nAng);
    inner += `<text x="${px(nx2)}" y="${py(ny2)}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="10" fill="#8A8378" opacity="0.8">N</text>`;
  }

  setup.fixtures.forEach(f=>{
    const color = LIGHT_ROLE_COLOR[f.role] || '#726C60';
    inner += `<g class="ld-node ld-fixture" data-kind="fixture" data-id="${f.id}" style="${interactive?'cursor:grab;':''}">
      ${interactive?`<circle cx="${px(f.x)}" cy="${py(f.y)}" r="24" fill="transparent"/>`:''}
      <circle cx="${px(f.x)}" cy="${py(f.y)}" r="10" fill="${color}" stroke="#fff" stroke-width="2"/>
      <text x="${px(f.x)}" y="${py(f.y)+23}" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#8A8378">${esc(f.role)}</text>
    </g>`;
  });

  return `<svg class="light-diagram" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="touch-action:none;">${inner}</svg>`;
}

/* Drag any node on the diagram. Two things matter here:
   the SVG must NOT be rebuilt during the gesture — replacing innerHTML
   destroys the very element holding pointer capture, which ends the drag
   after the first movement — so the node is moved visually with a
   transform and the real redraw happens once, on release. */
function wireLightingDrag(wrap, setup, onCommit){
  const svg = wrap.querySelector('svg.light-diagram');
  if(!svg) return;
  const vb = (svg.getAttribute('viewBox') || '0 0 300 300').split(/\s+/).map(Number);
  const W = vb[2] || 300, H = vb[3] || 300;
  let active = null;
  const collectionFor = (kind)=>
    kind === 'subject' ? setup.subjects : kind === 'camera' ? setup.cameras : setup.fixtures;

  function toNorm(evt){
    const r = svg.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (evt.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (evt.clientY - r.top) / r.height))
    };
  }
  // Throw lines follow the drag so the setup stays readable while moving.
  function refreshLines(){
    svg.querySelectorAll('line[data-fx]').forEach(ln=>{
      const f = setup.fixtures.find(x=>x.id === ln.dataset.fx);
      if(!f || !setup.subjects.length) return;
      let nearest = setup.subjects[0], best = Infinity;
      setup.subjects.forEach(sub=>{
        const d = (sub.x-f.x)**2 + (sub.y-f.y)**2;
        if(d < best){ best = d; nearest = sub; }
      });
      ln.setAttribute('x1', (f.x*W).toFixed(1));
      ln.setAttribute('y1', (f.y*H).toFixed(1));
      ln.setAttribute('x2', (nearest.x*W).toFixed(1));
      ln.setAttribute('y2', (nearest.y*H).toFixed(1));
    });
  }
  svg.querySelectorAll('.ld-node').forEach(node=>{
    node.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const kind = node.dataset.kind;
      const item = (collectionFor(kind) || []).find(x=>x.id === node.dataset.id);
      if(!item) return;
      active = { item, node, originX: item.x, originY: item.y };
      node.style.cursor = 'grabbing';
      node.classList.add('ld-dragging');
      try { svg.setPointerCapture(e.pointerId); } catch(err){}
    });
  });
  svg.addEventListener('pointermove', (e)=>{
    if(!active) return;
    const p = toNorm(e);
    active.item.x = +p.x.toFixed(4);
    active.item.y = +p.y.toFixed(4);
    active.node.setAttribute('transform',
      `translate(${((active.item.x - active.originX) * W).toFixed(1)}, ${((active.item.y - active.originY) * H).toFixed(1)})`);
    refreshLines();
  });
  function end(){
    if(!active) return;
    active.node.style.cursor = 'grab';
    active.node.classList.remove('ld-dragging');
    active = null;
    saveProjectData();
    if(onCommit) onCommit();     // one clean redraw, after the gesture
  }
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('pointerleave', end);
}

/* Where the sun actually is in the sky at a given moment — altitude above
   the horizon and azimuth measured clockwise from true north. Together
   with a shoot date and a location this is enough to draw the sun onto an
   exterior lighting plan, which is something a diagram tool can only do
   if it also knows your schedule. */
/* Ties three things the app already knows together: which scene a setup
   is for, which shoot day that scene falls on, and where you're shooting.
   That's enough to place the real sun on an exterior plan. */
function shootDateForScene(sceneId){
  if(!sceneId) return null;
  const day = (state.projectData.shootDays || [])
    .find(d => d.date && (d.sceneIds || []).includes(sceneId));
  return day ? day.date : null;
}
function sceneIsExterior(sceneId){
  if(!sceneId) return false;
  const sc = scriptScenes().find(x=>x.id === sceneId);
  return !!sc && /^\s*(EXT|EST|INT\/EXT|I\/E)\b/i.test(sc.text || '');
}
function setupSunInfo(s){
  const loc = sunMoonLocation();
  if(!loc) return null;
  const scheduled = shootDateForScene(s.sceneId);
  const dateStr = scheduled || s.sunDate || new Date().toISOString().slice(0,10);
  const time = s.sunTime || '15:00';
  const dt = new Date(dateStr + 'T' + time);
  if(isNaN(dt.getTime())) return null;
  const pos = sunPositionAt(dt, loc.lat, loc.lon);
  return {
    altitude: pos.altitude, azimuth: pos.azimuth,
    dateStr, time, fromSchedule: !!scheduled, place: loc.label
  };
}
function sunPositionAt(date, lat, lon){
  const { transit, declination } = solarBasis(date, lon);
  const jd = date.getTime() / 86400000 + 2440587.5;
  const H = toRad((jd - transit) * 360);          // hour angle, 0 at solar noon
  const phi = toRad(lat), dec = declination;
  const alt = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  let az = Math.atan2(-Math.sin(H), Math.tan(dec)*Math.cos(phi) - Math.sin(phi)*Math.cos(H));
  az = (toDeg(az) + 360) % 360;
  return { altitude: toDeg(alt), azimuth: az };
}
const COMPASS_16 = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function compassName(az){ return COMPASS_16[Math.round(((az % 360) / 22.5)) % 16]; }

/* =========================================================
   SCRIPT — line classification (migration + paste)
========================================================= */
/* A screenplay's title page is a separate thing from the script, but in a
   plain text or PDF export it is just the first few lines. Imported
   blindly it becomes half a dozen stray ACTION blocks sitting above the
   first scene — which is exactly what a real import produced.

   Everything before FADE IN: (or the first scene heading) is treated as
   the title page, and only when it looks like one: short lines, few of
   them, and no screenplay grammar. A script that dives straight into a
   scene is left completely alone. */

/* Fountain "Key: value" front matter (Title:, Credit:, Author:, Source:,
   Draft date:, Contact:, Copyright:, Notes:) is a distinct, unambiguous
   title-page form the positional heuristics below can't read — they'd take
   "Title: Lovelock" as the literal title text. This is the title-page
   splitter (originally titlePageSplitter.js) inlined and mapped onto the
   app's five title-page fields; copyright/notes, which have no field of
   their own, are folded into the contact block rather than dropped. */
const FOUNTAIN_KEYS = {
  title:'title', credit:'credit', author:'author', authors:'author',
  source:'source', 'draft date':'draftDate', date:'draftDate',
  contact:'contact', copyright:'copyright', notes:'notes'
};
function parseFountainFrontMatter(headLines){
  // Only treat this as Fountain if at least one recognised key appears —
  // otherwise a stray "Notes:" in a rendered page would hijack detection.
  const isFountain = headLines.some(l=>{
    const m = l.match(/^([A-Za-z][A-Za-z ]*):/);
    return m && FOUNTAIN_KEYS[m[1].trim().toLowerCase()];
  });
  if(!isFountain) return null;

  const raw = { title:'', credit:'', author:'', contact:'',
                source:'', draftDate:'', copyright:'', notes:'' };
  let key = null;
  for(const l of headLines){
    const m = l.match(/^([A-Za-z][A-Za-z ]*):\s*(.*)$/);
    if(m && FOUNTAIN_KEYS[m[1].trim().toLowerCase()]){
      key = FOUNTAIN_KEYS[m[1].trim().toLowerCase()];
      raw[key] = m[2].trim();
    } else if(key){                       // indented continuation line
      raw[key] += (raw[key] ? '\n' : '') + l;
    }
  }

  // Map the richer Fountain key set onto the app's title-page record.
  const tp = { title:'', writtenBy:'', basedOn:'', contact:'', draftDate:'' };
  tp.title    = raw.title;
  tp.writtenBy = raw.author;                                  // "Author:" is the name
  tp.basedOn   = raw.source.replace(/^based on\s+/i, '').trim();
  tp.draftDate = raw.draftDate;
  const contactParts = [raw.contact, raw.copyright, raw.notes].filter(Boolean);
  tp.contact   = contactParts.join('\n');
  if(!tp.title && !tp.writtenBy && !tp.contact) return null;  // nothing usable
  return tp;
}

function extractTitlePage(lines){
  const isScene = (s)=>/^\s*(INT|EXT|EST|INT\.?\/EXT|I\/E)[\.\s]/i.test(s);
  const isFadeIn = (s)=>/^\s*FADE\s+IN\s*:?\s*$/i.test(s);

  let cut = -1;
  for(let i = 0; i < Math.min(lines.length, 40); i++){
    if(isFadeIn(lines[i])){ cut = i; break; }
    if(isScene(lines[i])){ cut = i; break; }
  }
  if(cut <= 0) return { titlePage:null, rest:lines, dropFadeIn:false };

  const head = lines.slice(0, cut).map(l=>l.trim()).filter(Boolean);
  if(!head.length) return { titlePage:null, rest:lines, dropFadeIn:false };

  // Fountain "Key: value" front matter first — it is unambiguous, and the
  // positional guards below (short lines, no prose) would wrongly reject a
  // valid Fountain page that carries a long Notes/Contact block.
  const fountain = parseFountainFrontMatter(head);
  if(fountain){
    return { titlePage: fountain, rest: lines.slice(cut), dropFadeIn: isFadeIn(lines[cut]) };
  }

  if(head.length > 14) return { titlePage:null, rest:lines, dropFadeIn:false };
  // Title pages are short lines. Prose up here means it is not one.
  if(head.some(l=>l.length > 60)) return { titlePage:null, rest:lines, dropFadeIn:false };

  const tp = { title:'', writtenBy:'', basedOn:'', contact:'', draftDate:'' };
  const contactLines = [];
  let seenByLine = false;

  head.forEach((line, i)=>{
    const low = line.toLowerCase().replace(/[^a-z ]/g,'').trim();
    if(/^(written|screenplay|story|created)\s+by$/.test(low) || low === 'by'){
      seenByLine = true; return;
    }
    if(/^based on/i.test(line)){ tp.basedOn = line; return; }
    if(/^(draft|first draft|final draft|revision|rev\.)/i.test(line) ||
       /^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(line) ||
       /^(january|february|march|april|may|june|july|august|september|october|november|december)/i.test(line)){
      tp.draftDate = line; return;
    }
    // Anything that looks like contact details belongs in the contact block.
    if(/@/.test(line) || /\d{3}[-.\s]?\d{3,4}/.test(line) ||
       /^(address|phone|e-?mail|tel|contact)\b/i.test(line)){
      contactLines.push(line); return;
    }
    if(!tp.title && !seenByLine){ tp.title = line; return; }
    if(seenByLine && !tp.writtenBy){ tp.writtenBy = line; return; }
    contactLines.push(line);
  });

  tp.contact = contactLines.join('\n');
  if(!tp.title && !tp.writtenBy) return { titlePage:null, rest:lines, dropFadeIn:false };

  return {
    titlePage: tp,
    rest: lines.slice(cut),
    dropFadeIn: isFadeIn(lines[cut])
  };
}
function classifyLines(lines){
  const blocks = [];
  let prevType = null;
  lines.forEach(raw=>{
    const trimmed = (raw||'').trim();
    if(trimmed===''){ prevType=null; return; }
    let type;
    if(/^(INT|EXT|EST|INT\/EXT|I\/E)[\.\s]/i.test(trimmed)){ type='scene'; }
    else if(/^END OF ACT\b/i.test(trimmed)){ type='endact'; }
    else if(/^ACT\s+(ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN|EIGHT|NINE|TEN|[IVX0-9]+)\b/i.test(trimmed)){ type='newact'; }
    else if(/^\(.*\)$/.test(trimmed)){ type='parenthetical'; }
    else if(/(CUT TO:|FADE (IN|OUT)\.?|DISSOLVE TO:|SMASH CUT TO:)$/i.test(trimmed)){ type='transition'; }
    else if(trimmed===trimmed.toUpperCase() && /^[A-Z0-9][A-Z0-9 .\-'()]{0,40}$/.test(trimmed) && trimmed.split(' ').length<=6){ type='character'; }
    else if(prevType==='character' || prevType==='parenthetical' || prevType==='dialogue'){ type='dialogue'; }
    else { type='action'; }
    blocks.push({id:uid(), type, text:trimmed});
    prevType = type;
  });
  return blocks;
}
const BLOCK_CYCLE = ['scene','action','character','parenthetical','dialogue','transition','shot'];
const BLOCK_LABELS = {scene:'Scene',action:'Action',character:'Character',parenthetical:'Parens',dialogue:'Dialogue',transition:'Transition',shot:'Shot',newact:'New Act',endact:'End Act'};

/* =========================================================
   SCRIPT IMPORT — txt/md/fountain, PDF (pdf.js), DOCX (mammoth)
========================================================= */
let pdfWorkerReady = false;
function ensurePdfWorker(){
  if(pdfWorkerReady) return;
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfWorkerReady = true;
  }
}
function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsArrayBuffer(file);
  });
}
async function extractTextFromPDF(file){
  ensurePdfWorker();
  const buf = await readFileAsArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    // group text items into lines by their vertical position
    const rows = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!rows[y]) rows[y] = [];
      rows[y].push(item.str);
    });
    const ys = Object.keys(rows).map(Number).sort((a,b)=>b-a);
    ys.forEach(y=>{ lines.push(rows[y].join(' ').replace(/\s+/g,' ').trim()); });
    lines.push('');
  }
  return lines.join('\n');
}
async function extractTextFromDocx(file){
  const buf = await readFileAsArrayBuffer(file);
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}
async function handleScriptImport(file, main){
  const name = file.name.toLowerCase();
  const hasContent = currentScript().blocks.some(b=>b.text && b.text.trim());
  if(hasContent){
    const ok = await openConfirmModal('Replace current script?', 'Importing will replace everything currently in the Script tool. This cannot be undone.', 'Replace');
    if(!ok) return;
  }
  const btn = document.getElementById('importScriptBtn');
  if(btn){ btn.textContent = 'Importing…'; btn.disabled = true; }
  try{
    let text = '';
    if(name.endsWith('.pdf')){
      text = await extractTextFromPDF(file);
    } else if(name.endsWith('.docx')){
      text = await extractTextFromDocx(file);
    } else {
      text = await readFileAsText(file);
    }
    let lines = text.split('\n');
    // Pull the title page out before classifying, or its lines arrive as
    // stray action blocks above the first scene.
    const tpResult = extractTitlePage(lines);
    lines = tpResult.rest;
    if(tpResult.dropFadeIn) lines = lines.slice(1);
    const blocks = classifyLines(lines);
    if(blocks.length === 0){
      await openAlertModal('Nothing found', "That file didn't seem to contain any readable text.");
      return;
    }
    const script = currentScript();
    script.blocks = blocks;
    if(tpResult.titlePage){
      const t = tpResult.titlePage;
      Object.keys(t).forEach(k=>{ if(t[k]) script.titlePage[k] = t[k]; });
    }
    saveProjectData();
    renderScript(main);
    const sceneCount = blocks.filter(b=>b.type==='scene').length;
    await openAlertModal('Import complete',
      `Imported ${sceneCount} scene heading${sceneCount!==1?'s':''} across ${computeScriptPages().length} page${computeScriptPages().length!==1?'s':''}.`
      + (tpResult.titlePage ? ' The title page was recognised and moved to the Title Page tab.' : '')
      + ' PDF and DOCX imports are best-effort — check character names and scene headings, and adjust with Tab where needed.');
  }catch(err){
    await openAlertModal('Import failed', "That file couldn't be read. Try exporting it as a .txt or .fountain file and importing that instead.");
  }finally{
    if(btn){ btn.textContent = 'Import Script'; btn.disabled = false; }
  }
}

/* Standard WGA/industry script revision color order. "White" is the
   original/current draft and is never itself a saved revision — the
   first saved snapshot becomes Blue, and the sequence cycles from there. */
const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const REVISION_COLORS = [
  {name:'Blue', hex:'#5B8DBE'}, {name:'Pink', hex:'#E8A0BF'}, {name:'Yellow', hex:'#E8D54A'},
  {name:'Green', hex:'#7FBF7F'}, {name:'Goldenrod', hex:'#DAA520'}, {name:'Buff', hex:'#D9C79E'},
  {name:'Salmon', hex:'#F0977A'}, {name:'Cherry', hex:'#C93756'}
];
const BREAKDOWN_CATEGORIES = [
  {key:'cast', label:'Cast', color:'#D64545'},
  {key:'extras', label:'Extras / Background', color:'#E8B93E'},
  {key:'props', label:'Props', color:'#8B5FBF'},
  {key:'wardrobe', label:'Wardrobe', color:'#4E9E8C'},
  {key:'vehicles', label:'Vehicles / Animals', color:'#3A5A78'},
  {key:'sfx', label:'SFX / Stunts', color:'#C4501F'},
  {key:'sound', label:'Sound', color:'#8B5E34'},
  {key:'makeup', label:'Makeup / Hair', color:'#C46FA0'}
];
function breakdownCategory(key){ return BREAKDOWN_CATEGORIES.find(c=>c.key===key) || BREAKDOWN_CATEGORIES[0]; }
function scriptScenes(){ const cs = currentScript(); return cs ? cs.blocks.filter(b=>b.type==='scene') : []; }
function blocksForScene(sceneBlockId){
  const cs = currentScript();
  if(!cs) return [];
  const blocks = cs.blocks;
  const idx = blocks.findIndex(b=>b.id===sceneBlockId);
  if(idx===-1) return [];
  const result = [blocks[idx]];
  for(let i=idx+1; i<blocks.length; i++){
    if(blocks[i].type==='scene') break;
    result.push(blocks[i]);
  }
  return result;
}
function scriptCharacterNames(){
  const cs = currentScript();
  const names = new Set();
  if(cs) cs.blocks.forEach(b=>{
    if(b.type==='character' && b.text.trim()) names.add(b.text.trim());
  });
  return Array.from(names).sort();
}
function scriptSceneHeadings(){
  const cs = currentScript();
  const set = new Set();
  if(cs) cs.blocks.forEach(b=>{
    if(b.type==='scene' && b.text.trim()) set.add(b.text.trim());
  });
  return Array.from(set).sort();
}
function computeCharacterStats(){
  const cs = currentScript();
  const blocks = cs ? cs.blocks : [];
  const stats = {};
  let currentSpeaker = null;
  let currentSceneId = null;
  blocks.forEach(b=>{
    if(b.type === 'scene'){ currentSceneId = b.id; currentSpeaker = null; }
    else if(b.type === 'character'){ currentSpeaker = b.text.trim(); }
    else if(b.type === 'dialogue' && currentSpeaker){
      if(!stats[currentSpeaker]) stats[currentSpeaker] = { scenes: new Set(), lines: 0 };
      stats[currentSpeaker].lines++;
      if(currentSceneId) stats[currentSpeaker].scenes.add(currentSceneId);
    }
  });
  return Object.entries(stats)
    .map(([name, s])=>({ name, sceneCount: s.scenes.size, lineCount: s.lines }))
    .sort((a,b)=> b.lineCount - a.lineCount);
}
function sceneMeta(sceneBlock){
  const text = (sceneBlock.text || '').toUpperCase();
  let setting = null;
  if(/^(INT\/EXT|I\/E)\b/.test(text)) setting = 'INT/EXT';
  else if(/^INT\b/.test(text)) setting = 'INT';
  else if(/^EXT\b/.test(text)) setting = 'EXT';
  else if(/^EST\b/.test(text)) setting = 'EXT';
  let timeOfDay = null;
  if(/\bNIGHT\b/.test(text)) timeOfDay = 'NIGHT';
  else if(/\bDAY\b|\bMORNING\b|\bAFTERNOON\b/.test(text)) timeOfDay = 'DAY';
  else if(/\bDUSK\b|\bEVENING\b/.test(text)) timeOfDay = 'NIGHT';
  else if(/\bDAWN\b/.test(text)) timeOfDay = 'DAY';
  return { setting, timeOfDay };
}
function sceneCharacters(sceneBlockId){
  const names = new Set();
  blocksForScene(sceneBlockId).forEach(b=>{
    if(b.type==='character' && b.text.trim()) names.add(b.text.trim());
  });
  return Array.from(names);
}
function sceneMatchesFilter(sceneBlock, filter){
  if(!filter) return true;
  const meta = sceneMeta(sceneBlock);
  if(filter.setting && meta.setting !== filter.setting) return false;
  if(filter.timeOfDay && meta.timeOfDay !== filter.timeOfDay) return false;
  if(filter.character && !sceneCharacters(sceneBlock.id).includes(filter.character)) return false;
  if(filter.episodeId && sceneBlock.episodeId !== filter.episodeId) return false;
  return true;
}

async function init(){
  const savedTheme = await storeGet('app-theme', false);
  state.theme = savedTheme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  const savedFontSize = await storeGet('font-size', false);
  state.fontSize = ['small','medium','large','xlarge'].includes(savedFontSize) ? savedFontSize : 'medium';
  document.documentElement.setAttribute('data-font-size', state.fontSize);

  const savedMode = await storeGet('app-mode', false);
  state.mode = savedMode === 'pro' ? 'pro' : 'simple';
  const legacyCustomTabs = await storeGet('custom-tabs', false);
  const savedProfile = await storeGet('user-profile', false);
  if(savedProfile) state.profile = Object.assign({name:'', role:'', email:'', color:'#2E9E6B'}, savedProfile);
  const savedDefaultType = await storeGet('default-project-type', false);
  if(savedDefaultType && PROJECT_TYPES[savedDefaultType]) state.defaultProjectType = savedDefaultType;
  const savedReminders = await storeGet('reminders-enabled', false);
  state.remindersEnabled = savedReminders === true;
  const savedDirAlerts = await storeGet('director-note-alerts', false);
  state.directorNoteAlertsEnabled = savedDirAlerts === true;
  // Per-event prefs, seeded from the two old on/off switches so nobody
  // silently loses notifications they had already turned on.
  const savedNotify = await storeGet('notify-prefs', false);
  state.notifyPrefs = Object.assign(defaultNotifyPrefs(), savedNotify || {});
  if(!savedNotify){
    state.notifyPrefs.deadlineToday = state.remindersEnabled;
    state.notifyPrefs.directorNote  = state.directorNoteAlertsEnabled;
    await storeSet('notify-prefs', state.notifyPrefs, false);
  }
  const savedWeatherEnabled = await storeGet('weather-enabled', false);
  state.weatherEnabled = savedWeatherEnabled === true;
  const savedWeatherLoc = await storeGet('weather-location', false);
  state.weatherLocation = savedWeatherLoc || null;
  const savedWeatherUnit = await storeGet('weather-unit', false);
  state.weatherUnit = savedWeatherUnit === 'C' ? 'C' : 'F';

  const list = await storeGet('projects', false);
  state.projects = list || [];
  let migrated = false;
  const legacyTabsValid = Array.isArray(legacyCustomTabs) && legacyCustomTabs.length ? legacyCustomTabs : null;
  state.projects.forEach(p=>{
    if(!p.type){ p.type = 'narrative'; migrated = true; }
    if(!p.role){ p.role = 'solo'; migrated = true; }
    if(p.subtype === undefined){ p.subtype = null; migrated = true; }
    if(p.shared && !p.myPermission){ p.myPermission = 'admin'; migrated = true; }
    if(p.customTabs === undefined){ p.customTabs = legacyTabsValid; migrated = true; }
    if(p.guidedMode === undefined){ p.guidedMode = false; migrated = true; }
  });
  if(legacyTabsValid){ await storeDelete('custom-tabs', false); }
  if(migrated){
    await storeSet('projects', state.projects, false);
  }
  if(state.projects.length > 0){
    state.currentProjectId = state.projects[0].id;
    const proj = currentProject();
    await loadProjectInto(proj);
  }
  state.loaded = true;
  render();
  // Deliberately not awaited: the app is fully usable signed out, so a slow
  // or failed auth check must never hold up first paint. When it resolves,
  // onAuthStateChange re-renders.
  initAuth();
}

/* Both entry points load a project the same way, and the order matters:
   images must be in memory BEFORE normalizeProjectData runs, because the
   id migration rewrites image keys alongside everything else. And if the
   migration changed anything it has to be written back immediately —
   otherwise it re-runs on the next load and mints different UUIDs, which
   would silently break anything already synced. */
async function loadProjectInto(proj){
  const raw = (await storeGet(dataKeyFor(proj), !!proj.shared)) || emptyProjectData();
  state.images = await loadProjectImages(proj);
  state.projectData = normalizeProjectData(raw);
  if(state.projectData._justMigratedIds){
    const n = state.projectData._justMigratedIds;
    delete state.projectData._justMigratedIds;
    await storeSet(dataKeyFor(proj), state.projectData, !!proj.shared);
    await saveProjectImages();
    console.info('Migrated ' + n + ' ids to UUIDs for "' + proj.name + '".');
  }
}
async function switchProject(id){
  state.currentProjectId = id;
  const proj = currentProject();
  if(!proj) return;
  await loadProjectInto(proj);
  state.view = 'dashboard';
  state.openDept = 'overview';
  state.scriptFilter = {setting:null, timeOfDay:null, character:null, episodeId:null};
  render();
}

async function createProject(wiz){
  const id = uid();
  const type = wiz.type;
  const subtype = PROJECT_TYPES[type].hasSubtype ? wiz.subtype : null;
  const navTools = wiz.navTools && wiz.navTools.size ? Array.from(wiz.navTools) : null;
  state.projects.push({id, name: wiz.name, type, subtype, role: wiz.role || 'solo', hats: Array.from(wiz.hats), customTabs: navTools, guidedMode:false, createdAt: Date.now(), shared:false});
  await storeSet('projects', state.projects, false);
  const data = emptyProjectData();
  // No default script is created, so there is no title page to pre-fill
  // here. The first script the user creates or imports starts blank.
  (wiz.roleSlots ? Array.from(wiz.roleSlots) : []).forEach(slot=>{
    data.contacts.push({id:uid(), name:'', kind:'Crew', role:slot, email:'', phone:'', notes:''});
  });
  if(wiz.template === 'starter'){
    STARTER_TASKS.forEach(t=>data.tasks.push({id:uid(), text:t, done:false, dueDate:'', notes:''}));
  }
  await storeSet('proj-'+id, data, false);
  await switchProject(id);
}

async function duplicateProject(projId){
  if(state.projects.length >= MAX_PROJECTS){
    await openAlertModal('Project limit reached', 'You can have up to '+MAX_PROJECTS+' projects. Remove one first to duplicate another.');
    return;
  }
  const original = state.projects.find(p=>p.id===projId);
  if(!original) return;
  const data = await storeGet(dataKeyFor(original), !!original.shared);
  const images = await storeGet(imagesKeyFor(original), !!original.shared);
  const newId = uid();
  const newProj = {
    id:newId, name: original.name+' (Copy)', type: original.type, subtype: original.subtype || null,
    role: original.role, customTabs: original.customTabs || null, guidedMode: !!original.guidedMode, createdAt: Date.now(), shared:false
  };
  state.projects.push(newProj);
  await storeSet('projects', state.projects, false);
  const clonedData = normalizeProjectData(data ? JSON.parse(JSON.stringify(data)) : emptyProjectData());
  clonedData.trash = [];
  await storeSet(dataKeyFor(newProj), clonedData, false);
  if(images) await storeSet(imagesKeyFor(newProj), JSON.parse(JSON.stringify(images)), false);
  await switchProject(newId);
}

async function deleteCurrentProject(){
  const proj = currentProject();
  if(!proj) return;
  const msg = proj.shared
    ? `Remove "${proj.name}" from your project list? Your crewmates will keep their access — the shared data isn't deleted.`
    : `Delete "${proj.name}" permanently? This cannot be undone.`;
  const ok = await openConfirmModal('Remove project?', msg, proj.shared ? 'Remove' : 'Delete');
  if(!ok) return;
  if(!proj.shared){ await storeDelete('proj-'+proj.id, false); await storeDelete('proj-images-'+proj.id, false); }
  await storeDelete('dirnotes-lastseen-'+proj.id, false);
  state.projects = state.projects.filter(p=>p.id!==proj.id);
  await storeSet('projects', state.projects, false);
  if(state.projects.length===0){
    state.currentProjectId = null;
    state.projectData = null;
    state.images = {};
    state.atHome = true;
    state.drawerOpen = false;
    render();
    return;
  }
  await switchProject(state.projects[0].id);
}

async function makeCollaborative(){
  const proj = currentProject();
  if(!proj || proj.shared) return;
  const code = genCode();
  state.projectData.meta.name = proj.name;
  state.projectData.meta.type = proj.type;
  state.projectData.meta.joinPassword = '';
  state.projectData.meta.collaborators = [
    { name: state.profile.name || 'Project Creator', permission:'admin', joinedAt: Date.now() }
  ];
  await storeSet('shared-proj-'+code, state.projectData, true);
  await storeSet('shared-proj-images-'+code, state.images, true);
  await storeDelete('proj-'+proj.id, false);
  await storeDelete('proj-images-'+proj.id, false);
  proj.shared = true; proj.code = code; proj.id = code; proj.myPermission = 'admin';
  state.currentProjectId = code;
  await storeSet('projects', state.projects, false);
  render();
}

async function joinSharedProject(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  if(!code) return false;
  if(state.projects.length >= MAX_PROJECTS){
    await openAlertModal('Project limit reached', 'You can have up to '+MAX_PROJECTS+' projects. Remove one first to add another.');
    return false;
  }
  if(state.projects.some(p=>p.code===code)){
    await openAlertModal('Already in your list', 'You already have this project in your list.');
    return false;
  }
  const data = await storeGet('shared-proj-'+code, true);
  if(!data){
    await openAlertModal('Not found', 'No shared project found with that code. Double-check it with whoever sent it.');
    return false;
  }
  const requiredPassword = data.meta && data.meta.joinPassword;
  if(requiredPassword){
    const entered = await openPromptModal('Password required', 'This project requires a join password in addition to the code.', '');
    if(entered === null) return false;
    if(entered.trim() !== requiredPassword){
      await openAlertModal('Incorrect password', "That password doesn't match. Double-check it with whoever sent you the invite.");
      return false;
    }
  }
  const permission = await promptPermissionModal();
  const name = (data.meta && data.meta.name) || 'Shared Project';
  const type = (data.meta && data.meta.type) || 'narrative';
  data.meta.collaborators = data.meta.collaborators || [];
  const myName = state.profile.name || 'Unnamed';
  const existingIdx = data.meta.collaborators.findIndex(c=>(c.name||'').trim().toLowerCase()===myName.trim().toLowerCase());
  const entry = { name: myName, permission, joinedAt: Date.now() };
  if(existingIdx === -1) data.meta.collaborators.push(entry);
  else data.meta.collaborators[existingIdx] = entry;
  await storeSet('shared-proj-'+code, data, true);
  state.projects.push({id:code, name, type, shared:true, code, createdAt:Date.now(), myPermission: permission});
  await storeSet('projects', state.projects, false);
  await switchProject(code);
  return true;
}

                  </select>
                </div>
              `).join('')}
            </div>
          ` : ''}
        ` : ''}
      ` : `
        <p>Turn "${esc(proj.name)}" into a shared project so your crew can join it too.</p>
        <button class="btn btn-tape btn-sm" id="makeSharedBtn">Make this project shared</button>
        <p class="modal-note" style="margin-top:10px;">Once shared, anyone with the invite code can join — as an Admin, Collaborator, or read-only Viewer. You can add an optional join password afterward.</p>
      `}

      <p>Have a code from someone else?</p>

  const makeBtn = overlay.querySelector('#makeSharedBtn');
  if(makeBtn) makeBtn.onclick = async ()=>{
    // The original sharing model relied on Claude's hosted storage, where a
    // "shared" key really was shared between people. Running anywhere else
    // there is no such thing — and this path also REPLACES the project's id
    // with the share code, which breaks every reference the account holds.
    // Account sharing supersedes it.
    if(authAvailable()){
      overlay.remove();
      await openAlertModal('Use account sharing instead',
        'Sharing now works through your account, which is what lets other people actually reach the project from their own device.\n\nGo to Settings \u2192 Account, sign in, then use "Invite people to this project". They join with the code from their own copy of the app.');

    }

  };

      proj.scriptEditRestricted = el.dataset.restrictChoice === 'on';

      overlay.remove();
      openCollabModal();
    };
  });
  overlay.querySelectorAll('#crewAccessList select[data-idx]').forEach(sel=>{
    sel.onchange = async ()=>{
      roster[parseInt(sel.dataset.idx)].permission = sel.value;
      state.projectData.meta.collaborators = roster;

  overlay.querySelector('#joinBtn').onclick = async ()=>{
    const code = overlay.querySelector('#joinCodeInput').value;
    const ok = await joinSharedProject(code);
    if(ok) overlay.remove();
  };
}

function initialsFor(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';

  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();

/* =========================================================
   BACKUP RESTORE — the other half of Export All Data.
   Reads a backup file, shows what's inside it, and lets you
   choose to merge it alongside your current work or replace
   everything. Never overwrites silently.
========================================================= */
function openImportChoiceModal(summary){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal">
      <h3>Restore from backup</h3>
      <p>${esc(summary.line)}</p>
      <div class="import-preview">
        ${summary.names.map(n=>`<div class="import-preview-row">${esc(n)}</div>`).join('')}
      </div>
      <p style="font-size:12px;color:var(--ink-mute);line-height:1.5;">
        <b>Merge</b> keeps everything already on this device and adds any project that isn't here yet.
        <b>Replace all</b> erases your current projects first.
      </p>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" id="imCancel">Cancel</button>
        <button class="btn btn-danger btn-sm" id="imReplace" style="border-color:var(--tape);color:var(--tape);">Replace all</button>
        <button class="btn btn-chalk btn-sm" id="imMerge">Merge</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    function done(v){ overlay.remove(); resolve(v); }
    overlay.querySelector('#imCancel').onclick = ()=>done(null);
    overlay.querySelector('#imMerge').onclick = ()=>done('merge');
    overlay.querySelector('#imReplace').onclick = ()=>done('replace');
    overlay.addEventListener('click', e=>{ if(e.target===overlay) done(null); });
  });
}
async function importAllDataJSON(file){
  let bundle;
  try{
    bundle = JSON.parse(await readFileAsText(file));
  }catch(e){
    await openAlertModal('Could not read that file', `That file isn't valid JSON. Choose a backup file that was exported from ${APP_NAME}.`);
    return;
  }
  if(!bundle || !Array.isArray(bundle.projects)){
    await openAlertModal('Not a backup file', `That file doesn't look like a ${APP_NAME} backup. Look for one named ${APP_NAME.toLowerCase()}-backup-….json`);
    return;
  }
  const valid = bundle.projects.filter(e => e && e.meta && e.meta.id && e.meta.name && e.data);
  const malformed = bundle.projects.length - valid.length;
  if(!valid.length){
    await openAlertModal('Nothing to restore', 'That backup file has no readable project data in it.');
    return;
  }
  const when = bundle.exportedAt ? new Date(bundle.exportedAt).toLocaleDateString() : null;
  const choice = await openImportChoiceModal({
    line: `${valid.length} project${valid.length!==1?'s':''}${when ? ', backed up '+when : ''}.`
          + (malformed ? ` (${malformed} unreadable entr${malformed!==1?'ies':'y'} will be skipped.)` : ''),
    names: valid.map(e=>e.meta.name)
  });
  if(!choice) return;

  if(choice === 'replace'){
    const ok = await openConfirmModal('Replace everything?',
      'This erases every project currently on this device before restoring the backup. It cannot be undone.', 'Replace');
    if(!ok) return;
    for(const p of state.projects){
      await storeDelete(dataKeyFor(p), !!p.shared);
      await storeDelete(imagesKeyFor(p), !!p.shared);
    }
    state.projects = [];
    state.currentProjectId = null;
  }

  const existingIds = new Set(state.projects.map(p=>p.id));
  let imported = 0, dupes = 0, overLimit = 0, failed = 0;

  for(const entry of valid){
    if(existingIds.has(entry.meta.id)){ dupes++; continue; }
    if(state.projects.length >= MAX_PROJECTS){ overLimit++; continue; }
    const meta = entry.meta;
    const data = normalizeProjectData(entry.data);
    // Write the data before registering the project, so a failed write
    // never leaves a project listed with nothing behind it.
    if(!(await storeSet(dataKeyFor(meta), data, !!meta.shared))){ failed++; continue; }
    if(entry.images) await storeSet(imagesKeyFor(meta), entry.images, !!meta.shared);
    state.projects.push(meta);
    existingIds.add(meta.id);
    imported++;
  }
  await storeSet('projects', state.projects, false);

  const notes = [];
  if(dupes)     notes.push(`${dupes} already on this device`);
  if(overLimit) notes.push(`${overLimit} skipped — ${MAX_PROJECTS}-project limit reached`);
  if(failed)    notes.push(`${failed} couldn't be saved, likely low storage`);
  if(malformed) notes.push(`${malformed} unreadable`);

  await openAlertModal(
    imported ? 'Restore complete' : 'Nothing imported',
    (imported ? `Restored ${imported} project${imported!==1?'s':''}. ` : 'No new projects were added. ')
    + (notes.length ? notes.join('. ') + '.' : '')
  );

  if(!currentProject()) state.currentProjectId = state.projects.length ? state.projects[0].id : null;
  if(state.currentProjectId) await switchProject(state.currentProjectId);
  state.atSettings = false;
  state.atHome = !state.currentProjectId;
  render();
}

/* =========================================================
   CALENDAR EXPORT (.ics) — works with Apple Calendar, Google
   Calendar, Outlook, or any app that reads the iCalendar format.
   This is a one-time export, not a live sync.
========================================================= */
function icsEscape(text){
  return (text||'').toString().replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsDateStamp(){
  return new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
}
function buildICS(events){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+APP_NAME+'//Production Toolkit//EN','CALSCALE:GREGORIAN'];
  events.forEach(ev=>{
    if(!ev.date) return;
    const dateStr = ev.date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+(ev.uid||uid())+'@slateandpage');
    lines.push('DTSTAMP:'+icsDateStamp());
    lines.push('DTSTART;VALUE=DATE:'+dateStr);
    lines.push('DTEND;VALUE=DATE:'+dateStr);
    lines.push('SUMMARY:'+icsEscape(ev.title));
    if(ev.description) lines.push('DESCRIPTION:'+icsEscape(ev.description));
    if(ev.location) lines.push('LOCATION:'+icsEscape(ev.location));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(filename, events){
  const validEvents = events.filter(e=>e.date);
  if(!validEvents.length){
    openAlertModal('Nothing to export', 'None of these items have a date set yet.');
    return;
  }
  const ics = buildICS(validEvents);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.ics') ? filename : filename+'.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function projectDeadlines(){
  const pd = state.projectData;
  const items = [];
  pd.callsheets.forEach(cs=>{
    if(cs.date) items.push({
      date: cs.date, kind:'Call Sheet', title: 'Call Sheet: '+(cs.title||'Untitled'),
      description: `Crew call ${cs.crewCall||'—'} · Shoot call ${cs.shootCall||'—'} · Wrap ${cs.wrap||'—'}`,
      location: cs.location||'', uid: 'cs-'+cs.id, onOpen: ()=>{ state.currentCallsheetId = cs.id; state.view = 'callsheet-detail'; render(); }
    });
  });
  pd.shootDays.forEach(d=>{
    if(d.date) items.push({
      date: d.date, kind:'Shoot Day', title: d.label,
      description: `${d.sceneIds.length} scene(s) scheduled`, location:'', uid:'day-'+d.id,
      onOpen: ()=>{ state.view = 'schedule'; render(); }
    });
  });
  pd.tasks.forEach(t=>{
    if(t.dueDate && !t.done) items.push({

      description: t.notes||'', location:'', uid:'task-'+t.id,

  return items.sort((a,b)=>a.date.localeCompare(b.date));
}

/* =========================================================
   GUIDED PROJECT — simple rule-based "what's next" suggestions.
   This is a starting framework, not an exhaustive path-covering
   system — it checks a handful of concrete signals in a sensible
   production order and suggests the next reasonable step.
========================================================= */
function getNextStepSuggestion(proj, pd){
  const hasScriptContent = pd.scripts.some(s=>s.blocks.some(b=>b.text && b.text.trim()));
  if(proj.type !== 'content' && !hasScriptContent){
    return { title:'Start writing your script', body:"Every narrative, documentary, or reality project starts here. Even a rough first pass gives every other tool something to work from.", view:'script' };
  }
  if(proj.type === 'content' && pd.shotlists.length===0 && pd.brollEntries.length===0){
    return { title:'Plan your first shots', body:'Start a shot list for what you want to capture — even a rough one beats winging it on the day.', view:'shotlists' };
  }
  if(proj.type !== 'content' && pd.shotlists.length===0){
    return { title:'Build your first shot list', body:'Turn your script into a concrete list of shots for the first scene you plan to shoot.', view:'shotlists' };
  }
  if(proj.type !== 'content' && pd.callsheets.length===0 && pd.shootDays.length===0){
    return { title:'Plan your shoot days', body:'Set up your Shooting Schedule, or jump straight to a Call Sheet if you already know your first shoot date.', view:'schedule' };
  }
  if(pd.tasks.length===0){
    return { title:'Add a few pre-production tasks', body:"Break down what's left into concrete, checkable steps — it's easier to see real progress that way.", view:'tasks' };
  }
  if(proj.type !== 'content' && pd.locations.length===0){
    return { title:'Scout and add your locations', body:'Save addresses, contacts, and reference photos for anywhere you plan to shoot.', view:'locations' };
  }
  if(proj.type !== 'content' && pd.contacts.length===0){
    return { title:'Add your cast & crew', body:'Build out your Contacts list so you can pull names straight into call sheets later.', view:'contacts' };
  }
  return { title:"You're off to a good start", body:'Keep building out your production — check Upcoming Deadlines below for anything time-sensitive.', view:null };
}

async function lookupZipLocation(zip){
  let res;
  try{
    res = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip.trim())}`);
  }catch(networkErr){
    console.error('ZIP lookup network error — the request may be blocked:', networkErr);
    const e = new Error('network'); e.kind = 'network'; throw e;
  }
  if(res.status === 404){
    const e = new Error('not_found'); e.kind = 'not_found'; throw e;
  }
  if(!res.ok){
    console.error('ZIP lookup HTTP error', res.status, res.statusText);
    const e = new Error('http'); e.kind = 'http'; throw e;
  }
  const data = await res.json();
  const place = data.places && data.places[0];
  if(!place){
    const e = new Error('no_place'); e.kind = 'not_found'; throw e;
  }
  return {
    lat: parseFloat(place.latitude), lon: parseFloat(place.longitude),
    label: `${place['place name']}, ${place['state abbreviation']}`
  };
}
function getDeviceLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation not supported')); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, label:'Your location'}),
      err=>reject(err),
      {timeout:10000}
    );
  });
}
async function resolveWeatherLocation(){
  const loc = state.weatherLocation;
  if(!loc) return null;
  if(loc.type === 'zip') return { lat:loc.lat, lon:loc.lon, label:loc.label };
  if(loc.type === 'geo') return await getDeviceLocation();
  return null;
}
async function fetchForecast(lat, lon, unit){
  const tempUnit = unit === 'C' ? 'celsius' : 'fahrenheit';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&temperature_unit=${tempUnit}&timezone=auto&forecast_days=1`;
  let res;
  try{
    res = await fetch(url);
  }catch(networkErr){
    console.error('Weather forecast network error — the request may be blocked:', networkErr);
    throw networkErr;
  }
  if(!res.ok){
    console.error('Weather forecast HTTP error', res.status, res.statusText);
    throw new Error('Weather fetch failed');
  }
  const data = await res.json();
  return {
    temp: Math.round(data.current.temperature_2m),
    code: data.current.weather_code,
    high: Math.round(data.daily.temperature_2m_max[0]),
    low: Math.round(data.daily.temperature_2m_min[0]),
    precipChance: data.daily.precipitation_probability_max[0],
    unit
  };
}
async function getWeatherForDashboard(){
  if(!state.weatherEnabled || !state.weatherLocation) return null;
  const cacheKey = JSON.stringify(state.weatherLocation) + state.weatherUnit;
  if(state.weatherCache && state.weatherCache.key === cacheKey && (Date.now() - state.weatherCache.fetchedAt) < 20*60*1000){
    return state.weatherCache.data;
  }
  try{
    const loc = await resolveWeatherLocation();
    if(!loc) return null;
    const forecast = await fetchForecast(loc.lat, loc.lon, state.weatherUnit);
    const result = { ...forecast, label: loc.label };
    state.weatherCache = { key: cacheKey, data: result, fetchedAt: Date.now() };
    return result;
  }catch(e){
    console.error('Weather could not be loaded for the Dashboard:', e);
    return null;
  }
}

/* =========================================================
   SUPABASE — connection config
   =========================================================
   Deliberately inert: defining these does not change how the app
   stores anything. Every tool still reads and writes local storage
   exactly as before. This exists so the connection can be proved
   working before a single line of sync code is written.

   The publishable key belongs in client-side code — it identifies the
   browser, nothing more, and Row Level Security decides what that
   browser is allowed to see. The service_role key is the opposite:
   it bypasses RLS entirely and must never appear in this file.
========================================================= */
const SUPABASE_CONFIG = {
  url: 'https://mmeptjvwxemlvxvjkbut.supabase.co',
  publishableKey: 'sb_publishable_DATBN5tXk9MHvBscMosIaQ_pLeKNR80'
};
let _sbClient = null;
function supabaseReady(){
  return !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.publishableKey
            && typeof window.supabase !== 'undefined');
}
function sbClient(){
  if(!supabaseReady()) return null;
  if(!_sbClient){
    _sbClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey);
  }
  return _sbClient;
}
/* Checks the two things most likely to be wrong, separately, so a
   failure points at a cause instead of just saying "didn't work".
     1. Auth reachable  -> the URL and key are valid
     2. A table read    -> the schema ran AND the API grants applied
   Step 2 is the one that catches "Automatically expose new tables" being
   off without the grants from section 11 of the schema. */
async function testSupabaseConnection(){
  if(typeof window.supabase === 'undefined'){
    return { ok:false, stage:'library',
      message:'The Supabase library did not load. It comes from a CDN, so this fails in offline previews and on blocked networks.' };
  }
  if(!SUPABASE_CONFIG.url || !SUPABASE_CONFIG.publishableKey){
    return { ok:false, stage:'config', message:'No project URL or publishable key set.' };
  }
  const sb = sbClient();
  try{
    const { error: authErr } = await sb.auth.getSession();
    if(authErr){
      return { ok:false, stage:'auth',
        message:'Reached the project but auth rejected the request. Usually a wrong or rotated key. (' + authErr.message + ')' };
    }
  } catch(e){
    return { ok:false, stage:'network',
      message:'Could not reach the project at all. Check the URL, and that you are online. (' + e.message + ')' };
  }
  try{
    const { error } = await sb.from('projects').select('id').limit(1);
    if(error){
      const code = error.code || '';
      if(code === '42P01'){
        return { ok:false, stage:'schema',
          message:'Connected, but there is no "projects" table yet. Run the schema SQL first.' };
      }
      if(code === '42501' || /permission denied/i.test(error.message)){
        return { ok:false, stage:'grants',
          message:'Connected and the table exists, but the API has no permission to read it. Run section 11 (API Grants) of the schema — this is the expected result when "Automatically expose new tables" is off.' };
      }
      return { ok:false, stage:'query', message: error.message + (code ? ' [' + code + ']' : '') };
    }
  } catch(e){
    return { ok:false, stage:'query', message: e.message };
  }
  return { ok:true, stage:'done',
    message:'Connected. Auth responds, the projects table exists, and the API can read it. Nothing is syncing yet — that is the next piece of work.' };
}

/* =========================================================
   AUTH — optional by design
   =========================================================
   Signing in is never required. Every tool works exactly the same
   signed out, storing to local storage as it always has. An account
   only adds the ability to sync later, so nothing here may ever block
   the app from rendering — including when supabase-js fails to load,
   which is the normal case offline.
========================================================= */
function authAvailable(){ return supabaseReady(); }
function signedIn(){ return !!state.authUser; }

/* Supabase returns terse, developer-facing errors. These are the ones a
   person actually hits, rewritten to say what to do next. */
function friendlyAuthError(err){
  const m = (err && err.message ? err.message : String(err || '')).toLowerCase();
  if(m.includes('invalid login credentials'))   return 'That email and password do not match an account.';
  if(m.includes('email not confirmed'))         return 'Check your email and click the confirmation link, then sign in.';
  if(m.includes('user already registered') ||
     m.includes('already been registered'))     return 'There is already an account with that email. Try signing in instead.';
  if(m.includes('password should be at least')) return 'Passwords need to be at least 6 characters.';
  if(m.includes('unable to validate email') ||
     m.includes('invalid email'))               return 'That does not look like a valid email address.';
  if(m.includes('rate limit') || m.includes('too many'))
                                                return 'Too many attempts. Wait a minute and try again.';
  if(m.includes('failed to fetch') || m.includes('networkerror'))
                                                return 'Could not reach the server. Check your connection.';
  return err && err.message ? err.message : 'Something went wrong. Try again.';
}

async function initAuth(){
  state.authChecking = false;
  if(!authAvailable()) return;          // offline or CDN blocked — stay local
  try{
    const sb = sbClient();
    const { data } = await sb.auth.getSession();
    state.authUser = (data && data.session) ? data.session.user : null;
    // Fires on sign-in, sign-out, token refresh, and on the redirect back
    // from a password-reset email.
    sb.auth.onAuthStateChange((event, session)=>{
      state.authUser = session ? session.user : null;
      if(event === 'PASSWORD_RECOVERY'){
        state.atSettings = true;
        state.settingsPage = 'account';
        state.authMode = 'newPassword';
      }
      render();
    });
  } catch(e){
    // An auth failure must never stop the app loading.
    state.authUser = null;
  }
}

async function signUpWithEmail(email, password, displayName){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Accounts need an internet connection.' };
  try{
    const { data, error } = await sb.auth.signUp({
      email: email.trim(),
      password,
      options: { data: { display_name: (displayName||'').trim() } }
    });
    if(error) return { ok:false, message: friendlyAuthError(error) };
    // With email confirmation on (the Supabase default) there is no session
    // yet — the account exists but is unverified.
    if(!data.session){
      return { ok:true, needsConfirm:true,
        message:'Account created. Check ' + esc(email.trim()) + ' for a confirmation link, then sign in.' };
    }
    state.authUser = data.user;
    return { ok:true, message:'Signed in.' };
  } catch(e){ return { ok:false, message: friendlyAuthError(e) }; }
}

/* =========================================================
   PROJECT SYNC — explicit, one table
   =========================================================
   Deliberately manual. Automatic background sync is what people expect,
   but it is also where offline edits, conflicts and lost work live; an
   explicit action is honest about when data moves and is far safer to
   ship. Only the project LIST syncs at this stage — scripts, shot lists
   and everything else still live on the device.
========================================================= */
function localProjectToRow(proj, ownerId){
  return {
    id: proj.id,
    owner_id: ownerId,
    name: proj.name || 'Untitled Project',
    type: proj.type || 'narrative',
    subtype: proj.subtype || null,
    creator_role: (projectHats(proj)[0] || 'solo'),
    hats: projectHats(proj),
    is_series: proj.subtype === 'series',
    guided_mode: !!proj.guidedMode,
    custom_tabs: proj.customTabs || null,
    share_code: proj.code || null
  };
}
function rowToLocalProject(row){
  return {
    id: row.id,
    name: row.name,
    type: row.type,
    subtype: row.subtype || null,
    role: row.creator_role || 'solo',
    hats: Array.isArray(row.hats) && row.hats.length ? row.hats : [row.creator_role || 'solo'],
    customTabs: row.custom_tabs || null,
    guidedMode: !!row.guided_mode,
    createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now(),
    shared: false,
    code: row.share_code || undefined
  };
}

/* Every project write goes through the database function. Doing it from
   the client meant satisfying an insert policy and two update policies at
   once, and any failure reported the same unhelpful message without
   saying which. */
async function saveProjectRow(row){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'No connection.' };
  const { data, error } = await sb.rpc('upsert_owned_project', { p: row });
  if(error){
    const msg = error.message || String(error);
    if(/function .*upsert_owned_project/i.test(msg)){
      return { ok:false, message:'The database is missing migration 006 — run it, then try again.' };
    }
    return { ok:false, message: msg };
  }
  if(!data || data.ok === false) return { ok:false, message:(data && data.message) || 'The write was refused.' };
  return { ok:true };
}

async function pushProjectsToCloud(){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Backing up needs an internet connection.' };
  if(!signedIn()) return { ok:false, message:'Sign in first — a backup has to belong to an account.' };
  const ownerId = state.authUser.id;
  const rows = state.projects.filter(p=>!p.shared).map(p=>localProjectToRow(p, ownerId));
  if(!rows.length) return { ok:false, message:'There are no projects on this device to back up.' };

  for(const row of rows){
    const r = await saveProjectRow(row);
    if(!r.ok) return { ok:false, message:'Could not save "' + row.name + '": ' + r.message };
  }
  return { ok:true, count:rows.length,
    message:'Backed up ' + rows.length + ' project' + (rows.length!==1?'s':'') + ' to your account.' };
}

async function fetchCloudProjects(){
  const sb = sbClient();
  if(!sb || !signedIn()) return { ok:false, rows:[] };
  const { data, error } = await sb.from('projects')
    .select('*').is('deleted_at', null).order('created_at', { ascending:false });
  if(error) return { ok:false, rows:[], message:error.message };
  return { ok:true, rows:data || [] };
}

/* Pull is additive on purpose: it only brings down projects this device
   has never seen. Nothing local is overwritten, so a stale copy in the
   account can never eat newer work sitting in front of you. */
async function pullProjectsFromCloud(){
  const res = await fetchCloudProjects();
  if(!res.ok) return { ok:false, message: res.message || 'Could not reach your account.' };
  const localIds = new Set(state.projects.map(p=>p.id));
  const incoming = res.rows.filter(r=>!localIds.has(r.id));
  if(!incoming.length){
    return { ok:true, count:0, message:'Nothing new — every project in your account is already on this device.' };
  }
  const room = MAX_PROJECTS - state.projects.length;
  const toAdd = incoming.slice(0, Math.max(0, room));
  for(const row of toAdd){
    const proj = rowToLocalProject(row);
    state.projects.push(proj);
    // The row carries the project's identity, not its contents — scripts and
    // the rest are not synced yet, so it arrives as an empty shell.
    await storeSet(dataKeyFor(proj), normalizeProjectData(emptyProjectData()), false);
  }
  await storeSet('projects', state.projects, false);
  const skipped = incoming.length - toAdd.length;
  return { ok:true, count:toAdd.length,
    message:'Added ' + toAdd.length + ' project' + (toAdd.length!==1?'s':'') + ' from your account.'
      + (skipped ? ' ' + skipped + ' skipped — this device is at the ' + MAX_PROJECTS + '-project limit.' : '')
      + ' Only names and settings came down; the contents are still on whichever device made them.' };
}

/* =========================================================
   SECTION SYNC
   =========================================================
   Each tool syncs as its own row. Two people on different tools never
   collide; a conflict is only possible when both edit the same tool, and
   even then only that tool is at risk rather than the whole project.

   Scalars that belong to no particular tool are grouped into a 'meta'
   section so nothing is left behind.
========================================================= */
const SYNC_SECTIONS = [
  'scripts','breakdown','shotlists','storyboards','lighting','cameraReports',
  'brollEntries','continuity','shootDays','callsheets','contacts','locations',
  'budgets','docs','notes','tasks','sides','episodes','directorNotes',
  'moodboard','ideas','trash'
];
const META_FIELDS = ['currentScriptId','idsAreUuid','meta','recent'];

function sectionPayload(pd, key){
  if(key === 'meta'){
    const out = {};
    META_FIELDS.forEach(f=>{ if(pd[f] !== undefined) out[f] = pd[f]; });
    return out;
  }
  return pd[key] !== undefined ? pd[key] : (Array.isArray(pd[key]) ? [] : null);
}
function applySection(pd, key, data){
  if(key === 'meta'){
    if(data && typeof data === 'object') Object.assign(pd, data);
    return;
  }
  pd[key] = data;
}
/* What the server said when we last synced each section, so a conflict
   can be spotted. Kept per project, alongside the project data. */
function syncMetaKey(projId){ return 'sync-meta-' + projId; }
async function loadSyncMeta(projId){ return (await storeGet(syncMetaKey(projId), false)) || {}; }
async function saveSyncMeta(projId, meta){ await storeSet(syncMetaKey(projId), meta, false); }

/* Cheap content hash. Pushing every section on every sync is both slow
   and actively misleading: it can report a conflict on a tool you never
   opened, just because someone else changed it. Comparing a hash against
   the one stored at last sync means only genuinely edited sections go up. */
function hashString(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return String(h);
}
function sectionHash(payload){
  try { return hashString(JSON.stringify(payload)); } catch(e){ return String(Date.now()); }
}
async function pushSections(proj, opts){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Syncing needs an internet connection.' };
  if(!signedIn()) return { ok:false, message:'Sign in to sync this project.' };
  const force = !!(opts && opts.force);
  const only  = opts && opts.only;

  const pd = state.projectData;
  const meta = await loadSyncMeta(proj.id);
  const keys = only ? [only] : SYNC_SECTIONS.concat('meta');
  let pushed = 0;
  const conflicts = [];

  let skipped = 0;
  for(const key of keys){
    const payload = sectionPayload(pd, key);
    if(payload === null || payload === undefined) continue;
    const h = sectionHash(payload);
    // Unchanged since the last successful sync — leave it alone.
    if(!force && !only && meta['hash:' + key] === h){ skipped++; continue; }
    const fn = force ? 'force_save_project_section' : 'save_project_section';
    const args = force
      ? { p_project_id:proj.id, p_section_key:key, p_data:payload }
      : { p_project_id:proj.id, p_section_key:key, p_data:payload, p_expected: meta[key] || null };
    const { data, error } = await sb.rpc(fn, args);
    if(error) return { ok:false, message:'Sync failed on ' + key + ': ' + error.message, conflicts };
    if(data && data.ok === false && data.conflict){
      conflicts.push({ key, serverUpdatedAt: data.server_updated_at });
      continue;
    }
    if(data && data.updated_at) meta[key] = data.updated_at;
    meta['hash:' + key] = h;
    pushed++;
  }
  await saveSyncMeta(proj.id, meta);

  if(conflicts.length){
    return { ok:false, conflicts, pushed,
      message: conflicts.length + ' section' + (conflicts.length!==1?'s were':' was')
        + ' changed by someone else since you last synced: '
        + conflicts.map(c=>sectionLabel(c.key)).join(', ')
        + '. Pull first to get their changes, or overwrite to keep yours.' };
  }
  if(!pushed && skipped) return { ok:true, pushed:0, message:'Everything was already up to date.' };
  return { ok:true, pushed,
    message:'Sent up ' + pushed + ' change' + (pushed!==1?'s':'')
      + (skipped ? ' (' + skipped + ' already up to date)' : '') + '.' };
}

async function pullSections(proj){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Syncing needs an internet connection.' };
  if(!signedIn()) return { ok:false, message:'Sign in to sync this project.' };

  const { data, error } = await sb.from('project_sections')
    .select('section_key, data, updated_at')
    .eq('project_id', proj.id);
  if(error) return { ok:false, message:'Could not read this project: ' + error.message };
  if(!data || !data.length) return { ok:true, applied:0, message:'Nothing stored for this project yet.' };

  const meta = await loadSyncMeta(proj.id);
  const pd = state.projectData;
  let applied = 0;
  data.forEach(row=>{
    applySection(pd, row.section_key, row.data);
    meta[row.section_key] = row.updated_at;
    meta['hash:' + row.section_key] = sectionHash(row.data);
    applied++;
  });
  normalizeProjectData(pd);
  await saveProjectData();
  await saveSyncMeta(proj.id, meta);
  return { ok:true, applied,
    message:'Pulled ' + applied + ' section' + (applied!==1?'s':'') + ' from your account.' };
}

function sectionLabel(key){
  const map = {
    scripts:'Script', breakdown:'Breakdown', shotlists:'Shot Lists', storyboards:'Storyboards',
    lighting:'Lighting', cameraReports:'Camera Reports', brollEntries:'B-Roll',
    continuity:'Continuity', shootDays:'Schedule', callsheets:'Call Sheets',
    contacts:'Cast & Crew', locations:'Locations', budgets:'Budget', docs:'Docs',
    notes:'Notes', tasks:'Tasks', sides:'Sides', episodes:'Episodes',
    directorNotes:"Director's Notes", moodboard:'Moodboard', ideas:'Idea Bank',
    trash:'Recycle Bin', meta:'Settings'
  };
  return map[key] || key;
}

/* Generates a share code for a cloud project. Note what it does NOT do:
   it never touches the project's id. The old local sharing flow replaced
   the id with the code, which breaks every sync reference and is why that
   flow is now disabled for signed-in users. */
async function shareProjectToCloud(proj){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Sharing needs an internet connection.' };
  if(!signedIn()) return { ok:false, message:'Sign in first — a shared project belongs to an account.' };

  // The code is only written to the local project AFTER the server has
  // accepted it. Setting it first meant a failed share still displayed a
  // code, so it looked like it had worked when nothing had been saved.
  const code = proj.code || genCode();
  const row = { ...localProjectToRow(proj, state.authUser.id), share_code: code };

  // One function handles the project row AND the owner's membership, so
  // they can never end up half-done. It also reports the real database
  // error rather than a bare "violates row-level security policy".
  const r = await saveProjectRow(row);
  if(!r.ok) return { ok:false, message:'Could not share: ' + r.message };

  // Read it back rather than trusting the write.
  const { data: check } = await sb.from('projects')
    .select('share_code').eq('id', proj.id).maybeSingle();
  if(!check || check.share_code !== code){
    return { ok:false,
      message:'The share code did not save. Run the latest migration, then try again.' };
  }

  proj.code = code;
  await storeSet('projects', state.projects, false);
  const pushed = await pushSections(proj);
  return { ok:true, code,
    message:'Share code: ' + code + '. ' + (pushed.ok ? 'Current version sent up.' : pushed.message) };
}

async function setProjectShareCode(proj, code){

    { p_project_id:proj.id, p_code:code });

  proj.code = code || undefined;

}
function myPermissionOn(members){
  if(!state.authUser) return null;
  const me = (members || []).find(m=>m.user_id === state.authUser.id);
  return me ? me.permission : null;
}

async function joinProjectByCode(code){
  const sb = sbClient();
  if(!sb) return { ok:false, message:'Joining needs an internet connection.' };
  if(!signedIn()) return { ok:false, message:'Sign in before joining a project.' };
  const { data, error } = await sb.rpc('join_project_by_code', { p_code: code });
  if(error) return { ok:false, message: error.message };
  if(!data || data.ok === false) return { ok:false, message:(data && data.message) || 'Could not join.' };

  if(state.projects.some(p=>p.id === data.project_id)){
    return { ok:true, already:true, message:'You are already on "' + data.name + '".' };
  }
  if(state.projects.length >= MAX_PROJECTS){
    return { ok:false, message:'This device is at the ' + MAX_PROJECTS + '-project limit. Remove one first.' };
  }
  const res = await fetchCloudProjects();
  const row = res.ok ? res.rows.find(r=>r.id === data.project_id) : null;
  const proj = row ? rowToLocalProject(row)
                   : { id:data.project_id, name:data.name, type:'narrative', hats:['solo'],
                       createdAt:Date.now(), shared:false };
  state.projects.push(proj);
  await storeSet(dataKeyFor(proj), normalizeProjectData(emptyProjectData()), false);
  await storeSet('projects', state.projects, false);
  return { ok:true, projectId:data.project_id, name:data.name,
    message:'Joined "' + data.name + '". Open it and pull to get the current version.' };
}

/* =========================================================
   NOTIFICATION PREFERENCES
   =========================================================
   Modelled per-event rather than as one on/off switch, because that's
   the shape a backend will need to read later: which person wants to be
   told about which thing.

   `local:true` events can fire today from the browser's Notification
   API while the app is open. `local:false` events describe things OTHER
   people did — the app can't know about those without a server, so they
   are shown but disabled rather than pretending to work.
========================================================= */
const NOTIFY_EVENTS = {
  deadlineToday:      { label:'Deadlines due today',   desc:'Call sheets, shoot days, and tasks dated today.', local:true },
  shootDayTomorrow:   { label:'Shoot day tomorrow',    desc:'A heads-up the day before you shoot.',            local:true },
  taskDue:            { label:'Tasks coming due',      desc:'Tasks assigned to you as their date arrives.',    local:true },
  directorNote:       { label:"New director's notes",  desc:'When a collaborator adds a note to a shared project.', local:true },
  scheduleChanged:    { label:'Schedule changes',      desc:'When someone moves a scene or changes a shoot day.',   local:false },
  callSheetPublished: { label:'Call sheet published',  desc:'When a call sheet is finalised and sent out.',         local:false },
  collaboratorJoined: { label:'Collaborator activity', desc:'When someone joins, leaves, or changes permissions.',  local:false }
};
function defaultNotifyPrefs(){
  const p = {};
  Object.keys(NOTIFY_EVENTS).forEach(k=>{ p[k] = false; });
  return p;
}
function notifyEnabled(key){
  return !!(state.notifyPrefs && state.notifyPrefs[key]) &&
         ('Notification' in window) && Notification.permission === 'granted';
}
async function saveNotifyPrefs(){
  await storeSet('notify-prefs', state.notifyPrefs, false);
}
/* Turning any event on needs permission once; after that each event is
   just a flag. Kept separate so the permission prompt isn't re-fired. */
async function setNotifyPref(key, on){
  if(on){
    if(!('Notification' in window)){
      await openAlertModal('Not supported', 'This browser does not support notifications.');
      return false;
    }
    if(Notification.permission !== 'granted'){
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){
        await openAlertModal('Permission needed',
          "Notifications need your browser's permission. You can allow it now, or later in your browser's site settings.");
        return false;
      }
    }
  }
  state.notifyPrefs[key] = !!on;
  // Keep the legacy flags in step so nothing that still reads them breaks.
  if(key === 'deadlineToday'){ state.remindersEnabled = !!on; await storeSet('reminders-enabled', !!on, false); }
  if(key === 'directorNote'){ state.directorNoteAlertsEnabled = !!on; await storeSet('director-note-alerts', !!on, false); }
  await saveNotifyPrefs();
  return true;
}

/* =========================================================
   IN-APP REMINDERS — uses the browser's real Notification API.
   These only fire while the app is open; they are not push
   notifications and won't arrive if the app/tab is closed.
========================================================= */
async function toggleReminders(enable){
  if(enable){
    if(!('Notification' in window)){
      await openAlertModal('Not supported', 'This browser does not support notifications.');
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      await openAlertModal('Permission needed', "Reminders need notification permission — you'll need to allow notifications for this to work, either now or in your browser's site settings.");
      state.remindersEnabled = false;
      await storeSet('reminders-enabled', false, false);
      return;
    }
  }
  state.remindersEnabled = enable;
  await storeSet('reminders-enabled', enable, false);
}
function checkAndFireReminders(){
  const proj = currentProject();
  if(!proj) return;
  const todayISO = new Date().toISOString().slice(0,10);

  // Shoot day tomorrow — its own event, so it can be wanted separately
  // from the general "due today" firehose.
  if(notifyEnabled('shootDayTomorrow')){
    const tmr = new Date(Date.now() + 86400000).toISOString().slice(0,10);
    (state.projectData.shootDays || []).filter(d=>d.date===tmr).forEach(d=>{
      const key = proj.id+'-tmr-'+d.id;
      if(state.notifiedThisSession.has(key)) return;
      state.notifiedThisSession.add(key);
      try{ new Notification('Shoot day tomorrow', { body: `${d.label} on "${proj.name}".`, tag: key }); }catch(e){}
    });
  }
  if(!notifyEnabled('deadlineToday')) return;
  projectDeadlines().filter(d=>d.date===todayISO).forEach(d=>{
    const key = proj.id+'-'+d.uid;
    if(state.notifiedThisSession.has(key)) return;
    state.notifiedThisSession.add(key);
    try{
      new Notification(d.title, { body: `Due today, in "${proj.name}". ${d.description||''}`.trim(), tag: key });
    }catch(e){}
  });
}
/* Alerts for new Director's Notes from other collaborators. Same limits as
   reminders above: only fires while the app is open and happens to check —
   this is not real-time push, it's a courtesy check on load. */
async function toggleDirectorNoteAlerts(enable){
  if(enable){
    if(!('Notification' in window)){
      await openAlertModal('Not supported', 'This browser does not support notifications.');
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      await openAlertModal('Permission needed', "This needs notification permission — you'll need to allow notifications for this to work, either now or in your browser's site settings.");
      state.directorNoteAlertsEnabled = false;
      await storeSet('director-note-alerts', false, false);
      return;
    }
  }
  state.directorNoteAlertsEnabled = enable;
  await storeSet('director-note-alerts', enable, false);
}
async function checkAndFireDirectorNoteAlerts(){
  if(!notifyEnabled('directorNote')) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const proj = currentProject();
  if(!proj || !proj.shared) return;
  const lastSeen = (await storeGet('dirnotes-lastseen-'+proj.id, false)) || 0;
  const newOnes = state.projectData.directorNotes.filter(n=>n.createdAt > lastSeen && n.authorName && n.authorName !== state.profile.name);
  newOnes.forEach(n=>{
    const key = proj.id+'-dirnote-'+n.id;
    if(state.notifiedThisSession.has(key)) return;
    state.notifiedThisSession.add(key);
    try{
      new Notification("New Director's Note", {
        body: `${n.authorName}: ${(DIRECTOR_NOTE_KINDS[n.kind]||{}).label||''} — ${(n.text||'').slice(0,80)}`.trim(),
        tag: key
      });
    }catch(e){}
  });
}

async function resetAllData(){
  const ok = await openConfirmModal('Reset all data?', 'This permanently deletes every project and all local settings on this device. This cannot be undone.', 'Continue');
