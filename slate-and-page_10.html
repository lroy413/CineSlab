  const ok2 = await openConfirmModal('Are you absolutely sure?', 'There is no way to undo this. All projects, images, and preferences will be erased.', 'Yes, delete everything');
  if(!ok2) return;
  for(const p of state.projects){
    await storeDelete(dataKeyFor(p), !!p.shared);
    await storeDelete(imagesKeyFor(p), !!p.shared);
    await storeDelete('dirnotes-lastseen-'+p.id, false);
  }

  await storeDelete('app-theme', false);
  await storeDelete('app-mode', false);

  state.fontSize = 'medium';

  state.settingsPage = null;
  state.atHome = true;
  render();
}

  weather: {
    content: (proj) => `
      <div class="paper" style="margin-top:0;">
        <div class="settings-row">
          <div><div class="card-title" style="font-size:14px;">Show Weather on Today</div><div class="card-sub">A small forecast card on the Dashboard — useful for planning outdoor shoots.</div></div>
          <div class="theme-toggle" id="weatherToggle">
            <span class="tt-opt ${!state.weatherEnabled?'active':''}" data-weather-choice="off">Off</span>
            <span class="tt-opt ${state.weatherEnabled?'active':''}" data-weather-choice="on">On</span>
          </div>
        </div>
        <div class="settings-row">
          <div>
            <div class="card-title" style="font-size:14px;">Location</div>
            <div class="card-sub">${state.weatherLocation ? 'Currently: '+esc(state.weatherLocation.label) : 'Not set yet.'} Uses free public weather services — see the Privacy page for details.</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
          <button class="btn btn-outline btn-sm" id="useMyLocationBtn">${UI_ICONS.pin} Use My Location</button>
          <input type="text" id="weatherZipInput" placeholder="ZIP code" style="width:110px;border:1px solid var(--line);border-radius:var(--radius-input);padding:8px 10px;background:var(--surface);color:var(--ink);font-size:13px;">
          <button class="btn btn-outline btn-sm" id="setZipBtn">Set ZIP</button>
        </div>
        <div class="settings-row" style="margin-top:14px;align-items:flex-start;">
          <div>
            <div class="card-title" style="font-size:14px;">Enter coordinates manually</div>
            <div class="card-sub">ZIP lookup and weather need an internet connection, and some environments block those requests. Coordinates need no connection at all — and sunrise, sunset, golden hour and moon phase are calculated on your device, so they keep working offline.<br><br>To find them: open Google Maps, right-click the spot, and the first item in the menu is the latitude and longitude. Tap it to copy.</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
          <input type="text" id="latInput" placeholder="Latitude" value="${state.weatherLocation && typeof state.weatherLocation.lat==='number' ? state.weatherLocation.lat : ''}" style="width:110px;border:1px solid var(--line);border-radius:var(--radius-input);padding:8px 10px;background:var(--surface);color:var(--ink);font-size:13px;">
          <input type="text" id="lonInput" placeholder="Longitude" value="${state.weatherLocation && typeof state.weatherLocation.lon==='number' ? state.weatherLocation.lon : ''}" style="width:110px;border:1px solid var(--line);border-radius:var(--radius-input);padding:8px 10px;background:var(--surface);color:var(--ink);font-size:13px;">
          <input type="text" id="coordLabelInput" placeholder="Label (optional)" style="width:150px;border:1px solid var(--line);border-radius:var(--radius-input);padding:8px 10px;background:var(--surface);color:var(--ink);font-size:13px;">
          <button class="btn btn-outline btn-sm" id="setCoordsBtn">Set Coordinates</button>
        </div>
        <div class="settings-row" style="margin-top:10px;">
          <div><div class="card-title" style="font-size:14px;">Units</div><div class="card-sub">Temperature display.</div></div>
          <div class="theme-toggle" id="weatherUnitToggle">
            <span class="tt-opt ${state.weatherUnit==='F'?'active':''}" data-unit-choice="F">°F</span>
            <span class="tt-opt ${state.weatherUnit==='C'?'active':''}" data-unit-choice="C">°C</span>
          </div>
        </div>
      </div>
    `,
    wire: (app)=>{
      document.querySelectorAll('#weatherToggle .tt-opt').forEach(el=>{
        el.onclick = async ()=>{ state.weatherEnabled = el.dataset.weatherChoice === 'on'; await storeSet('weather-enabled', state.weatherEnabled, false); renderSettingsScreen(app); };
      });
      document.querySelectorAll('#weatherUnitToggle .tt-opt').forEach(el=>{
        el.onclick = async ()=>{ state.weatherUnit = el.dataset.unitChoice; state.weatherCache = null; await storeSet('weather-unit', state.weatherUnit, false); renderSettingsScreen(app); };
      });
      document.getElementById('useMyLocationBtn').onclick = async (e)=>{
        const btn = e.target;
        btn.textContent = 'Requesting…'; btn.disabled = true;
        try{
          await getDeviceLocation();
          state.weatherLocation = { type:'geo', label:'Your location' };
          state.weatherCache = null;
          await storeSet('weather-location', state.weatherLocation, false);
          renderSettingsScreen(app);
        }catch(err){
          await openAlertModal('Location unavailable', "Couldn't get your location — check that location permission is allowed for this site in your browser settings, then try again.");
          btn.innerHTML = UI_ICONS.pin + ' Use My Location'; btn.disabled = false;
        }
      };
      document.getElementById('setCoordsBtn').onclick = async ()=>{
        const latRaw = document.getElementById('latInput').value.trim();
        const lonRaw = document.getElementById('lonInput').value.trim();
        const label  = document.getElementById('coordLabelInput').value.trim();
        const lat = parseFloat(latRaw); let lon = parseFloat(lonRaw);
        // Validate hard: a silently wrong coordinate produces confidently
        // wrong sun times, which is worse than no sun times at all.
        if(!latRaw || !lonRaw || isNaN(lat) || isNaN(lon)){
          await openAlertModal('Enter both numbers', 'Latitude and longitude both need to be numbers, for example 38.15 and -92.62.');
          return;
        }
        if(lat < -90 || lat > 90){
          await openAlertModal('Latitude out of range', 'Latitude runs from -90 to 90. Values north of the equator are positive.');
          return;
        }
        if(lon < -180 || lon > 180){
          await openAlertModal('Longitude out of range', 'Longitude runs from -180 to 180. Locations west of Greenwich — including all of the Americas — are negative.');
          return;
        }
        // A dropped minus sign is the single most likely mistake here, and
        // it fails silently: the maths are still valid, they just describe
        // the wrong hemisphere. Cross-check against the device's own time
        // zone, which implies roughly where in the world this device is.
        const tzImpliedLon = -new Date().getTimezoneOffset() / 4;   // 15° per hour
        if(Math.abs(lon - tzImpliedLon) > 60){
          const flipped = -lon;
          const flippedIsCloser = Math.abs(flipped - tzImpliedLon) < Math.abs(lon - tzImpliedLon);
          if(flippedIsCloser){
            // Don't just warn — the sign is almost certainly the problem,
            // and a warning that makes you retype it is a warning most
            // people click through. Offer the fix directly.
            const useFixed = await openConfirmModal(
              `Use ${flipped} instead?`,
              `Longitude ${lon} is on the opposite side of the world from this device's time zone. Places in the Americas have a negative longitude — ${flipped} is almost certainly what you meant.\n\nGetting this backwards flips sunrise and sunset by about twelve hours.`,
              `Use ${flipped}`
            );
            if(useFixed){ lon = flipped; }
          } else {
            const ok = await openConfirmModal(
              'That location looks far away',
              `A longitude of ${lon} is a long way from this device's time zone. That is fine if you are planning a shoot elsewhere — sun times will be calculated for that place.\n\nUse it?`,
              'Use it anyway'
            );
            if(!ok) return;
          }
        }
        state.weatherLocation = { type:'zip', lat, lon, label: label || `${lat.toFixed(4)}, ${lon.toFixed(4)}` };
        state.weatherCache = null;
        await storeSet('weather-location', state.weatherLocation, false);
        renderSettingsScreen(app);
      };
      document.getElementById('setZipBtn').onclick = async ()=>{
        const zip = document.getElementById('weatherZipInput').value.trim();
        if(!zip){ return; }
        const btn = document.getElementById('setZipBtn');
        btn.textContent = 'Looking up…'; btn.disabled = true;
        try{
          const loc = await lookupZipLocation(zip);
          state.weatherLocation = { type:'zip', zip, lat:loc.lat, lon:loc.lon, label:loc.label };
          state.weatherCache = null;
          await storeSet('weather-location', state.weatherLocation, false);
          renderSettingsScreen(app);
        }catch(err){
          if(err.kind === 'network'){
            await openAlertModal('Could not reach the ZIP lookup service', "That request didn't go through. ZIP lookup needs an internet connection, and some environments — including previewing this app inside another app — block outside requests entirely.\n\nUse the \"Enter coordinates manually\" option just below instead. It needs no connection, and sunrise, sunset, golden hour and moon phase are all calculated on your device.");
          } else {
            await openAlertModal('ZIP not found', `No U.S. ZIP code "${zip}" was found. Double-check it and try again — only 5-digit U.S. ZIP codes are supported right now.`);
          }
          btn.textContent = 'Set ZIP'; btn.disabled = false;
        }
      };
    }
  },

  privacy: {
    content: () => `
      <div class="paper" style="margin-top:0;line-height:1.6;font-size:13px;color:var(--ink);">
        <p><b>What this app stores.</b> Everything you enter — scripts, shot lists, call sheets, budgets, contacts, notes, reference photos, and your Profile info — is your production data. Nothing is collected beyond what you type or upload yourself.</p>
        <p><b>Where it's stored.</b> This app has no server or database of its own. All data is stored through Claude's own platform storage, scoped privately to your Claude account — the same reason nothing here has ever needed a separate sign-in. There is no "${APP_NAME}" company or backend receiving, logging, or reading your data.</p>
        <p><b>Sharing.</b> Nothing leaves your private storage unless you explicitly turn a project into a shared project. Doing so gives it an invite code (and optional password) — anyone with that code can access that project's data. Private projects are never shared automatically.</p>
        <p><b>Third-party code.</b> This app loads a few JavaScript libraries from a public CDN (cdnjs.cloudflare.com) to build PDFs and read certain file types. They run entirely in your browser and never transmit your project data anywhere.</p>
        <p><b>Weather.</b> If you turn on the Weather card, your location is used to fetch a forecast — either your device's GPS location (only requested if you tap "Use My Location," through your browser's own location permission) or a ZIP code you type in. That location is sent directly from your browser to two free, keyless weather services — Open-Meteo (forecast data) and, for ZIP lookups, Zippopotam.us — neither of which requires an account or uses cookies or tracking, by their own published policies. Your saved location and unit preference are stored the same way as your other settings; your project data is never included in these requests.</p>
        <p><b>No analytics or tracking.</b> This app itself contains no analytics, advertising, or usage tracking of any kind. Nobody is notified when you open the app or use a feature.</p>
        <p><b>Notifications.</b> In-app reminders and collaborator alerts use your browser's own notification permission and a local check — no data leaves your device to power them.</p>
        <p><b>Your control.</b> You can export everything (Data &amp; Storage → Export All Data) or permanently erase it (Reset All Data) at any time. Turning off Weather or clearing your location removes it from what this app uses going forward.</p>
        <p class="modal-note" style="margin-top:12px;">This is a good-faith, plain-language summary of how the app actually works, not a lawyer-drafted legal document. If you need a formal privacy policy — for example, to publish this app publicly — have it reviewed by a lawyer first.</p>
      </div>
    `,
    wire: ()=>{}
  },

            <div class="sync-box">

              </p>
              <div class="auth-form">
                <input type="text" id="joinCode" placeholder="e.g. K7P2QM" style="text-transform:uppercase;">
                <button class="btn btn-outline btn-sm" id="joinBtn" style="margin-top:8px;" ${state.syncBusy?'disabled':''}>

                </button>

              ${state.joinMsg ? `<div class="auth-msg ${state.joinMsg.ok?'ok':'bad'}">${esc(state.joinMsg.text)}</div>` : ''}

          </p>
          <div class="subtabs" id="authTabs" style="margin-bottom:14px;">

          </div>

            ${mode==='signUp' ? `
              <label>Your name</label>
              <input type="text" id="authName" autocomplete="name" placeholder="How you'll show up to collaborators">` : ''}
            <label>Email</label>
            <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
            ${mode!=='reset' ? `
              <label>Password</label>
              <input type="password" id="authPw" autocomplete="${mode==='signUp'?'new-password':'current-password'}" placeholder="${mode==='signUp'?'At least 6 characters':''}">` : ''}
            <button class="btn btn-tape btn-sm" id="authSubmit" style="margin-top:10px;" ${state.authBusy?'disabled':''}>
              ${state.authBusy ? 'Working…' : (mode==='signUp' ? 'Create account' : mode==='reset' ? 'Send reset link' : 'Sign in')}
            </button>
            ${mode==='signIn' ? `<button class="rail-quickmenu-link" id="authForgot" style="padding:6px 0 0;">Forgot password?</button>` : ''}
            ${mode==='reset'  ? `<button class="rail-quickmenu-link" id="authBackToSignIn" style="padding:6px 0 0;">Back to sign in</button>` : ''}
          </div>
          ${state.authMsg ? `<div class="auth-msg ${state.authMsg.ok?'ok':'bad'}">${esc(state.authMsg.text)}</div>` : ''}
        </div>`;
      })()}
      <div class="section-title">Backend Connection</div>
      <div class="paper">
        <p class="card-sub" style="margin:0 0 12px;line-height:1.5;">
          A diagnostic for setup only. Your projects are still stored locally and nothing syncs —
          this just proves the database is reachable and correctly configured before any sync
          code is written.
        </p>
        <div class="sb-status" id="sbStatus">
          <span class="sb-dot ${supabaseReady() ? 'sb-dot-idle' : 'sb-dot-off'}"></span>
          <span>${supabaseReady()
            ? 'Configured — not tested yet'
            : (typeof window.supabase === 'undefined'
                ? 'Supabase library did not load (CDN blocked, or you are offline)'
                : 'No project URL or key set')}</span>
        </div>
        <button class="btn btn-outline btn-sm" id="sbTestBtn" ${supabaseReady()?'':'disabled'}>Test connection</button>
      </div>
    `,
    wire: (app)=>{
      const redraw = ()=>renderSettingsScreen(app);
      const val = (id)=>{ const el = document.getElementById(id); return el ? el.value : ''; };

      document.querySelectorAll('#authTabs .subtab').forEach(t=>{
        t.onclick = ()=>{ state.authMode = t.dataset.authtab; state.authMsg = null; redraw(); };
      });
      const forgot = document.getElementById('authForgot');
      if(forgot) forgot.onclick = ()=>{ state.authMode = 'reset'; state.authMsg = null; redraw(); };
      const back = document.getElementById('authBackToSignIn');
      if(back) back.onclick = ()=>{ state.authMode = 'signIn'; state.authMsg = null; redraw(); };

      const submit = document.getElementById('authSubmit');
      if(submit) submit.onclick = async ()=>{
        const email = val('authEmail'), pw = val('authPw'), name = val('authName');
        if(!email){ state.authMsg = {ok:false, text:'Enter your email.'}; return redraw(); }
        if(state.authMode !== 'reset' && !pw){ state.authMsg = {ok:false, text:'Enter your password.'}; return redraw(); }
        state.authBusy = true; state.authMsg = null; redraw();
        let r;
        if(state.authMode === 'signUp')      r = await signUpWithEmail(email, pw, name);
        else if(state.authMode === 'reset')  r = await sendPasswordReset(email);
        else                                 r = await signInWithEmail(email, pw);
        state.authBusy = false;
        state.authMsg = { ok: r.ok, text: r.message };
        // Land back on sign-in after a successful sign-up that needs confirming,
        // so the next thing they do is the right thing.
        if(r.ok && r.needsConfirm) state.authMode = 'signIn';
        redraw();
      };

      const push = document.getElementById('syncPush');
      if(push) push.onclick = async ()=>{
        state.syncBusy = 'push'; state.syncMsg = null; redraw();
        const r = await pushProjectsToCloud();
        state.syncBusy = null; state.syncMsg = { ok:r.ok, text:r.message };
        if(r.ok){ const c = await fetchCloudProjects(); state.cloudCount = c.ok ? c.rows.length : null; }
        redraw();
      };
      const pull = document.getElementById('syncPull');
      if(pull) pull.onclick = async ()=>{
        state.syncBusy = 'pull'; state.syncMsg = null; redraw();
        const r = await pullProjectsFromCloud();
        state.syncBusy = null; state.syncMsg = { ok:r.ok, text:r.message };
        const c = await fetchCloudProjects(); state.cloudCount = c.ok ? c.rows.length : null;
        redraw();
      };

      const loadMembers = document.getElementById('loadMembers');
      if(loadMembers) loadMembers.onclick = async ()=>{
        state.membersLoading = true; state.memberMsg = null; redraw();
        const r = await fetchProjectMembers(currentProject().id);
        state.membersLoading = false;
        state.members = r.ok ? r.members : [];
        state.myPerm = r.ok ? myPermissionOn(r.members) : null;
        if(!r.ok) state.memberMsg = { ok:false, text:r.message || 'Could not load the crew list.' };
        redraw();
      };
      document.querySelectorAll('[data-permfor]').forEach(sel=>{
        sel.onchange = async ()=>{
          state.memberMsg = null;
          const r = await setMemberPermission(currentProject().id, sel.dataset.permfor, sel.value);
          if(!r.ok) state.memberMsg = { ok:false, text:r.message };
          const f = await fetchProjectMembers(currentProject().id);
          state.members = f.ok ? f.members : state.members;
          state.myPerm = f.ok ? myPermissionOn(f.members) : state.myPerm;
          redraw();
        };
      });
      document.querySelectorAll('[data-removemember]').forEach(btn=>{
        btn.onclick = async ()=>{
          const m = (state.members||[]).find(x=>x.user_id === btn.dataset.removemember);
          const ok = await openConfirmModal('Remove ' + ((m && m.display_name) || 'this person') + '?',
            'They lose access to this project. Anything they already added stays.', 'Remove');
          if(!ok) return;
          const r = await removeProjectMember(currentProject().id, btn.dataset.removemember);
          state.memberMsg = r.ok ? { ok:true, text:'Removed.' } : { ok:false, text:r.message };
          const f = await fetchProjectMembers(currentProject().id);
          state.members = f.ok ? f.members : state.members;
          redraw();
        };
      });
      const revoke = document.getElementById('revokeCode');
      if(revoke) revoke.onclick = async ()=>{
        const ok = await openConfirmModal('Turn off this code?',
          'Nobody new will be able to join with it. People already on the project keep their access — remove them separately if you need to.',
          'Turn it off');
        if(!ok) return;
        const r = await setProjectShareCode(currentProject(), null);
        state.shareMsg = r.ok ? { ok:true, text:'Code turned off. Create a new one any time.' }
                              : { ok:false, text:r.message };
        redraw();
      };
      const shareBtn = document.getElementById('shareBtn');
      if(shareBtn) shareBtn.onclick = async ()=>{
        state.syncBusy = 'share'; state.shareMsg = null; redraw();
        const r = await shareProjectToCloud(currentProject());
        state.syncBusy = null; state.shareMsg = { ok:r.ok, text:r.message };
        redraw();
      };
      const secPush = document.getElementById('secPush');
      if(secPush) secPush.onclick = async ()=>{
        state.syncBusy = 'secPush'; state.secMsg = null; state.syncConflicts = null; redraw();
        const r = await pushSections(currentProject());
        state.syncBusy = null;
        state.syncConflicts = r.conflicts && r.conflicts.length ? r.conflicts : null;
        state.secMsg = { ok:r.ok, text:r.message };
        redraw();
      };
      const secPull = document.getElementById('secPull');
      if(secPull) secPull.onclick = async ()=>{
        state.syncBusy = 'secPull'; state.secMsg = null; redraw();
        const r = await pullSections(currentProject());
        state.syncBusy = null; state.syncConflicts = null;
        state.secMsg = { ok:r.ok, text:r.message };
        redraw();
      };
      const secForce = document.getElementById('secForce');
      if(secForce) secForce.onclick = async ()=>{
        const ok = await openConfirmModal('Overwrite their changes?',
          'Your version of those tools will replace what is stored. Whatever they changed is lost.',
          'Overwrite');
        if(!ok) return;
        state.syncBusy = 'secPush'; redraw();
        const r = await pushSections(currentProject(), { force:true });
        state.syncBusy = null; state.syncConflicts = null;
        state.secMsg = { ok:r.ok, text:r.message };
        redraw();
      };
      const joinBtn = document.getElementById('joinBtn');
      if(joinBtn) joinBtn.onclick = async ()=>{
        const el = document.getElementById('joinCode');
        const code = (el ? el.value : '').trim();
        if(!code){ state.joinMsg = {ok:false, text:'Enter a share code.'}; return redraw(); }
        state.syncBusy = 'join'; state.joinMsg = null; redraw();
        const r = await joinProjectByCode(code);
        state.syncBusy = null; state.joinMsg = { ok:r.ok, text:r.message };
        redraw();
      };

      const out = document.getElementById('authSignOut');
      if(out) out.onclick = async ()=>{
        const ok = await openConfirmModal('Sign out?',
          'Your projects stay on this device — they were never uploaded. You can sign back in any time.',
          'Sign out');
        if(!ok) return;
        await signOutUser();
        state.authMode = 'signIn'; state.authMsg = null;
        redraw();
      };
      const chg = document.getElementById('authChangePw');
      if(chg) chg.onclick = ()=>{ state.authMode = 'newPassword'; state.authMsg = null; redraw(); };
      const savePw = document.getElementById('authSavePw');
      if(savePw) savePw.onclick = async ()=>{
        const pw = val('authNewPw');
        if(!pw || pw.length < 6){ state.authMsg = {ok:false, text:'Passwords need to be at least 6 characters.'}; return redraw(); }
        const r = await updatePassword(pw);
        state.authMsg = { ok:r.ok, text:r.message };
        if(r.ok) state.authMode = 'signIn';
        redraw();
      };

      const btn = document.getElementById('sbTestBtn');
      if(!btn) return;
      btn.onclick = async ()=>{
        const box = document.getElementById('sbStatus');
        btn.disabled = true;
        box.innerHTML = '<span class="sb-dot sb-dot-idle"></span><span>Testing…</span>';
        const r = await testSupabaseConnection();
        box.innerHTML = '<span class="sb-dot ' + (r.ok ? 'sb-dot-ok' : 'sb-dot-fail') + '"></span>' +
                        '<span>' + esc(r.message) + '</span>';
        btn.disabled = false;
      };
    }
  },
  about: {
    content: () => `
      <div class="paper" style="margin-top:0;">
        <div class="card-title" style="font-size:14px;">${APP_NAME}</div>
        <p class="card-sub" style="margin:6px 0 0;line-height:1.5;">A beginner-friendly production toolkit for filmmakers and content creators — script, shot lists, call sheets, budgeting, and more, with built-in guides for learning the official way things are done.</p>
      </div>
    `,
    wire: ()=>{}
  }
};
function openProfileEditModal(app){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>Edit Profile</h3>
    <div class="settings-profile-row">
      <div class="avatar-circle" id="avatarCircleModal" style="background:${state.profile.color};">${esc(initialsFor(state.profile.name))}</div>
      <div class="avatar-swatches">
        ${AVATAR_COLORS.map(c=>`<div class="avatar-swatch ${c===state.profile.color?'selected':''}" data-color="${c}" style="background:${c};"></div>`).join('')}
      </div>
    </div>
    <div class="form-grid" style="margin-top:14px;">
      <div class="field"><label>Name</label><input type="text" id="profNameModal" value="${esc(state.profile.name)}" placeholder="Your name"></div>
      <div class="field"><label>Role</label><input type="text" id="profRoleModal" value="${esc(state.profile.role)}" placeholder="e.g. Director, Editor" list="roleOptionsModal">
        <datalist id="roleOptionsModal">
          <option value="Director"><option value="Producer"><option value="Writer">
          <option value="Cinematographer / DP"><option value="Editor"><option value="1st AD">
          <option value="Content Creator">
        </datalist>
      </div>
      <div class="field" style="grid-column:1/-1;"><label>Email</label><input type="text" id="profEmailModal" value="${esc(state.profile.email)}" placeholder="you@example.com"></div>
    </div>
    <div class="toolbar" style="margin-top:14px;margin-bottom:0;">
      <button class="btn btn-outline btn-sm" id="addSelfBtnModal">+ Add me to this project's Cast &amp; Crew</button>
    </div>
    <button class="btn btn-tape btn-sm" id="closeProfileModal" style="margin-top:16px;width:100%;">Done</button>
  </div>`;
  document.body.appendChild(overlay);
  function closeAndRefresh(){ overlay.remove(); renderSettingsScreen(app); }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeAndRefresh(); });
  overlay.querySelector('#closeProfileModal').onclick = closeAndRefresh;
  overlay.querySelectorAll('.avatar-swatch').forEach(sw=>{
    sw.onclick = ()=>{
      state.profile.color = sw.dataset.color;
      saveProfile();
      overlay.querySelector('#avatarCircleModal').style.background = sw.dataset.color;
      overlay.querySelectorAll('.avatar-swatch').forEach(x=>x.classList.remove('selected'));
      sw.classList.add('selected');
    };
  });
  overlay.querySelector('#profNameModal').addEventListener('input', (e)=>{
    state.profile.name = e.target.value;
    overlay.querySelector('#avatarCircleModal').textContent = initialsFor(state.profile.name);
    saveProfile();
  });
  overlay.querySelector('#profRoleModal').addEventListener('input', (e)=>{ state.profile.role = e.target.value; saveProfile(); });
  overlay.querySelector('#profEmailModal').addEventListener('input', (e)=>{ state.profile.email = e.target.value; saveProfile(); });
  overlay.querySelector('#addSelfBtnModal').onclick = addSelfToContacts;
}

            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.55 1.55M7.15 16.85l-1.55 1.55M18.4 18.4l-1.55-1.55M7.15 7.15L5.6 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      ${viewOnly ? `<div class="viewer-banner">${UI_ICONS.eye} Viewing as ${esc((PERMISSION_ROLES[myEffectivePermission(proj)]||PERMISSION_ROLES.viewer).label)} — Read-Only</div>` : ''}
    </header>
    <div class="layout">
      <div class="drawer-backdrop ${state.drawerOpen ? 'open' : ''}" id="drawerBackdrop"></div>
      <nav class="rail ${state.drawerOpen ? 'open' : ''}">
        <div class="rail-drawer-head">
          <span class="rail-drawer-title">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><rect x="2" y="4" width="5" height="16" stroke="currentColor" stroke-width="1.2"/></svg>
            ${APP_NAME}
          </span>
          <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">✕</button>
        </div>
        <button class="rail-all-projects-btn" id="allProjectsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          All Projects
        </button>
        <div class="rail-eyebrow">Departments</div>
        <div class="rail-scroll-body">
          <div class="rail-depts">
            ${DEPARTMENTS.map(d=>renderDeptNav(d, proj)).join('')}
          </div>
          <div class="rail-active-project">
            <button class="rail-project-toggle ${state.projectPanelOpen?'open':''}" id="projectPanelToggle">
              <span class="rail-project-toggle-text">
                <span class="k">Active Project</span>
                <span class="rail-project-name">${esc(proj.name)}</span>
              </span>
              <span class="chevron">▸</span>
            </button>
            <div class="rail-project-panel ${state.projectPanelOpen?'open':''}">
              <button class="rail-home-link" id="goHomeBtn">&larr; All Projects</button>
              <select id="projSelect" class="rail-project-select">
                ${state.projects.map(p=>`<option value="${p.id}" ${p.id===state.currentProjectId?'selected':''}>${esc(p.name)}${p.shared?' (shared)':''}</option>`).join('')}
              </select>
              <div class="rail-project-badge-row">
                <span class="type-badge ${proj.type}">${esc(typeInfo.label)}</span>
                <span class="proj-count">${esc(hatsLabel(proj))}</span>
              </div>
              <div class="rail-project-actions">
                <button class="btn btn-outline btn-sm" id="newProjBtn">+ New</button>
                <button class="btn btn-outline btn-sm" id="collabBtn">Collaborate</button>
              </div>
              <button class="rail-delete-btn" id="delProjBtn">Remove this project</button>
            </div>
          </div>
        </div>
      </nav>
      <main id="mainView"></main>
    </div>
    <nav class="bottom-tabs">
      ${bottomTabsFor(proj).map(t=>{
        const isActive = t.view !== '__more__' && (state.view===t.view || effectiveNavView()===t.view);
        return `<div class="bottom-tab ${isActive?'active':''}" data-view="${t.view}">
          <span class="bt-icon">${t.icon}</span>
          <span class="bt-label">${esc(t.label)}</span>
        </div>`;
      }).join('')}
    </nav>
  `;

  document.getElementById('projSelect').onchange = (e)=>switchProject(e.target.value);
  document.getElementById('newProjBtn').onclick = openNewProjectModal;
  document.getElementById('collabBtn').onclick = openCollabModal;
  document.getElementById('delProjBtn').onclick = deleteCurrentProject;
  document.getElementById('goHomeBtn').onclick = ()=>{ state.atHome = true; state.drawerOpen = false; render(); };
  document.getElementById('allProjectsBtn').onclick = ()=>{ state.atHome = true; state.drawerOpen = false; render(); };
  document.getElementById('projectPanelToggle').onclick = ()=>{ state.projectPanelOpen = !state.projectPanelOpen; render(); };
  document.getElementById('hamburgerBtn').onclick = ()=>{ state.drawerOpen = true; render(); };
  document.getElementById('drawerCloseBtn').onclick = ()=>{ state.drawerOpen = false; render(); };
  document.getElementById('drawerBackdrop').onclick = ()=>{ state.drawerOpen = false; render(); };
  document.getElementById('settingsBtn').onclick = ()=>{ state.atSettings = true; state.settingsPage = null; render(); };
  document.getElementById('searchBtn').onclick = openGlobalSearchModal;
  document.querySelectorAll('.bottom-tab').forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.view;
      if(v === '__more__'){ state.drawerOpen = true; render(); return; }
      state.view = v;
      state.openDept = findDeptId(v) || state.openDept;
      render();
    };
  });
  document.querySelectorAll('.dept-btn[data-dept]').forEach(el=>{
    el.onclick = ()=>{
      const deptId = el.dataset.dept;
      const dept = DEPARTMENTS.find(d=>d.id===deptId);
      const tools = visibleTools(dept, proj);
      if(tools.length === 1){
        state.view = tools[0].view;
        state.openDept = deptId;
        state.drawerOpen = false;
      } else {
        state.openDept = (state.openDept === deptId) ? null : deptId;
      }
      render();
    };
  });
  document.querySelectorAll('.dept-tool-item').forEach(el=>{
    el.onclick = ()=>{
      state.view = el.dataset.view;
      state.openDept = el.dataset.dept;
      state.drawerOpen = false;
      render();
    };
  });

  recordRecentView();
  renderMain(document.getElementById('mainView'));
  wireEmptyStateActions();
}

function isToolVisible(t, proj){
  if(t.narrativeOnly && proj.type!=='narrative') return false;
  if(t.hideForTypes && t.hideForTypes.includes(proj.type)) return false;
  if(t.seriesOnly && proj.subtype !== 'series') return false;
  if(t.proOnly && state.mode!=='pro'){
    const unlocks = unionForHats(ROLE_UNLOCKS, proj);
    if(!unlocks.includes(t.view)) return false;
  }
  return true;
}
function visibleTools(dept, proj){
  return dept.tools.filter(t=>isToolVisible(t, proj));
}
function allToolsFlat(){
  return DEPARTMENTS.flatMap(d=>d.tools.map(t=>({...t, deptId:d.id})));
}
function labelForView(view){
  const t = allToolsFlat().find(x=>x.view===view);
  return t ? t.label : view;
}
function iconForView(view){
  if(view === 'dashboard') return DEPT_ICONS.overview;
  if(TOOL_ICONS[view]) return TOOL_ICONS[view];
  // 'learn' is the only tool in its department, so the department glyph is
  // already unique to it and falls through correctly.
  const deptId = findDeptId(view);
  return DEPT_ICONS[deptId] || DEPT_ICONS.more;
}
function effectiveNavView(){ return DETAIL_PARENT[state.view] || state.view; }
function findDeptId(view){
  for(const d of DEPARTMENTS){ if(d.tools.some(t=>t.view===view)) return d.id; }
  return null;
}
function isViewAvailable(view, proj){
  const t = allToolsFlat().find(x=>x.view===view);
  if(!t) return view === 'dashboard';
  return isToolVisible(t, proj);
}
function defaultQuickMenu(proj){
  const hatPicks = unionForHats(ROLE_QUICK_MENU, proj).filter(v=>isViewAvailable(v, proj));
  // Cap at 4: the nav bar appends its own "More" tab, and five short
  // labels is already the most that fits legibly on a phone.
  if(hatPicks.length) return hatPicks.slice(0, 4);
  const picks = ['dashboard', 'script', 'shotlists'];
  picks.push(proj.type === 'content' ? 'broll' : 'callsheets');
  return picks;
}
function quickMenuFor(proj){
  let picks = null;
  if(proj.customTabs && proj.customTabs.length){
    picks = proj.customTabs.filter(v=>isViewAvailable(v, proj)).slice(0,5);
  }
  if(!picks || picks.length===0){
    picks = defaultQuickMenu(proj);
  }
  return picks;
}
function bottomTabsFor(proj){
  const tabs = quickMenuFor(proj).map(v=>({view:v, label:labelForView(v), icon:iconForView(v)}));
  tabs.push({view:'__more__', label:'More', icon:DEPT_ICONS.more});
  return tabs;
}

      if(boxes().filter(b=>b.checked).length > 5){ cb.checked = false; }

/* =========================================================
   SUN & MOON — computed locally from latitude, longitude and
   date using the standard NOAA solar equations. No API, no key,
   no network. This matters on location: the weather feature needs
   signal, these numbers do not.

   Verified against published times: within about a minute at mid
   latitudes, a few minutes near the equator and at extreme dates.
   That is well inside the tolerance of a shooting schedule. Accuracy
   degrades near the poles, where the sun may not rise or set at all —
   those cases return null rather than a confidently wrong number.
========================================================= */
const SUN_EVENT_ANGLES = {
  blueStart:   -6,      // civil twilight begins — blue hour opens
  sunrise:     -0.833,  // upper limb visible, allowing for refraction
  goldenEnd:    6,      // sun clears 6°, golden light is gone
};
function toRad(d){ return d * Math.PI / 180; }
function toDeg(r){ return r * 180 / Math.PI; }
function daysSinceJ2000(date){
  return (date.getTime() / 86400000) - 10957.5;
}
/* Returns solar noon and the hour angle machinery for a given day.
   The longitude correction must stay fractional — rounding it away
   yields local solar time instead of UTC, which is silently correct
   at Greenwich and hours wrong everywhere else. */
function solarBasis(date, lon){
  const n = Math.round(daysSinceJ2000(date));   // whole days since J2000
  const jStar = n - lon / 360;                  // mean solar time, fraction preserved
  const meanAnomaly = (357.5291 + 0.98560028 * jStar) % 360;
  const M = toRad(meanAnomaly);
  const center = 1.9148 * Math.sin(M) + 0.0200 * Math.sin(2*M) + 0.0003 * Math.sin(3*M);
  const eclipticLon = (meanAnomaly + center + 180 + 102.9372) % 360;
  const L = toRad(eclipticLon);
  const transit = 2451545.0 + jStar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2*L);
  const declination = Math.asin(Math.sin(L) * Math.sin(toRad(23.44)));
  return { transit, declination };
}
/* Local time (as a Date) when the sun crosses a given elevation.
   Returns {rise, set} or nulls when the sun never reaches it. */
function sunAtAngle(date, lat, lon, angleDeg){
  const { transit, declination } = solarBasis(date, lon);
  const latR = toRad(lat);
  const cosH = (Math.sin(toRad(angleDeg)) - Math.sin(latR) * Math.sin(declination))
             / (Math.cos(latR) * Math.cos(declination));
  if(cosH > 1 || cosH < -1) return { rise:null, set:null }; // never reached today
  const H = toDeg(Math.acos(cosH)) / 360;
  const jdToDate = (jd)=> new Date((jd - 2440587.5) * 86400000);
  return { rise: jdToDate(transit - H), set: jdToDate(transit + H) };
}
/* Full set of light windows for a date and place. */
function sunTimesFor(date, lat, lon){
  const sr  = sunAtAngle(date, lat, lon, SUN_EVENT_ANGLES.sunrise);
  const blue= sunAtAngle(date, lat, lon, SUN_EVENT_ANGLES.blueStart);
  const gold= sunAtAngle(date, lat, lon, SUN_EVENT_ANGLES.goldenEnd);
  if(!sr.rise) return null;
  return {
    sunrise: sr.rise,
    sunset:  sr.set,
    // Morning: blue hour runs to sunrise, golden from sunrise until 6°.
    blueMorningStart: blue.rise,
    goldenMorningEnd: gold.rise,
    // Evening mirrors it.
    goldenEveningStart: gold.set,
    blueEveningEnd: blue.set
  };
}
/* Moon phase from the synodic cycle. Phase name and illuminated
   fraction are what actually affect a night exterior; moonrise
   timing needs full lunar theory and is deliberately not faked here. */
const MOON_PHASES = [
  'New Moon','Waxing Crescent','First Quarter','Waxing Gibbous',
  'Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'
];
function moonInfoFor(date){
  const synodic = 29.530588853;
  // Reference new moon: 2000-01-06 18:14 UTC
  const refNewMoon = Date.UTC(2000, 0, 6, 18, 14) / 86400000;
  const days = (date.getTime() / 86400000) - refNewMoon;
  let age = days % synodic;
  if(age < 0) age += synodic;
  const fraction = age / synodic;
  const illumination = (1 - Math.cos(2 * Math.PI * fraction)) / 2;
  let idx = Math.floor(fraction * 8 + 0.5) % 8;
  return {
    age: age,
    phase: MOON_PHASES[idx],
    illumination: illumination,
    percent: Math.round(illumination * 100)
  };
}
function fmtClock(d){
  if(!d) return '—';
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

/* Shared accessor: sun/moon need a lat/lon, and the weather feature

}

/* Records which tools you've actually been working in, so the dashboard
   can offer a way back. Detail views collapse to their parent tool —
   "budget-detail" is still "Budget" as far as picking up work goes.
   Views that aren't places you leave work (dashboard, learn, trash)
   are skipped, or the list would fill with noise. */
const RECENT_SKIP = ['dashboard','learn','trash','settings'];
let lastRecordedView = null;
function recordRecentView(){
  const proj = currentProject();
  if(!proj || !state.projectData || state.atHome || state.atSettings) return;
  const parent = DETAIL_PARENT[state.view] || state.view;
  if(RECENT_SKIP.includes(parent)) return;
  if(!allToolsFlat().some(t=>t.view === parent)) return;   // only real tools
  if(parent === lastRecordedView) return;                   // render() runs often
  lastRecordedView = parent;
  const pd = state.projectData;
  pd.recent = (pd.recent || []).filter(r=>r.view !== parent);
  pd.recent.unshift({ view: parent, at: Date.now() });
  pd.recent = pd.recent.slice(0, 8);
  debouncedSaveProject();
}
function relativeTime(ts){
  const mins = Math.floor((Date.now() - ts) / 60000);
  if(mins < 1)  return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24)  return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if(days === 1) return 'yesterday';
  if(days < 7)  return days + 'd ago';
  return new Date(ts).toLocaleDateString([], {month:'short', day:'numeric'});
}

/* Draws the moon at its actual phase. The terminator is an ellipse whose
   width tracks cos(2*pi*phase): a straight line at the quarters, full
   width at new and full. Cheaper and sharper than an emoji, and it
   actually tells you what you'd see. */
function moonGlyphSvg(fraction, size){
  const r = 9, cx = 10, cy = 10;
  const k = Math.cos(2 * Math.PI * fraction);   // +1 new, 0 quarter, -1 full
  const rx = Math.abs(k) * r;
  const waxing = fraction < 0.5;                // lit on the right while waxing
  const outerSweep = waxing ? 1 : 0;
  // Near new (k>0) the terminator curves back across the lit side, carving
  // the disc down to a crescent, so the inner arc must sweep opposite the
  // outer one. Near full (k<0) it sweeps the same way and fills the disc.
  const innerSweep = (k > 0) ? (1 - outerSweep) : outerSweep;
  const d = `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${outerSweep} ${cx} ${cy+r} `
          + `A ${rx.toFixed(2)} ${r} 0 0 ${innerSweep} ${cx} ${cy-r} Z`;
  return `<svg class="tl-moon" viewBox="0 0 20 20" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/>
    <path d="${d}" fill="currentColor"/>
  </svg>`;
}
/* Dashboard variant: only the windows you'd actually act on today.
   Sunrise and sunset are the boundaries of the golden windows, so
   printing them again as their own figures just says it twice. */
function todaysLightHtml(){
  const loc = sunMoonLocation();
  if(!loc) return '';
  const date = new Date();
  const s = sunTimesFor(date, loc.lat, loc.lon);
  if(!s) return '';
  const moon = moonInfoFor(date);
  const now = Date.now();
  const live = (a,b)=> (now >= a.getTime() && now <= b.getTime()) ? ' tl-now' : '';
  const range = (a,b)=> `${fmtClock(a).replace(/\s?[AP]M$/,'')}–${fmtClock(b)}`;
  return `<div class="today-light">
    <div class="tl-sun">
      <span class="tl-key">Golden</span>
      <span class="tl-win${live(s.sunrise, s.goldenMorningEnd)}">${range(s.sunrise, s.goldenMorningEnd)}</span>
      <span class="tl-div"></span>
      <span class="tl-win${live(s.goldenEveningStart, s.sunset)}">${range(s.goldenEveningStart, s.sunset)}</span>
    </div>
    <div class="tl-moon-group" title="${esc(moon.phase)} — ${moon.percent}% illuminated">
      ${moonGlyphSvg(moon.age / 29.530588853, 13)}
      <span class="tl-moon-pct">${moon.percent}%</span>
      <span class="tl-moon-name">${esc(moon.phase)}</span>
    </div>
  </div>`;
}

/* The "+" badge on empty states was decoration, which meant it looked
   like a button and did nothing when tapped — a false affordance in
   roughly two dozen places. This makes it honest everywhere at once:
   if the screen has a create button, the empty state triggers it; if
   there's nothing to trigger, the badge is dropped rather than lying. */
function wireEmptyStateActions(){
  const main = document.getElementById('mainView');
  if(!main) return;
  // Not every tool uses a FAB — several put a "+ New …" button in the
  // toolbar instead. Matching only on a leading "+" keeps this from
  // ever firing an Export or a Delete by accident.
  const creator = main.querySelector('.fab-add')
    || Array.from(main.querySelectorAll('.toolbar button'))
         .find(b => b.textContent.trim().startsWith('+'));
  main.querySelectorAll('.empty:not(.empty-plain):not(.empty-action)').forEach(el=>{
    if(!creator){ el.classList.add('empty-plain'); return; }
    el.classList.add('empty-clickable');
    el.onclick = ()=> creator.click();
  });
}

function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  if(q.length < 2) return [];
  const pd = state.projectData;
  const results = [];
  const cap = {};
  function add(category, label, sublabel, onOpen){
    cap[category] = (cap[category]||0) + 1;
    if(cap[category] > 5) return;
    results.push({category, label, sublabel, onOpen});
  }
  const goto = (view, setup) => () => { if(setup) setup(); state.view = view; state.openDept = findDeptId(view) || state.openDept; render(); };

  // Tools themselves — so search works as a way to NAVIGATE, not only to
  // find content. Without this, searching "cast" only matched people whose
  // name happened to contain "cast"; it could never offer the Cast & Crew
  // tool. Listed first so jumping to a tool outranks content matches.
  const searchProj = currentProject();
  if(searchProj){
    allToolsFlat().forEach(t=>{
      if(!isToolVisible(t, searchProj)) return;
      const label = t.label.toLowerCase();
      const aliases = TOOL_ALIASES[t.view] || [];
      if(label.includes(q) || aliases.some(a=>a.includes(q))){
        const dept = DEPARTMENTS.find(d=>d.id===t.deptId);
        add('Tools', t.label, dept ? 'Open ' + dept.label : 'Open', goto(t.view));
      }
    });
  }

  // Learn content — guides and Learn Film chapters. Without this the
  // only way to find the walkie guide is to already know it exists.
  Object.entries(GUIDES).forEach(([key,g])=>{
    if(!(g.types.includes('all') || (searchProj && g.types.includes(searchProj.type)))) return;
    if(g.title.toLowerCase().includes(q)){
      add('Learn', g.title, 'Guide', ()=>{ state.view='learn'; state.learnTab='guides'; state.learnTopic=key; state.academyTopic=null; render(); });
    }
  });
  Object.entries(ACADEMY_CHAPTERS).forEach(([key,c])=>{
    if((c.title+' '+c.desc).toLowerCase().includes(q)){
      add('Learn', c.title, 'Learn Film', ()=>{ state.view='learn'; state.learnTab='academy'; state.academyTopic=key; state.learnTopic=null; render(); });
    }
  });

  // Script(s)
  pd.scripts.forEach(script=>{
    script.blocks.forEach(b=>{
      if((b.text||'').toLowerCase().includes(q)){
        add('Script', b.text.length>70?b.text.slice(0,70)+'…':b.text, `${BLOCK_LABELS[b.type]||''} · ${script.name}`, goto('script', ()=>{ pd.currentScriptId = script.id; }));
      }
    });
    if(script.titlePage && ((script.titlePage.title||'').toLowerCase().includes(q) || (script.titlePage.writtenBy||'').toLowerCase().includes(q))){
      add('Title Page', script.titlePage.title || '(untitled)', `Title page · ${script.name}`, goto('script', ()=>{ pd.currentScriptId = script.id; state.scriptSubtab = 'titlepage'; }));
    }
  });
  // Script Breakdown
  Object.entries(pd.breakdown).forEach(([sceneId, entries])=>{
    (entries||[]).forEach(e=>{
      if((e.text||'').toLowerCase().includes(q)){
        add('Breakdown', e.text, breakdownCategory(e.category).label, goto('breakdown-detail', ()=>{ state.currentBreakdownSceneId = sceneId; }));
      }
    });
  });
  // Sides
  pd.sides.forEach(s=>{
    if(s.name.toLowerCase().includes(q) || (s.characterName||'').toLowerCase().includes(q)){
      add('Sides', s.name, s.characterName ? 'For '+s.characterName : '', goto('sides-detail', ()=>{ state.currentSidesId = s.id; }));
    }
  });
  // Shot Lists
  pd.shotlists.forEach(sl=>{
    if(sl.name.toLowerCase().includes(q)){
      add('Shot Lists', sl.name, sl.shots.length+' shots', goto('shotlist-detail', ()=>{ state.currentShotlistId = sl.id; }));
    }
    sl.shots.forEach(s=>{
      if((s.desc||'').toLowerCase().includes(q) || (s.notes||'').toLowerCase().includes(q)){
        add('Shot Lists', s.desc || '(no description)', 'In "'+sl.name+'"', goto('shotlist-detail', ()=>{ state.currentShotlistId = sl.id; }));
      }
    });
  });
  // Storyboards
  pd.storyboards.forEach(b=>{
    if(b.name.toLowerCase().includes(q)){
      add('Storyboards', b.name, b.panels.length+' panels', goto('storyboard-detail', ()=>{ state.currentStoryboardId = b.id; }));
    }
  });
  // B-Roll
  pd.brollEntries.forEach(e=>{
    if((e.desc||'').toLowerCase().includes(q) || (e.location||'').toLowerCase().includes(q) || (e.tags||'').toLowerCase().includes(q)){
      add('B-Roll', e.desc || '(no description)', e.location||'', goto('broll'));
    }
  });
  // Camera Reports
  pd.cameraReports.forEach(r=>{
    if(r.name.toLowerCase().includes(q)){
      add('Camera Reports', r.name, r.date||'', goto('camerareport-detail', ()=>{ state.currentCameraReportId = r.id; }));
    }
  });
  // Continuity
  pd.continuity.forEach(e=>{
    if((e.subject||'').toLowerCase().includes(q) || (e.description||'').toLowerCase().includes(q)){
      add('Continuity', e.subject || '(no subject)', e.category==='wardrobe'?'Wardrobe':'Set', goto('continuity'));
    }
  });
  // Lighting
  pd.lighting.forEach(l=>{
    if(l.name.toLowerCase().includes(q)){
      add('Lighting', l.name, '', goto('lighting-detail', ()=>{ state.currentLightingId = l.id; }));
    }
  });
  // Call Sheets
  pd.callsheets.forEach(cs=>{
    if((cs.title||'').toLowerCase().includes(q) || (cs.location||'').toLowerCase().includes(q) || (cs.notes||'').toLowerCase().includes(q)){
      add('Call Sheets', cs.title || 'Untitled', cs.date||'', goto('callsheet-detail', ()=>{ state.currentCallsheetId = cs.id; }));
    }
  });
  // Shooting Schedule
  pd.shootDays.forEach(d=>{
    if(d.label.toLowerCase().includes(q)){
      add('Shooting Schedule', d.label, d.date||'', goto('schedule'));
    }
  });
  // Docs
  pd.docs.forEach(d=>{
    if(d.name.toLowerCase().includes(q) || (d.body||'').toLowerCase().includes(q)){
      add('Docs', d.name, d.templateLabel||'', goto('doc-detail', ()=>{ state.currentDocId = d.id; }));
    }
  });
  // Budgets
  pd.budgets.forEach(b=>{
    if(b.name.toLowerCase().includes(q)){
      add('Budget', b.name, '', goto('budget-detail', ()=>{ state.currentBudgetId = b.id; }));
    }
    b.categories.forEach(cat=>{
      cat.items.forEach(it=>{
        if((it.label||'').toLowerCase().includes(q)){
          add('Budget', it.label, 'In "'+b.name+'"', goto('budget-detail', ()=>{ state.currentBudgetId = b.id; }));
        }
      });
    });
  });
  // Contacts
  pd.contacts.forEach(c=>{
    if((c.name||'').toLowerCase().includes(q) || (c.role||'').toLowerCase().includes(q)){
      add('Cast & Crew', c.name || '(unnamed)', c.role||c.kind, goto('contacts'));
    }
  });
  // Locations
  pd.locations.forEach(l=>{
    if((l.name||'').toLowerCase().includes(q) || (l.address||'').toLowerCase().includes(q)){
      add('Locations', l.name || '(unnamed)', l.address||'', goto('locations'));
    }
  });
  // Notes
  pd.notes.forEach(n=>{
    if((n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q)){
      add('Notes', n.title || '(untitled)', '', goto('notes'));
    }
  });
  // Tasks
  pd.tasks.forEach(t=>{
    if((t.text||'').toLowerCase().includes(q)){
      add('Tasks', t.text, t.done?'Done':'Not done', goto('tasks'));
    }
  });
  return results;
}
function openGlobalSearchModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>Search this project</h3>
    <input type="text" id="searchInput" placeholder="Search scenes, shots, notes, tasks, everything…" style="width:100%;border:1px solid var(--line);border-radius:var(--radius-input);padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:14px;background:var(--surface);color:var(--ink);">
    <div id="searchResults"></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const input = overlay.querySelector('#searchInput');
  const resultsEl = overlay.querySelector('#searchResults');
  setTimeout(()=>input.focus(), 30);
  function draw(){
    const q = input.value;
    if(q.trim().length < 2){
      resultsEl.innerHTML = '<p class="modal-note">Type at least 2 characters to search.</p>';
      return;
    }
    const results = runGlobalSearch(q);
    if(!results.length){
      resultsEl.innerHTML = '<div class="empty empty-plain"><b>No matches</b>Try a different word or check your spelling.</div>';
      return;
    }
    const byCategory = {};
    results.forEach(r=>{ (byCategory[r.category] = byCategory[r.category]||[]).push(r); });
    resultsEl.innerHTML = `<div class="picker-list" style="max-height:55vh;">
      ${Object.entries(byCategory).map(([cat, items])=>`
        <div class="search-cat-label">${esc(cat)}</div>
        ${items.map((r,i)=>`<div class="picker-item search-result" data-cat="${esc(cat)}" data-idx="${i}">
          <div class="card-title" style="font-size:13.5px;">${esc(r.label)}</div>
          ${r.sublabel ? `<div class="card-sub">${esc(r.sublabel)}</div>` : ''}
        </div>`).join('')}
      `).join('')}
    </div>`;
    resultsEl.querySelectorAll('.search-result').forEach(el=>{
      const item = byCategory[el.dataset.cat][parseInt(el.dataset.idx)];
      el.onclick = ()=>{ overlay.remove(); item.onOpen(); };
    });
  }
  input.addEventListener('input', draw);
  draw();
}

      }

    };
  });
}
async function handleScriptImportAsNew(file, main){
  const name = file.name.toLowerCase();
  const btn = document.getElementById('importScriptMgmtBtn');
  if(btn){ btn.textContent = 'Importing…'; btn.disabled = true; }
  try{
    let text = '';
    if(name.endsWith('.pdf')){
      text = await extractTextFromPDF(file);
    } else if(name.endsWith('.docx')){
      text = await extractTextFromDocx(file);
    } else {
      text = await readFileAsText(file);
    }
    let lines = text.split('\n');
    // Pull the title page out before classifying, just like the replace-in-
    // place import — otherwise its lines land as stray action blocks above
    // the first scene.
    const tpResult = extractTitlePage(lines);
    lines = tpResult.rest;
    if(tpResult.dropFadeIn) lines = lines.slice(1);
    const blocks = classifyLines(lines);
    if(blocks.length === 0){
      await openAlertModal('Nothing found', "That file didn't seem to contain any readable text.");
      return;
    }
    const doc = emptyScriptDoc(file.name.replace(/\.[^.]+$/, '').slice(0, 40) || 'Imported Script');
    doc.blocks = blocks;
    if(tpResult.titlePage){
      const t = tpResult.titlePage;
      Object.keys(t).forEach(k=>{ if(t[k]) doc.titlePage[k] = t[k]; });
    }
    // First script in the project: fill any title-page fields the import
    // didn't supply from the project name and profile.
    if(state.projectData.scripts.length === 0) seedFirstScriptTitlePage(doc, currentProject());
    state.projectData.scripts.push(doc);
    saveProjectData();
    renderScriptManagement(main);
  }catch(err){
    await openAlertModal('Import failed', "Couldn't read that file. Try a plain .txt or .fountain file if the issue continues.");
  } finally {
    if(btn){ btn.textContent = 'Import Script'; btn.disabled = false; }
  }
}

/* Approximate screenplay pagination — not pixel-perfect industry
   pagination (that requires real typesetting/measurement), just a
   line-count estimate used to chunk a long script into navigable
   "pages" so scrolling a full feature-length draft isn't required. */
function estimateBlockLines(b){
  const len = (b.text || '').length;
  switch(b.type){
    case 'scene': return Math.max(1, Math.ceil(len/60)) + 1;
    case 'action': return Math.max(1, Math.ceil(len/60)) + 1;
    case 'character': return 1;
    case 'parenthetical': return Math.max(1, Math.ceil(len/45));
    case 'dialogue': return Math.max(1, Math.ceil(len/35)) + 1;
    case 'transition': return 2;
    default: return 1;
  }
}
function computeScriptPages(){
  const blocks = currentScript().blocks;
  const PAGE_LINES = 55;
  const pages = [];
  let current = [];
  let lineCount = 0;
  blocks.forEach(b=>{
    const lines = estimateBlockLines(b);
    if(lineCount + lines > PAGE_LINES && current.length){
      pages.push(current);
      current = [];
      lineCount = 0;
    }
    current.push(b);
    lineCount += lines;
  });
  pages.push(current);
  return pages;
}

/* =========================================================
   SCRIPT UNDO/REDO — scoped to the script document only (not
   the whole app). Snapshots are throttled during continuous
   typing so rapid keystrokes coalesce into one undo step,
   rather than pushing a new entry per character.
========================================================= */
const SCRIPT_UNDO_MAX = 60;
const SCRIPT_UNDO_THROTTLE_MS = 1500;
let scriptUndoLastSnapshotAt = 0;
function snapshotScriptUndo(force){
  const now = Date.now();
  if(!force && now - scriptUndoLastSnapshotAt < SCRIPT_UNDO_THROTTLE_MS) return;
  scriptUndoLastSnapshotAt = now;
  const stack = state.scriptUndoStack;
  stack.push(JSON.stringify(currentScript().blocks));
  if(stack.length > SCRIPT_UNDO_MAX) stack.shift();
  state.scriptRedoStack = [];
  updateScriptUndoRedoButtons();
}
function scriptUndo(main){
  const undoStack = state.scriptUndoStack;
  if(!undoStack.length) return;
  removeScriptAutocomplete();
  const current = JSON.stringify(currentScript().blocks);
  state.scriptRedoStack.push(current);
  const prev = undoStack.pop();
  currentScript().blocks = JSON.parse(prev);
  scriptUndoLastSnapshotAt = Date.now();
  saveProjectData();
  renderScript(main);
}
function scriptRedo(main){
  const redoStack = state.scriptRedoStack;
  if(!redoStack.length) return;
  removeScriptAutocomplete();
  const current = JSON.stringify(currentScript().blocks);
  state.scriptUndoStack.push(current);
  const next = redoStack.pop();
  currentScript().blocks = JSON.parse(next);
  scriptUndoLastSnapshotAt = Date.now();
  saveProjectData();
  renderScript(main);
}
function updateScriptUndoRedoButtons(){
  const undoItem = document.getElementById('scriptUndoItem');
  const redoItem = document.getElementById('scriptRedoItem');
  if(undoItem) undoItem.classList.toggle('menubar-item-disabled', state.scriptUndoStack.length === 0);
  if(redoItem) redoItem.classList.toggle('menubar-item-disabled', state.scriptRedoStack.length === 0);
}
function buildScriptBlockRow(main, b){
  const row = document.createElement('div');
  row.className = 'sblock-row';
  const tag = document.createElement('span');
  tag.className = 'sblock-tag';
  tag.textContent = BLOCK_LABELS[b.type] || '';
  const el = document.createElement('div');
  el.className = 'sblock sb-'+b.type;
  el.contentEditable = isScriptViewOnly() ? 'false' : 'true';
  // Native browser/OS spellcheck. Free, offline, and uses the reader's
  // own dictionary. Scene headings and character cues are uppercase and
  // often proper nouns, so it is left off for those to avoid a screen
  // full of red underlines on names the dictionary will never know.
  el.spellcheck = !['scene','character','transition'].includes(b.type);
  el.dataset.id = b.id;
  el.dataset.placeholder = placeholderFor(b.type);
  el.textContent = b.text || '';
  if(b.highlight){ el.style.background = highlightColor(b.highlight, 0.35); }
  const annotateBtn = document.createElement('button');
  annotateBtn.className = 'sblock-annotate';
  annotateBtn.type = 'button';
  annotateBtn.title = b.note ? 'Has a note — click to edit' : 'Add note or highlight';
  annotateBtn.textContent = b.note ? '●' : '○';
  if(b.highlight){ annotateBtn.style.color = highlightColor(b.highlight, 1); annotateBtn.style.borderColor = highlightColor(b.highlight, 1); }
  annotateBtn.onclick = (e)=>{ e.preventDefault(); openBlockAnnotateModal(b.id, main); };
  row.appendChild(tag);
  row.appendChild(el);
  row.appendChild(annotateBtn);
  wireScriptBlock(main, el, b);
  return row;
}
/* Constrains .script-wrap to the remaining viewport space so only the
   script content scrolls, not the whole page — the toolbar above it
   stays visible. Measured via JS rather than a CSS calc(100vh - Npx),
   since raw vh has proven unreliable in this specific embedding
   sandbox before (see the earlier drawer-height fix); a fresh
   window.innerHeight read each time sidesteps that entirely. */
function fitScriptScrollArea(){
  const wrap = document.querySelector('.script-wrap');
  if(!wrap) return;
  const bottomTabs = document.querySelector('.bottom-tabs');
  const bottomReserve = (bottomTabs && getComputedStyle(bottomTabs).display !== 'none') ? bottomTabs.getBoundingClientRect().height : 0;
  const page = document.querySelector('.script-page');
  if(page){
    const rect = page.getBoundingClientRect();
    page.style.maxHeight = Math.max(280, window.innerHeight - rect.top - bottomReserve - 16) + 'px';
  }
  const navScroll = document.querySelector('.scene-nav-scroll');
  if(navScroll){
    const rect = navScroll.getBoundingClientRect();
    navScroll.style.maxHeight = Math.max(160, window.innerHeight - rect.top - bottomReserve - 16) + 'px';
  }
}
let scriptScrollFitTicking = false;
window.addEventListener('resize', ()=>{
  if(!document.querySelector('.script-wrap')) return;
  if(!scriptScrollFitTicking){
    scriptScrollFitTicking = true;
    requestAnimationFrame(()=>{ fitScriptScrollArea(); scriptScrollFitTicking = false; });
  }
}, {passive:true});
/* Which blocks land at the top of a page. Used to draw a break line in
   the continuous view, so you can see where page one ends without having
   to leave scrolling behind — the way a screenwriting app normally shows
   it. Paged view still exists for reviewing one page at a time. */
/* Scene length in pages and eighths — the unit a schedule and a budget
   are actually built from. An eighth is one eighth of a page; "2 4/8"
   means two and a half pages. Crews estimate a day's work this way, so
   the number matters as much as the page count itself. */
function sceneLengthEighths(sceneId){
  const blocks = currentScript().blocks;
  const start = blocks.findIndex(b=>b.id === sceneId);
  if(start === -1) return 0;
  let lines = 0;
  for(let i = start; i < blocks.length; i++){
    if(i > start && blocks[i].type === 'scene') break;
    lines += estimateBlockLines(blocks[i]);
  }
  // 55 lines to a page, 8 eighths to a page. Never report zero — a scene
  // that exists is at least 1/8 on a board.
  return Math.max(1, Math.round((lines / 55) * 8));
}
function formatEighths(e){
  const pages = Math.floor(e / 8);
  const rem = e % 8;
  if(pages && rem) return pages + ' ' + rem + '/8';
  if(pages) return pages + (pages === 1 ? ' page' : ' pages');
  return rem + '/8';
}
function pageStartIds(){
  const pages = computeScriptPages();
  const ids = {};
  pages.forEach((p, i)=>{ if(i > 0 && p.length) ids[p[0].id] = i + 1; });
  return { ids, total: pages.length };
}
function makePageBreak(pageNo){
  const div = document.createElement('div');
  div.className = 'page-break';
  div.innerHTML = '<span class="page-break-line"></span>'
                + '<span class="page-break-label">Page ' + pageNo + '</span>'
                + '<span class="page-break-line"></span>';
  return div;
}
function renderScriptBlocks(main, focusId, atEnd){
  const page = document.getElementById('scriptPage');
  let blocks = currentScript().blocks;
  let breaks = { ids:{}, total:1 };
  if(state.scriptViewMode !== 'paged') breaks = pageStartIds();
  if(state.scriptViewMode === 'paged'){
    const pages = computeScriptPages();
    if(focusId){
      const pageIdx = pages.findIndex(p=>p.some(b=>b.id===focusId));
      if(pageIdx !== -1) state.scriptCurrentPage = pageIdx;
    }
    if(state.scriptCurrentPage >= pages.length) state.scriptCurrentPage = Math.max(0, pages.length - 1);
    blocks = pages[state.scriptCurrentPage] || [];
    updateScriptPageIndicator(pages.length);
  }
  page.innerHTML = '';
  let i = 0;
  while(i < blocks.length){
    const b = blocks[i];
    if(b.dualGroup){
      const groupBlocks = [];
      let j = i;
      while(j < blocks.length && blocks[j].dualGroup === b.dualGroup){ groupBlocks.push(blocks[j]); j++; }
      const dualRow = document.createElement('div');
      dualRow.className = 'sblock-dual-row';
      const leftCol = document.createElement('div');
      leftCol.className = 'sblock-dual-col';
      const rightCol = document.createElement('div');
      rightCol.className = 'sblock-dual-col';
      groupBlocks.forEach(gb=>{
        (gb.dualSide === 'right' ? rightCol : leftCol).appendChild(buildScriptBlockRow(main, gb));
      });
      dualRow.appendChild(leftCol);
      dualRow.appendChild(rightCol);
      page.appendChild(dualRow);
      i = j;
    } else {
      if(breaks.ids[b.id]) page.appendChild(makePageBreak(breaks.ids[b.id]));
      page.appendChild(buildScriptBlockRow(main, b));
      i++;
    }
  }
  if(state.scriptViewMode !== 'paged') updateScriptLengthReadout(breaks.total);
  if(focusId){
    const target = page.querySelector(`[data-id="${focusId}"]`);
    if(target){
      target.focus();
      placeCaret(target, atEnd);
      target.scrollIntoView({block:'center', behavior:'smooth'});
    }
  }
}
/* Total length, shown wherever the page indicator lives. Screenplays are
   measured in pages, and roughly a page a minute of screen time — worth
   surfacing while writing rather than only on export. */
function updateScriptLengthReadout(totalPages){
  const el = document.getElementById('scriptLength');
  if(el) el.textContent = totalPages + ' pg';
}
function updateScriptPageIndicator(totalPages){
  const el = document.getElementById('scriptPageIndicator');
  if(el) el.textContent = `Page ${state.scriptCurrentPage + 1} of ${totalPages}`;
  const prevBtn = document.getElementById('scriptPrevPage');
  const nextBtn = document.getElementById('scriptNextPage');
  if(prevBtn) prevBtn.disabled = state.scriptCurrentPage === 0;
  if(nextBtn) nextBtn.disabled = state.scriptCurrentPage >= totalPages - 1;
}

const HIGHLIGHT_COLORS = [
  {key:'yellow', hex:'245,224,80'},
  {key:'green', hex:'143,209,79'},
  {key:'blue', hex:'126,200,227'},
  {key:'pink', hex:'243,166,198'},
  {key:'orange', hex:'245,166,91'},
  {key:'purple', hex:'201,160,220'},
  {key:'red', hex:'240,128,128'},
  {key:'teal', hex:'127,216,190'}
];
function highlightColor(key, alpha){
  const c = HIGHLIGHT_COLORS.find(h=>h.key===key);
  if(!c) return 'transparent';
  return `rgba(${c.hex},${alpha})`;
}
function openBlockAnnotateModal(blockId, main){
  const block = currentScript().blocks.find(b=>b.id===blockId);
  if(!block) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <h3>Note &amp; Highlight</h3>
    <label>Highlight color</label>
    <div class="highlight-swatch-row">
      <div class="highlight-swatch none ${!block.highlight?'selected':''}" data-color="" title="No highlight">✕</div>
      ${HIGHLIGHT_COLORS.map(c=>`<div class="highlight-swatch ${block.highlight===c.key?'selected':''}" data-color="${c.key}" style="background:rgba(${c.hex},0.75);" title="${c.key}"></div>`).join('')}
    </div>
    <label style="margin-top:16px;">Note</label>
    <textarea id="blockNoteInput" rows="4" style="width:100%;border:1px solid var(--line);border-radius:var(--radius-input);padding:9px 11px;font-family:'Inter',sans-serif;font-size:13.5px;background:var(--surface);color:var(--ink);">${esc(block.note||'')}</textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline btn-sm" id="annotateCancel">Cancel</button>
      <button class="btn btn-tape btn-sm" id="annotateSave">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  let chosenColor = block.highlight || '';
  overlay.querySelectorAll('.highlight-swatch').forEach(sw=>{
    sw.onclick = ()=>{
      overlay.querySelectorAll('.highlight-swatch').forEach(x=>x.classList.remove('selected'));
      sw.classList.add('selected');
      chosenColor = sw.dataset.color;
    };
  });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#annotateCancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#annotateSave').onclick = ()=>{
    block.highlight = chosenColor || null;
    block.note = overlay.querySelector('#blockNoteInput').value.trim();
    saveProjectData();
    overlay.remove();
    if(state.view === 'script') renderScriptBlocks(main);
    else if(state.view === 'sides-detail'){
      const s = state.projectData.sides.find(x=>x.id===state.currentSidesId);
      if(s) renderSidesPreview(s);
    }
  };
}

function placeholderFor(type){
  return {
    scene:'INT. LOCATION - DAY', action:'Describe the action...',
    character:'CHARACTER NAME', parenthetical:'(beat)',
    dialogue:'Dialogue...', transition:'CUT TO:',
    shot:'CLOSE ON: ...', newact:'ACT ONE', endact:'END OF ACT ONE'
  }[type] || '';
}

function placeCaret(el, atEnd){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(!atEnd ? true : false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function wireScriptBlock(main, el, block){
  el.addEventListener('input', ()=>{
    snapshotScriptUndo(false);
    block.text = el.textContent;
    if(block.type==='action' && /^(INT|EXT|EST|INT\/EXT|I\/E)[\.\s]/i.test(block.text.trim())){
      block.type = 'scene';
      el.className = 'sblock sb-scene';
      const tag = el.previousElementSibling;
      if(tag) tag.textContent = BLOCK_LABELS.scene;
    }
    debouncedSaveProject();
    renderSceneNav(main);
    updateScriptAutocomplete(el, block);
  });

  el.addEventListener('keydown', (e)=>{
    const blocks = currentScript().blocks;
    const idx = blocks.findIndex(b=>b.id===block.id);
    if(e.key === 'Tab' || e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Escape'){
      removeScriptAutocomplete();
    }

    if(e.key === 'Tab'){
      e.preventDefault();
      snapshotScriptUndo(true);
      let ci = BLOCK_CYCLE.indexOf(block.type);
      ci = e.shiftKey ? (ci-1+BLOCK_CYCLE.length)%BLOCK_CYCLE.length : (ci+1)%BLOCK_CYCLE.length;
      block.type = BLOCK_CYCLE[ci];
      el.className = 'sblock sb-'+block.type;
      el.dataset.placeholder = placeholderFor(block.type);
      const tag = el.previousElementSibling;
      if(tag) tag.textContent = BLOCK_LABELS[block.type];
      state.scriptCurrentBlockType = block.type;
      updateScriptElementToolbar();
      debouncedSaveProject();
      return;
    }

    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      snapshotScriptUndo(true);
      const newBlock = {id:uid(), type: NEXT_TYPE[block.type] || 'action', text:''};
      blocks.splice(idx+1, 0, newBlock);
      saveProjectData();
      renderScriptBlocks(main, newBlock.id, false);
      renderSceneNav(main);
      return;
    }

    if(e.key === 'Enter' && e.shiftKey){
      e.preventDefault();
      document.execCommand('insertText', false, '\n');
      return;
    }

    if(e.key === 'Backspace'){
      const sel = window.getSelection();
      const atStart = sel.isCollapsed && sel.anchorOffset === 0;
      if(atStart && idx > 0){
        e.preventDefault();
        snapshotScriptUndo(true);
        const prev = blocks[idx-1];
        prev.text = prev.text + block.text;
        blocks.splice(idx, 1);
        saveProjectData();
        renderScriptBlocks(main, prev.id, true);
        renderSceneNav(main);
      }
    }
  });

  el.addEventListener('paste', (e)=>{
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if(!text) return;
    if(text.indexOf('\n') === -1) return;
    e.preventDefault();
    const parsed = classifyLines(text.split('\n'));
    if(parsed.length === 0) return;
    snapshotScriptUndo(true);
    const blocks = currentScript().blocks;
    const idx = blocks.findIndex(b=>b.id===block.id);
    if(block.text.trim()===''){ blocks.splice(idx, 1, ...parsed); }
    else { blocks.splice(idx+1, 0, ...parsed); }
    saveProjectData();
    renderScriptBlocks(main, parsed[parsed.length-1].id, true);
    renderSceneNav(main);
  });

  el.addEventListener('blur', ()=>{
    setTimeout(removeScriptAutocomplete, 150);
  });

  el.addEventListener('focus', ()=>{
    const blocks = currentScript().blocks;
    const idx = blocks.findIndex(b=>b.id===block.id);
    let sceneId = null;
    for(let i=idx; i>=0; i--){
      if(blocks[i].type === 'scene'){ sceneId = blocks[i].id; break; }
    }
    if(sceneId !== state.scriptCurrentSceneId){
      state.scriptCurrentSceneId = sceneId;
      if(state.scriptSidebarTab === 'notes'){
        const navBody = document.getElementById('sceneNavBody');
        if(navBody) renderSceneNavNotesTab(navBody, main);
      }
    }
    state.scriptCurrentBlockId = block.id;
    state.scriptCurrentBlockType = block.type;
    updateScriptElementToolbar();
  });
}

/* Reusable wiring for any File/Edit/View-style menubar: pass the
   container it lives in. Each trigger needs data-menu="key" and a
   matching dropdown with id="menu-key". Clicking a trigger toggles its
   own dropdown and closes any other open one in the same container. */
function wireMenubarTriggers(container){
  container.querySelectorAll('.menubar-trigger').forEach(trigger=>{
    trigger.onclick = (e)=>{
      e.stopPropagation();
      const dropdown = document.getElementById('menu-'+trigger.dataset.menu);
      const wasOpen = dropdown && dropdown.classList.contains('open');

/* Bold/Italic/Underline use Fountain-style plain-text markers
   (**bold**, *italic*, _underline_) rather than execCommand's HTML —
   our block storage is plain text (block.text = el.textContent), so
   any HTML execCommand would insert gets silently stripped the next
   time text changes. PDF export parses these markers for real output
   formatting; this is the same convention Highland and other
   plain-text screenwriting tools use for exactly this reason. */
function applyTextStyleMarker(marker){
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  const anchor = sel.anchorNode;
  const el = anchor && anchor.nodeType === 3 ? anchor.parentElement : anchor;
  if(!el || !el.closest || !el.closest('.sblock')) return;
  const selectedText = sel.toString();
  document.execCommand('insertText', false, marker + selectedText + marker);
}
function characterGroupRange(blocks, charIdx){
  let end = charIdx;
  while(end + 1 < blocks.length && (blocks[end+1].type === 'dialogue' || blocks[end+1].type === 'parenthetical')){
    end++;
  }
  return end;
}
async function makeDualDialogue(main){
  const blocks = currentScript().blocks;
  const curId = state.scriptCurrentBlockId;
  if(!curId){
    await openAlertModal('Select a line first', 'Click into a character or dialogue line, then use Make Dual Dialogue to pair it with the exchange right before it.');
    return;
  }
  const curIdx = blocks.findIndex(b=>b.id===curId);
  if(curIdx === -1) return;
  let charBIdx = -1;
  for(let i=curIdx; i>=0; i--){
    if(blocks[i].type === 'character'){ charBIdx = i; break; }
    if(blocks[i].type !== 'dialogue' && blocks[i].type !== 'parenthetical'){ break; }
  }
  if(charBIdx === -1){
    await openAlertModal('No character line found', 'Click into a character cue or its dialogue, then try again.');
    return;
  }
  const endB = characterGroupRange(blocks, charBIdx);
  let charAIdx = -1;
  for(let i=charBIdx-1; i>=0; i--){
    if(blocks[i].type === 'character'){ charAIdx = i; break; }
    if(blocks[i].type !== 'dialogue' && blocks[i].type !== 'parenthetical'){ break; }
  }
  if(charAIdx === -1){
    await openAlertModal('No exchange before this one', "Dual Dialogue pairs two character exchanges that are next to each other. Make sure there's a character line with dialogue right before this one.");
    return;
  }
  const endA = characterGroupRange(blocks, charAIdx);
  if(endA + 1 !== charBIdx){
    await openAlertModal("These aren't adjacent", "There's something else — like an action line — between these two exchanges. Dual Dialogue needs them to be back-to-back.");
    return;
  }
  snapshotScriptUndo(true);
  const groupId = uid();
  for(let i=charAIdx; i<=endA; i++){ blocks[i].dualGroup = groupId; blocks[i].dualSide = 'left'; }
  for(let i=charBIdx; i<=endB; i++){ blocks[i].dualGroup = groupId; blocks[i].dualSide = 'right'; }
  saveProjectData();
  renderScript(main);
}

function scriptFindMatchIds(query){

  if(!q) return [];

function initScriptFindBar(main){
  const bar = document.getElementById('scriptFindBar');
  if(!bar) return;
  const input = document.getElementById('scriptFindInput');
  const countEl = document.getElementById('scriptFindCount');
  function refreshCount(){
    const matches = scriptFindMatchIds(state.scriptFindQuery);
    if(!state.scriptFindQuery.trim()) countEl.textContent = '';
    else if(!matches.length) countEl.textContent = 'No matches';
    else countEl.textContent = `${Math.min(scriptFindCursor+1, matches.length)} of ${matches.length}`;
    return matches;
  }
  refreshCount();
  function jump(dir){
    const matches = scriptFindMatchIds(state.scriptFindQuery);
    if(!matches.length) return;
    scriptFindCursor = (scriptFindCursor + dir + matches.length) % matches.length;
    refreshCount();
    renderScriptBlocks(main, matches[scriptFindCursor], false);

    state.scriptFindOpen = false;
    state.scriptFindQuery = '';
    bar.style.display = 'none';

  input.oninput = ()=>{ state.scriptFindQuery = input.value; scriptFindCursor = 0; refreshCount(); };
  input.onkeydown = (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); jump(e.shiftKey ? -1 : 1); }
    else if(e.key === 'Escape'){ closeFind(); }
  };
  document.getElementById('scriptFindPrev').onclick = ()=>jump(-1);
